<!doctype html>
<!-- 가짜 네이버 톡톡 대화창 (팝업 · 사장님 화면 사진 11/16 모양) — partner.talk.naver.com/chat/ct/…?frm=prsv&mode=popup
     아래: 이모티콘 · 사진(그림 단추 → 파일 고르기 → 고르면 바로 보내짐) · 펜 · 파일 / 글 칸 '메시지를 입력해 주세요' · [전송]
     보낸 것은 localStorage mockTalkSent 에 남김 (시험이 확인) -->
<html lang="ko"><head><meta charset="utf-8"><title>채팅창</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .ChatRoom__list { height: 380px; overflow: auto; padding: 10px; background: #f3f3f3; }
  .ChatRoom__bubble { background: #fff; border-radius: 10px; padding: 8px; margin: 6px 0; }
  .ChatRoom__bubble.me { background: #dff5e1; margin-left: 30%; }
  .ChatInput__tools button { border: 0; background: none; cursor: pointer; }
  .ChatInput__area { display: flex; gap: 8px; padding: 10px; }
  .ChatInput__area textarea { flex: 1; height: 60px; }
</style></head><body>
<script>
  const P = new URLSearchParams(location.search), u = P.get("u") || "";
  const sent = () => { try { return JSON.parse(localStorage.getItem("mockTalkSent") || "[]"); } catch (e) { return []; } };
  const add = (r) => { const s = sent(); s.push(Object.assign({ u, at: Date.now() }, r)); localStorage.setItem("mockTalkSent", JSON.stringify(s)); };
  document.body.innerHTML = `<div class="ChatRoom__head"><b>HD</b> <span>닉네임을 입력하세요.</span> <button type="button">완료됨</button></div>
    <div class="ChatRoom__list" id="list"><div class="ChatRoom__bubble">아스타나키즈의 방문은 만족하셨나요? <a href="#">상세 내역 보기</a></div>${sent().filter((x) => x.u === u).map((x) => `<div class="ChatRoom__bubble me">${x.kind === "image" ? "[사진] " + x.file : x.text}</div>`).join("")}</div>
    <div class="ChatInput__tools"><button type="button" aria-label="이모티콘">☺</button><button type="button" class="ChatInput__image" aria-label="사진">🖼</button><input type="file" accept="image/*" class="ChatInput__file" hidden><button type="button" aria-label="펜">✎</button><button type="button" aria-label="파일">📁</button></div>
    <div class="ChatInput__area"><textarea placeholder="메시지를 입력해 주세요"></textarea><button type="button" class="ChatInput__send" disabled>전송</button></div>`;
  const ta = document.querySelector("textarea"), sendBtn = document.querySelector(".ChatInput__send"), file = document.querySelector(".ChatInput__file");
  const bubble = (t) => { const d = document.createElement("div"); d.className = "ChatRoom__bubble me"; d.textContent = t; document.getElementById("list").appendChild(d); };
  ta.addEventListener("input", () => { sendBtn.disabled = !ta.value.trim(); });
  sendBtn.addEventListener("click", () => { const t = ta.value.trim(); if (!t) return; setTimeout(() => { add({ kind: "text", text: t }); bubble(t); ta.value = ""; sendBtn.disabled = true; }, 200); });
  document.querySelector(".ChatInput__image").addEventListener("click", () => file.click());
  file.addEventListener("change", () => { const f = file.files[0]; if (!f) return; setTimeout(() => { add({ kind: "image", file: f.name, size: f.size }); bubble("[사진] " + f.name); file.value = ""; }, 300); }); // 고르면 바로 보내짐 (실제처럼)
</script>
</body></html>
