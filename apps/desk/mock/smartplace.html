<!doctype html>
<!-- 가짜 스마트플레이스 '고객' 화면 — 실제 화면 저장본(11/16 · partner.booking.naver.com/bizes/…/users)과 같은 구조 · 손님은 모두 지어낸 이름 · 번호
     왼쪽 메뉴 [고객] → 위 '예약·주문' 탭 → <form class="BookingTextSearch__root">: 선택 상자 <a role=button>(이름/전화번호 · 누르면 펼침 목록이 따로 그려짐) · <input type=search> · 지우기 · 돋보기(속 글자 '검색')
     → '<em>N</em>명' → 목록: 줄마다 이름 + 고르기 단추(radio title=이름 value=고객번호) — 앱 창처럼 좁으면 전화번호 칸이 아예 없음 (?wide=1 이면 번호 칸 · 뒷번호는 초록으로 따로)
     → 오른쪽 고객 정보(UserInfo): 이름 · [정보변경](data-tst_click_link=고객번호) · 등록경로 · 전화번호(tel 링크) · 이메일 · 특이사항 · [톡톡 대화하기](아이콘 + 글자) → 새 창(팝업) talkchat.html
     처음엔 첫 손님 고객 정보가 저절로 · 넣자마자 돋보기를 누르면 예전 값으로 찾음(React 처럼 · ?late=0 이면 바로)
     ?home=1 = 처음 화면(메뉴만) · 시험: localStorage mockSpData = 손님 목록을 바꿈 -->
<html lang="ko"><head><meta charset="utf-8"><title>스마트플레이스</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .wrap { display: grid; grid-template-columns: 170px 1fr; min-height: 100vh; }
  nav { background: #222; color: #ddd; padding: 10px 0; }
  nav a { display: block; color: #ddd; padding: 8px 14px; text-decoration: none; }
  nav a.on { color: #fff; font-weight: 700; }
  main { padding: 14px 20px; }
  .content-header-tab { list-style: none; display: flex; gap: 20px; padding: 0; } .content-header-tab .active a { font-weight: 700; border-bottom: 2px solid #000; }
  .BookingTextSearch__root { display: flex; gap: 6px; align-items: center; border: 1px solid #888; border-radius: 6px; padding: 4px 8px; width: 420px; margin: 10px 0; }
  .BookingTextSearch__select { cursor: pointer; padding-right: 14px; }
  .BookingTextSearch__input-search { flex: 1; border: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .Layer__list { position: absolute; background: #fff; border: 1px solid #ccc; display: grid; }
  .Contents__wrap { display: flex; gap: 10px; }
  .Contents__list { display: flex; } .Contents__index a { display: block; font-size: 11px; color: #999; }
  .Contents__list-row { display: flex; gap: 12px; padding: 8px; border-bottom: 1px solid #eee; }
  .Contents__list-content .Contents__list-row { height: 45px; box-sizing: border-box; align-items: center; } /* 실제 줄 높이 (약 46px) */
  .Contents__list-content .Contents__name { position: relative; }
  .Contents__list-radio { position: absolute; inset: 0; cursor: pointer; } /* 실제처럼: 이름 칸 위를 고르기 칸이 덮음 */
  .Contents__list-cell { min-width: 90px; } .Contents__list-content .Contents__name { cursor: pointer; }
  .Contents__root { max-height: calc(100vh - 190px); overflow-y: auto; } /* 목록 · 고객 정보는 이 칸 안에서 내림 (실제처럼) */
  .Loading__load_area_wrapper { padding: 10px; text-align: center; color: #999; }
  .UserInfo__root { border-left: 1px solid #ddd; padding: 10px 16px; min-width: 340px; }
  .UserInfo__item { display: flex; gap: 10px; }
  .hl { color: #03c75a; font-style: normal; font-weight: 700; }
</style></head><body>
<script>
  const P = new URLSearchParams(location.search);
  const go = (o) => { const q = new URLSearchParams(Object.assign(Object.fromEntries(P), o)); location.href = location.pathname + "?" + q; };
  // 가짜 손님 — m: 가려 보임(이름 · 번호, 목록 · 고객 정보 모두) · talk: 톡톡 대화하기 단추가 있음 · uid: 고객번호
  const DEF = [
    { id: "c1", uid: "9001", name: "김가람", phone: "010-3000-1313", m: false, talk: true, path: "네이버 예약 (kgr****)" },
    { id: "c2", uid: "9002", name: "유민석", phone: "010-3100-1313", m: true, talk: true, path: "네이버 예약 (ymsk****)" },
    { id: "c3", uid: "9003", name: "이하늘", phone: "010-3192-1313", m: false, talk: true, path: "네이버 예약 (hnl****)" },
    { id: "c4", uid: "9004", name: "정수림", phone: "010-3400-1313", m: true, talk: true, path: "네이버 예약 (jsr****)" },
    { id: "c5", uid: "9005", name: "정아림", phone: "010-3500-1313", m: true, talk: true, path: "네이버 예약 (jar****)" },
    { id: "c6", uid: "9006", name: "나단비", phone: "010-3300-2424", m: false, talk: true, path: "네이버 예약 (ndb****)" },
    { id: "c7", uid: "9007", name: "나보비", phone: "010-3600-2424", m: true, talk: true, path: "네이버 예약 (nbb****)" },
    { id: "c8", uid: "9008", name: "톡없음", phone: "010-3700-5555", m: false, talk: false, path: "직접 등록" },
    { id: "c9", uid: "9009", name: "김가람", phone: "010-3999-1313", m: false, talk: true, path: "네이버 예약 (kgr2****)" }, // 동명이인 (번호 다름)
  ];
  // 뒷번호 7777 손님 41명 — 15명씩 나오므로 맨 끝 '허다온'은 두 번 내려야 보임 (사장님 11/16: ㅎ 이름은 맨 아래)
  ["강", "고", "김", "나", "문", "박", "서", "송", "안", "오", "유", "윤", "이", "임", "장", "전", "정", "조", "최", "한"].forEach((sn, a) => ["가온", "나래"].forEach((gn, b) => {
    const i = a * 2 + b; DEF.push({ id: "p" + (i + 1), uid: String(9101 + i), name: sn + gn, phone: `010-4${String(i + 1).padStart(3, "0")}-7777`, m: i % 4 === 1, talk: true, path: "네이버 예약 (fake****)" });
  }));
  DEF.push({ id: "p41", uid: "9141", name: "허다온", phone: "010-4041-7777", m: false, talk: true, path: "네이버 예약 (hdo****)" });
  let DATA = DEF;
  try { const d = JSON.parse(localStorage.getItem("mockSpData") || "null"); if (Array.isArray(d)) DATA = d; } catch (e) { DATA = DEF; }
  const maskName = (n) => (n.length <= 2 ? n[0] + "*" : n[0] + "*".repeat(n.length - 2) + n[n.length - 1]);
  const showName = (c) => (c.m ? maskName(c.name) : c.name);
  const showPhone = (c) => (c.m ? "***-****-" + c.phone.slice(-4) : c.phone);
  const type = P.get("type") || "이름", q = P.get("q") || "", sel = P.get("sel") || "", wide = !!P.get("wide");
  const listPhone = (c) => { const p = showPhone(c); return type === "전화번호" && q ? `${p.slice(0, -4)}<em class="hl">${p.slice(-4)}</em>` : p; };
  const hits = !q ? [] : DATA.filter((c) => (type === "전화번호" ? c.phone.replace(/\D/g, "").endsWith(q.replace(/\D/g, "")) : showName(c).includes(q) || c.name === q)).sort((a, b) => showName(a).localeCompare(showName(b), "ko"));
  const nav = ["업체정보", "예약", "스마트콜", "마케팅", "리뷰", "고객", "통계", "비즈니스 스쿨"].map((t) => `<a href="#" class="${t === "고객" && !P.get("home") ? "on" : ""}" data-nav="${t}">${t}</a>`).join("");
  let main = "<h2>아스타나키즈</h2><p>업체 홈</p>";
  const c = hits.find((x) => x.id === sel) || hits[0]; // 처음엔 첫 손님 고객 정보가 저절로 (실제처럼)
  // 목록은 15명씩 (?page=), 아래로 내리면 15명 더 · n = 지금까지 불러온 수 (줄을 골라 화면을 다시 그려도 그대로)
  const PAGE = Number(P.get("page") || 15);
  let shown = Math.min(hits.length, Math.max(PAGE, Number(P.get("n") || 0)));
  const rowHtml = (x) => `<div class="Contents__list-row" data-id="${x.id}"><div class="Contents__list-cell Contents__name"><span class="Contents__text-value">${showName(x)}</span><label class="Contents__list-radio"><input type="radio" name="userListSelect" class="sr-only" title="${showName(x)}" value="${x.uid}" ${c && c.id === x.id ? "checked" : ""}><span class="Contents__label"></span></label></div>${wide ? `<div class="Contents__list-cell Contents__phone">${listPhone(x)}</div>` : ""}</div>`;
  if (!P.get("home")) {
    main = `<div class="content-header-tab-group"><ul class="content-header-tab"><li class="item active"><a class="tab" href="#">예약·주문</a></li><li class="item"><a class="tab" href="#">스마트콜</a></li></ul></div>
      <form class="BookingTextSearch__root" onsubmit="return false"><div class="BookingTextSearch__select-box"><a role="button" class="BookingTextSearch__select" id="stype">${type}</a></div>
        <input type="search" class="BookingTextSearch__input-search" id="sq" placeholder="입력후 검색하세요" value="${q}">
        <button type="button" class="BookingTextSearch__btn-clear"><svg width="12" height="12" aria-hidden="true"></svg><span class="sr-only">검색어 삭제</span></button>
        <button type="button" class="BookingTextSearch__btn-search" id="sbtn"><i class="fn fn-search" aria-hidden="true"></i><span class="sr-only">검색</span></button></form>
      <div class="CommonPagetHeader__user-count"><span class="CommonPagetHeader__number"><em class="text-success">${hits.length}</em>명</span> <a href="#">고객 개인정보보호에 대해 알아보세요!</a></div>
      <div class="Contents__root"><div class="Contents__wrap">
        <div class="Contents__list"><div class="Contents__index"><a href="#">전체</a><a href="#">ㄱ</a><a href="#">ㄴ</a><a href="#">ㄷ</a></div><div>
          <div class="Contents__list-header"><div class="Contents__list-row"><div class="Contents__list-cell Contents__name"><button type="button" class="Contents__btn-sort"><span>이름</span><i></i></button></div>${wide ? `<div class="Contents__list-cell Contents__phone"><span>전화번호</span></div>` : ""}</div></div>
          <div class="Contents__list-content">${hits.slice(0, shown).map(rowHtml).join("")}</div>
          <div class="Loading__load_area_wrapper" id="ld" hidden><span>…</span><span class="sr-only">로딩중</span></div>
        </div></div>
        <div class="Contents__dtail-group-wrap">${c ? `<div class="UserInfo__root"><div class="UserInfo__header"><span class="UserInfo__name">${showName(c)}</span><a href="users/${c.uid}" class="btn" data-tst_click_link="${c.uid}">정보변경</a></div>
          <div class="UserInfo__customer-list"><div class="UserInfo__item"><div class="UserInfo__item-title">등록경로</div><div class="UserInfo__item-dsc">${c.path}</div></div>
          <div class="UserInfo__item"><div class="UserInfo__item-title">전화번호</div><a href="tel:${showPhone(c)}" class="text-gray-dark">${showPhone(c)}</a></div>
          <div class="UserInfo__item"><div class="UserInfo__item-title">이메일</div><div class="UserInfo__item-dsc">${c.m ? "" : "fake@example.com"}</div></div>
          <div class="UserInfo__item"><div class="UserInfo__item-title">특이사항</div><div class="UserInfo__item-dsc"></div></div></div>
          ${c.talk ? `<div class="row-flx UserInfo__customers-talktalk"><button type="button" class="btn btn-lg btn-default" id="talk"><i class="fn fn-talktalk-fill" aria-hidden="true"></i>톡톡 대화하기</button></div>` : ""}</div>` : ""}</div>
      </div></div>`;
  }
  document.body.innerHTML = `<div class="wrap"><nav><b>아스타나키즈</b>${nav}</nav><main>${main}</main></div>`;
  // 넣자마자 돋보기를 누르면 예전 값으로 찾음 (React 처럼 · ?late=0 이면 바로)
  let lateQ = q;
  const late = P.get("late") !== "0";
  document.addEventListener("input", (e) => { if (e.target.id === "sq") { const v = e.target.value; if (late) setTimeout(() => { lateQ = v; }, 250); else lateQ = v; } });
  document.addEventListener("click", (e) => {
    const n = e.target.closest("[data-nav]"); if (n) { e.preventDefault(); if (n.dataset.nav === "고객") setTimeout(() => go({ home: "", q: "", sel: "" }), 150); return; }
    if (e.target.closest("#stype")) { // 펼친 목록은 화면 맨 끝에 따로 그림
      const old = document.getElementById("sopts"); if (old) { old.remove(); return; }
      const r = document.getElementById("stype").getBoundingClientRect(), d = document.createElement("div");
      d.id = "sopts"; d.className = "Layer__list"; d.style.cssText = `left:${r.left + scrollX}px;top:${r.bottom + scrollY + 4}px`;
      d.innerHTML = `<a role="button" href="#" data-type="이름">이름</a><a role="button" href="#" data-type="전화번호">전화번호</a>`;
      setTimeout(() => document.body.appendChild(d), 120); return;
    }
    const o = e.target.closest("[data-type]"); if (o) { e.preventDefault(); setTimeout(() => go({ type: o.dataset.type, q: document.getElementById("sq").value, sel: "", n: "" }), 100); return; }
    if (e.target.closest("#sbtn")) { const v = lateQ; setTimeout(() => go({ q: v, sel: "", n: "" }), 150); return; }
    // 줄 고르기는 아래 change 로만 (실제 화면: 이름 글자를 프로그램으로 눌러도 안 바뀜)
    if (e.target.closest("#talk") && c) window.open(`talkchat.html?u=${encodeURIComponent(c.id)}&frm=prsv&mode=popup`, "talk_" + c.id, "popup,width=900,height=700");
  });
  // ?nosel=1: 줄을 골라도 고객 정보가 안 바뀌는 화면 (시험용)
  document.addEventListener("change", (e) => { const r = e.target.closest("input[name=userListSelect]"); if (r && r.checked && !P.get("nosel")) { const row = r.closest(".Contents__list-row"); setTimeout(() => go({ sel: row.dataset.id, n: shown }), 150); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "sq") { const v = lateQ; setTimeout(() => go({ q: v, sel: "", n: "" }), 150); } });
  // 아래로 내려 끝에 닿으면 15명 더 (0.4초 · 불러오는 동안 '로딩중')
  let busy = false;
  document.addEventListener("scroll", (e) => {
    if (busy || shown >= hits.length || P.get("nomore")) return; // ?nomore=1: 내려도 더 안 나오는 화면 (시험용)
    const el = e.target === document ? document.scrollingElement : e.target;
    if (!el || !el.classList || !(el === document.scrollingElement || el.classList.contains("Contents__root"))) return;
    if (el.scrollTop + el.clientHeight < el.scrollHeight - 30) return;
    busy = true; const ld = document.getElementById("ld"); if (ld) ld.hidden = false;
    setTimeout(() => {
      document.querySelector(".Contents__list-content").insertAdjacentHTML("beforeend", hits.slice(shown, shown + PAGE).map(rowHtml).join(""));
      shown = Math.min(hits.length, shown + PAGE);
      if (ld) ld.hidden = true; busy = false;
    }, 400);
  }, true);
</script>
</body></html>
