<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화성 카페아스타나 (시험용 가짜 아마노 할인등록 화면)</title>
<!-- 실제 아마노 할인등록 화면(사장님이 저장해 준 파일)의 구조를 그대로 본뜬 시험용 페이지
     - 페이지가 새로 열리지 않고 자리에서 바뀜 (AJAX, 요청 중에는 #modal-overlay)
     - 조회 목록·할인내역은 dhtmlx 표: 머리 표(hdr)와 몸통 표(obj)가 따로, 둘 다 맨 위에 크기용 th 줄
     - 할인 버튼은 <a href="javascript:fncSetDscntType('1')">3시간할인</a>
     - 등록·삭제 뒤 "등록되었습니다." / "삭제가 완료 되었습니다." 알림(OK) → OK 누르면 다시 조회하고 첫 줄 자동 선택
     - 삭제는 "삭제하시겠습니까?" 확인 창(OK / Cancel)
     - 등록한 계정만 삭제 버튼, 아니면 "미출차" / "출차완료"
     - ?login=need 로그인 화면(test / 1234), ?notice=1 처음 공지 창 -->
<style>
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; font-size: 12px; }
  .wrap { display: grid; grid-template-columns: 490px 590px; gap: 10px; padding: 10px; }
  h4 { margin: 0; background: #12a5e0; color: #fff; padding: 8px; text-align: center; }
  table { border-collapse: collapse; }
  .hdr td { background: #3a3f4f; color: #fff; padding: 4px; }
  .obj td { padding: 4px; border-bottom: 1px solid #ddd; }
  .obj tr.rowselected td { background: #d7e641; }
  .discountCount { background: #8a8985; color: #fff; padding: 2px 4px; border-radius: 4px; }
  .tableStyle3 th { background: #eee; padding: 6px; }
  .carNo { background: #363a4b; color: #fff; font-size: 24px; text-align: right; }
  .price { color: red; font-weight: bold; }
  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.1); }
  .modal-box, .ui-dialog { position: fixed; top: 30%; left: 30%; background: #fff; border: 2px solid #333; padding: 12px; z-index: 9; }
</style>
</head>
<body>
<div id="modal-overlay" style="display:none"></div>
<div id="root"></div>
<script>
  const NOW = new Date("2026-10-05T20:12:05");
  const P = new URLSearchParams(location.search);
  const ME = "astana";
  const KEY = "mockAmano2";
  const seed = () => ({
    cars: [
      { id: "774483", no: "35모9259", at: "2026-10-05 17:23:05" },
      { id: "774362", no: "117무5514", at: "2026-10-05 14:26:27" },
      { id: "774370", no: "12가3456", at: "2026-10-05 13:20:05" },
      { id: "774371", no: "32우3456", at: "2026-10-05 13:31:44" },
      { id: "774301", no: "208라1172", at: "2026-10-04 23:12:09" },
      { id: "774355", no: "38다1172", at: "2026-10-05 10:05:51", pre: true }, // 사전등록 차량
    ],
    disc: { "774362": [{ type: "3시간할인", by: "alphavision(관리자)", at: "2026-10-05 18:16:12", stat: "00" }, { type: "3시간할인", by: "alphavision(관리자)", at: "2026-10-05 14:40:21", stat: "00" }] },
  });
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { db = seed(); }
  const save = () => localStorage.setItem(KEY, JSON.stringify(db));
  const $ = (id) => document.getElementById(id);
  const ajax = (fn) => { $("modal-overlay").style.display = ""; setTimeout(() => { $("modal-overlay").style.display = "none"; fn(); }, 250); };

  // jquery.modal 비슷한 알림 창 (OK 를 눌러야 닫힘)
  function modal(text, buttons) {
    const box = document.createElement("div");
    box.className = "modal-box";
    box.innerHTML = `<div class="modal-inner"><div class="modal-title">알림</div><div class="modal-text">${text}</div><div class="modal-buttons"></div></div>`;
    for (const [label, fn] of buttons) {
      const a = document.createElement("a");
      a.className = "modal-btn";
      a.href = "javascript:void(0)";
      a.textContent = label;
      a.onclick = () => { box.remove(); fn && fn(); };
      box.querySelector(".modal-buttons").appendChild(a);
    }
    document.body.appendChild(box);
  }
  const fncAlertMsg = (msg, cb) => modal(msg, [["OK", () => eval(cb)]]);
  const fncWarningMsg = (msg) => modal(msg, [["OK"]]);

  if (P.get("login") === "need") {
    $("root").innerHTML = `<form id="lf" style="width:300px;margin:80px auto;display:grid;gap:8px"><b>로그인</b><input id="uid" placeholder="아이디"><input id="upw" type="password" placeholder="비밀번호"><button>로그인</button><span id="lerr" style="color:red"></span></form>`;
    $("lf").onsubmit = (e) => {
      e.preventDefault();
      if ($("uid").value === "test" && $("upw").value === "1234") location.href = location.pathname;
      else $("lerr").textContent = "아이디 또는 비밀번호가 틀립니다";
    };
  } else {
    $("root").innerHTML = `<div class="wrap"><div>
      <h4>차량번호 조회</h4>
      <form id="sForm"><p class="desc"><span>새벽시간</span>검색편의를 위해 <span>입차일</span>은 <span>전일</span>부터 차량을 검색합니다</p>
        <label>입차일</label><input type="text" name="entryDate" class="dInput hasDatepicker" value="2026-10-04" id="dp1791"><button type="button" class="ui-datepicker-trigger">...</button>
        <label>차량번호</label><input type="text" name="carNo" id="schCarNo" class="dInput" value="">
        <input type="button" class="btnS1_1 btn" value="검색" onclick="fncDoListMst()">
        <div><input type="checkbox" id="checkSaveID" ${P.get("keep") === "1" ? "checked" : ""}><label>검색 상태 유지</label></div></form>
      <div id="gridMst"></div>
      <h4>할인내역</h4><div id="gridDtl"></div>
    </div><div>
      <h4>할인정보 등록</h4>
      <form id="theForm" class="tableStyle3" onsubmit="return false;"><input type="hidden" name="peId" id="peId"><table><tbody>
        <tr><th>차량번호</th><td><input type="text" name="carNo" id="carNo" class="carNo" readonly></td></tr>
        <tr><th>입차장비</th><td><span id="iInEqpmNm"></span></td></tr>
        <tr><th>입차시간</th><td><span id="entryDate"></span></td></tr>
        <tr><th>주차시간</th><td><span id="differentTime" class="price"></span></td></tr>
        <tr><th class="thTitle">할인유형</th><td id="div_dscntcodes"></td></tr>
        <tr><th>비 고</th><td><textarea id="memo"></textarea></td></tr>
      </tbody></table><p class="desc"><span>출차 5분전</span> 반드시 등록바랍니다.</p></form>
    </div></div>`;
  }

  // dhtmlx 표처럼: 머리 표(hdr) + 몸통 표(obj), 둘 다 맨 위에 크기용 th 줄
  function grid(el, heads, rows, onSelect, sel) {
    const sizing = `<tr style="height:auto">${heads.map(() => `<th style="height:0"></th>`).join("")}</tr>`;
    el.innerHTML = `<div class="xhdr"><table class="hdr"><tbody>${sizing}<tr>${heads.map((h) => `<td><div class="hdrcell">${h}</div></td>`).join("")}</tr></tbody></table></div>
      <div class="objbox"><table class="obj"><tbody>${sizing}${rows.map((r, i) => `<tr data-i="${i}" class="${i === sel ? "rowselected" : ""}">${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if (onSelect) el.querySelector(".obj").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-i]"); if (tr) onSelect(+tr.dataset.i); });
  }
  let list = [], cur = null;
  function fncDoListMst() {
    grid($("gridMst"), ["입차ID", "차량번호", "입차시간"], []);
    grid($("gridDtl"), ["순번", "할인값", "등록자", "등록시간", "삭제"], []);
    $("carNo").value = ""; $("entryDate").textContent = ""; $("differentTime").textContent = ""; $("div_dscntcodes").innerHTML = ""; $("peId").value = "";
    const day = document.querySelector("#sForm input[name='entryDate']").value, no = $("schCarNo").value;
    ajax(() => {
      list = db.cars.filter((c) => c.no.includes(no) && c.at.slice(0, 10) >= day);
      showList(0);
      if (list.length) fncGridRowSelected(0); // 첫 줄 자동 선택
    });
  }
  function showList(sel) {
    grid($("gridMst"), ["입차ID", "차량번호", "입차시간"], list.map((c) => {
      const n = (db.disc[c.id] || []).length;
      return [c.id, ` ${c.no}` + (n ? ` <label class='discountCount'>${n}건  </label>` : ""), c.at];
    }), fncGridRowSelected, sel);
  }
  function fncGridRowSelected(i) {
    cur = list[i];
    showList(i);
    ajax(() => {
      if (cur.pre) { fncWarningMsg("사전등록된 차량은 웹할인을 이용할 수 없습니다."); return; }
      $("peId").value = cur.id; $("carNo").value = cur.no; $("iInEqpmNm").textContent = "정문입구LPR"; $("entryDate").textContent = cur.at;
      const m = Math.floor((NOW - new Date(cur.at.replace(" ", "T"))) / 60000);
      $("differentTime").textContent = `${Math.floor(m / 60)}시간 ${m % 60}분`;
      $("div_dscntcodes").innerHTML = ["3시간할인", "5시간할인", "15시간할인", "16시간할인", "17시간할인", "18시간할인"]
        .map((t, k) => `<a class="btnGreen btnMarginBottom btn" id="${k + 1}" name="btnDscntType" value="${t}" href="javascript:fncSetDscntType('${k + 1}');">${t}</a>`).join("");
      showDtl();
    });
  }
  function showDtl() {
    const ds = db.disc[cur.id] || [];
    grid($("gridDtl"), ["순번", "할인값", "등록자", "등록시간", "삭제"], ds.map((d, i) => [i + 1, d.type, d.by, d.at,
      d.stat === "10" ? `<b style="color:red">출차완료</b>` : d.by.startsWith(ME) ? `<input type="button" class="btnS3_1 btn btnDel" value="삭제" onclick="fncGridDeleteParkVisitCar(${i})">` : "미출차"]));
  }
  window.fncSetDscntType = (k) => {
    const t = document.getElementById(String(k)).textContent;
    ajax(() => {
      (db.disc[cur.id] = db.disc[cur.id] || []).unshift({ type: t, by: `${ME}(근무자)`, at: "2026-10-05 20:12:30", stat: "00" });
      save();
      if (!$("checkSaveID").checked) $("schCarNo").value = ""; // 실제처럼: 검색 상태 유지가 꺼져 있으면 차량번호를 비움
      fncAlertMsg("등록되었습니다.", "fncDoListMst();");
    });
  };
  window.fncGridDeleteParkVisitCar = (i) => {
    const d = document.createElement("div");
    d.className = "ui-dialog";
    d.innerHTML = `<div id="dialog-confirm" class="ui-dialog-content">삭제하시겠습니까?</div><div class="ui-dialog-buttonpane"><button type="button">OK</button><button type="button">Cancel</button></div>`;
    const [ok, cancel] = d.querySelectorAll("button");
    ok.onclick = () => { d.remove(); ajax(() => { db.disc[cur.id].splice(i, 1); save(); fncAlertMsg("삭제가 완료 되었습니다. ", "fncDoListMst();"); }); };
    cancel.onclick = () => d.remove();
    document.body.appendChild(d);
  };
  window.fncDoListMst = fncDoListMst;
  if (P.get("login") !== "need") {
    fncDoListMst();
    if (P.get("notice") === "1") modal("공지: 시스템 점검 안내", [["7일간 보지 않기"], ["닫기"]]);
  }
</script>
</body>
</html>
