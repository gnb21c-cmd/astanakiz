# 입장 데스크 Windows 설치 파일 만들기 (GitHub 의 Windows 컴퓨터가 대신 만듦)
# main 에 apps/desk · prototype 이 바뀌어 올라가면 저절로, 또는 Actions → 설치 파일 만들기 → Run workflow
# 결과: Releases 의 '최신'(test-latest, 받는 주소가 늘 같음) + 버전별 기록(v1.X) 에 설치 파일(.exe) — POS PC 에서 받아 더블클릭
# 버전: ver.1.X — 정식 ver.1.0 부터, 설치 파일을 만들 때마다 X 가 1씩 늘어남 (이 작업의 실행 번호 − 14)
#   (현장 시험판은 ver.0.1 ~ 0.9) · 화면 맨 위 "네이버 · 아마노 · POS 연결 ver.1.X" 로 새 설치본인지 확인
# 아마노 · 네이버 주소 · 아이디 · 비밀번호는 넣지 않음 (POS PC 앱 설정에서 입력)
name: 설치 파일 만들기
on:
  push:
    branches: [main]
    paths: ["apps/desk/**", "prototype/desk.html", "docs/manual/**", ".github/workflows/build-win.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 꾸러미 설치
        working-directory: apps/desk
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund
      - name: 버전 적기 (ver.1.X)
        id: ver
        shell: bash
        run: |
          v="1.$(( ${{ github.run_number }} - 14 ))"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "{\"build\":\"$v\",\"sha\":\"$(git log -1 --format=%h)\"}" > apps/desk/src/build.json
          cd apps/desk && npm pkg set version=$v.0
      - name: 설치 파일 만들기
        working-directory: apps/desk
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never
      - name: 최신 · 버전별로 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          f=$(ls apps/desk/dist/*.exe | head -1)
          cp "$f" astanakiz-desk-setup.exe
          files="astanakiz-desk-setup.exe"
          [ -f docs/manual/staff-manual.pdf ] && cp docs/manual/staff-manual.pdf astanakiz-staff-manual.pdf && files="$files astanakiz-staff-manual.pdf"
          notes="POS PC 설치용 — 받아서 더블클릭 → 설치. 직원 메뉴얼 PDF 같이 있음. 커밋 $(git log -1 --format=%h)"
          # 받는 주소가 늘 같은 '최신'
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest $files --title "최신 ver.$v ($(git log -1 --format=%h))" --notes "$notes" --target ${{ github.sha }} --latest=false
          # 버전별 기록
          gh release delete "v$v" --yes --cleanup-tag || true
          gh release create "v$v" $files --title "아스타나키즈 입장 데스크 ver.$v" --notes "$notes" --target ${{ github.sha }} --latest
