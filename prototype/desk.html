<title>아스타나키즈 입장 데스크</title>
<meta name="description" content="네이버 예약 확인·이용완료, 열쇠 관리, 현장 입장(POS 결제 전환), 아마노 주차등록을 POS 화면 한 장(1024×768)에서 처리하는 근무자용 체험판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치 (사장님 스케치 기준, POS 1024×768 한 장)
   왼쪽: 날짜 ← → · 시간별 확정/잔여 | 가운데: 고른 시간의 예약자 명단 | 오른쪽: 열쇠판 10칸×5줄 · 아래 주차등록
   각 칸 안에서만 스크롤. 1000px 보다 좁으면 한 줄씩 쌓음 */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F4F6F9;
  --fg: #141A26;
  --muted: #5D6778;
  --faint: #A9B1BE;
  --line: #D9DEE6;
  --ink: #141A26;
  --on-ink: #FFFFFF;
  --accent: #2B59C3;
  --accent-bg: #E3EAFA;
  --naver: #0B8F47;
  --naver-bg: #E1F3E8;
  --sky-bg: #DCEFFC;
  --sky-line: #8CC5EE;
  --done-bg: #E6E8EC;
  --pink: #F2A7BC;
  --pink-fg: #7A1F3A;
  --red: #D23A3A;
  --ok: #1D7F52;
  --warn-bg: #FBE3E3;
  --shadow: 0 1px 2px rgba(20, 26, 38, .06), 0 3px 12px rgba(20, 26, 38, .05);
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-bg: #16324A; --sky-line: #2F6A96; --done-bg: #262C35;
    --bg: #0F141C; --surface: #18202B; --surface-2: #1F2834; --fg: #E8ECF2; --muted: #9AA4B5; --faint: #4A5566; --line: #2C3645;
    --ink: #E8ECF2; --on-ink: #10151D; --accent: #82A3F2; --accent-bg: #1E2B4A; --naver: #4CC788; --naver-bg: #163126;
    --pink: #E58FA8; --pink-fg: #3A0E1B; --red: #EF6B6B; --ok: #5BCB92; --warn-bg: #43201F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --sky-bg: #16324A; --sky-line: #2F6A96; --done-bg: #262C35;
  --bg: #0F141C; --surface: #18202B; --surface-2: #1F2834; --fg: #E8ECF2; --muted: #9AA4B5; --faint: #4A5566; --line: #2C3645;
  --ink: #E8ECF2; --on-ink: #10151D; --accent: #82A3F2; --accent-bg: #1E2B4A; --naver: #4CC788; --naver-bg: #163126;
  --pink: #E58FA8; --pink-fg: #3A0E1B; --red: #EF6B6B; --ok: #5BCB92; --warn-bg: #43201F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.4; overflow: hidden; }
/* POS 화면 1024×768 을 그대로 그리고, 창 크기에 맞춰 통째로 줄이거나 키움 (칸 배치는 절대 바뀌지 않음) */
#stage { position: absolute; top: 0; left: 0; width: 1024px; height: 768px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100%; padding: 8px 16px; display: grid; gap: 8px; grid-template-rows: auto minmax(0, 1fr); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-weight: 600; min-height: 36px; }
.btn:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn-ink:hover { background: var(--ink); opacity: .9; }
.btn-sm { padding: 2px 9px; min-height: 28px; font-size: 12.5px; border-radius: 7px; }

/* 위 막대 */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
.top .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
.top .tag { font-size: 11.5px; color: var(--muted); }
.captable { width: 100%; border-collapse: collapse; font-size: 14px; }
.captable th, .captable td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; }
.captable th { font-size: 12px; color: var(--muted); font-weight: 600; }
.captable tr.adj td { background: var(--accent-bg); }
.captable .up { color: var(--ok); font-size: 12px; } .captable .down { color: var(--red); font-size: 12px; } .captable td.over { color: var(--red); font-weight: 700; }
.caplog { display: grid; gap: 2px; font-size: 12.5px; max-height: 150px; overflow: auto; } .caplog .bad { color: var(--red); }
.top .posgo { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; padding: 4px 14px; }
.top .spacer { flex: 1; }
.top .now { font-size: 22px; font-weight: 700; }
.top .sold { font-size: 14px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.top .btn { white-space: nowrap; flex-shrink: 0; }
.top .sold b { font-size: 19px; color: var(--accent); }

/* 세 칸 */
.cols { display: grid; gap: 8px; grid-template-columns: 222px 244px minmax(0, 1fr); height: 100%; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
.panel h2 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.panel h2 small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.panel { height: 100%; }
/* 가운데 칸: 위에 새로고침 버튼, 그 아래로 예약자 명단 상자를 내림 */
.midcol { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; min-width: 0; }
.refresh { min-height: 38px; width: 100%; font-size: 14px; border-color: var(--accent); color: var(--accent); background: var(--surface); }
.refresh small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.scroll { min-height: 0; display: grid; gap: 5px; align-content: start; overflow: auto; flex: 1; }

/* 왼쪽: 날짜 · 시간표 */
.datebar { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; align-items: center; gap: 4px; }
.datebar button.arrow { height: 34px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 16px; font-weight: 700; }
.datebar .d { text-align: center; font-weight: 700; font-size: 14px; line-height: 1.15; }
.datebar .d small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
/* 시간 · 확정 · 잔여 세 칸 */
.slot-head { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 2px; font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 4px; text-align: center; }
.slot { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); align-items: center; gap: 2px; width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 4px; border-radius: 9px; text-align: left; }
.slot .t { border: 1.5px solid transparent; border-radius: 8px; text-align: center; font-weight: 800; padding: 2px 0; background: transparent; }
.slot-sum { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px 4px 5px; margin: 2px 4px 2px; border-bottom: 3px double var(--line); text-align: center; font-weight: 800; font-size: 15px; }
.slot-sum .lb { font-size: 12.5px; border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 0; }
.slot-sum .dn { color: var(--muted); }
.slot .c { text-align: center; font-weight: 700; font-size: 15px; }
.slot .c.full, .slot-sum .full { color: var(--red); }
.slot .c.dn { color: var(--muted); }
.slot .c.cf, .slot-sum .cf { color: var(--accent); }
.slot .c.lf, .slot-sum .lf { color: var(--fg); }
.slot.now .t { border-color: var(--accent); color: var(--accent); }
.slot.on { background: var(--accent-bg); border-color: var(--accent); }
.slot.on .t { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot:hover { background: var(--surface-2); }
.slot.on:hover { background: var(--accent-bg); }

/* 가운데: 예약자 명단 */
.res { border: 1px solid var(--sky-line); border-radius: 10px; padding: 7px 9px; display: grid; gap: 3px; background: var(--sky-bg); }  /* 미입장: 하늘색 */
.res.done { background: var(--done-bg); border-color: var(--line); }  /* 입장완료(이용완료): 회색 */
.badge.conf { background: var(--surface); }
.res { cursor: pointer; }
.res:hover { border-color: var(--accent); }
.res .go { font-size: 12.5px; font-weight: 700; color: var(--accent); }
/* 예약자 팝업의 열쇠 고르기: 15칸 × 3줄 */
.kpick { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
.kpick button { aspect-ratio: 1; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700; padding: 0; }
.kpick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.kpick button[disabled] { border-color: var(--line); background: var(--surface-2); color: var(--faint); opacity: .45; cursor: default; font-weight: 500; }
.sheet.wide { width: min(620px, 100%); }
.sheet.setsheet { width: min(760px, 100%); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 6px 12px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--ink); }
.cfg { font-size: 15px !important; font-weight: 500 !important; min-height: 38px !important; letter-spacing: 0 !important; }
.date-in { font-size: 14px !important; min-height: 34px; width: 150px !important; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.peakrow { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.prn { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
.plist { display: grid; gap: 4px; }
.plist button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.plist button.on { border: 2px solid var(--ink); }
.seg2 { display: flex; gap: 6px; }
.seg2 button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 34px; font-weight: 600; }
.seg2 button.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.field .chk input { width: 20px; height: 20px; min-height: 0; padding: 0; flex: none; }
.prn > .field { align-content: start; }
#form-text { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: ui-monospace, Consolas, "D2Coding", monospace; font-size: 13px; background: var(--surface); color: var(--fg); resize: vertical; }
/* 80mm 감열지 미리보기 (인쇄 폭 약 72mm) */
.paper { width: 288px; max-width: 100%; justify-self: center; background: #fff; color: #111; border-radius: 4px; padding: 14px 12px 22px; box-shadow: 0 1px 6px rgba(0,0,0,.25); font-family: ui-monospace, Consolas, "D2Coding", monospace; font-size: 13px; line-height: 1.45; max-height: 420px; overflow: auto; }
.paper .pl { white-space: pre-wrap; overflow-wrap: anywhere; }
.paper .ctr { text-align: center; }
.paper .big { text-align: center; font-size: 20px; font-weight: 700; }
.paper .mid { text-align: center; font-size: 16px; font-weight: 700; }
.paper .bd { font-weight: 700; }
.paper .hr { border-top: 1px dashed #111; margin: 6px 0; }
.paper .hr2 { border-top: 3px double #111; }
.sheet.keysheet { width: min(560px, 100%); }  /* 열쇠 10개(5개 × 2줄)가 들어가는 크기 */
.rbtns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rbtns .btn { min-height: 44px; font-size: 15px; }
.rall { min-height: 48px; font-size: 16px; width: 100%; }
.meter { border: 2px solid var(--red); background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; text-align: center; }
.meter .mt { font-size: 12.5px; font-weight: 700; color: var(--red); }
.meter .tick { font-size: 30px; font-weight: 700; color: var(--red); letter-spacing: .02em; line-height: 1.1; }
.meter .amt { font-size: 26px; font-weight: 700; }
.meter .calc { font-size: 11.5px; color: var(--muted); }
.meter .btn { margin-top: 6px; min-height: 48px; font-size: 16px; }
.meter.paid { border-color: var(--ok); background: var(--naver-bg); }
.meter.paid .mt { color: var(--ok); }
.btn-red { background: var(--red); border-color: var(--red); color: #fff; }
.btn-red:hover { background: var(--red); opacity: .9; }
.res .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.res .name { font-size: 15.5px; font-weight: 700; }
.visits { font-size: 12px; color: var(--ok); font-weight: 600; margin-top: -2px; }
.visits b { color: var(--fg); }
.visits.big { font-size: 14px; margin: 0; }
.chain { font-size: 12.5px; font-weight: 800; color: #b45309; background: #fef3c7; border-radius: 6px; padding: 1px 6px; justify-self: start; }
.chain.sub { color: var(--muted); background: var(--surface-2); font-weight: 700; }
.chain.bad { color: #fff; background: var(--red); }
.npend { font-size: 11.5px; color: var(--red); font-weight: 700; }
.gift { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--red); border-radius: 5px; padding: 0 6px; margin-left: 2px; }
.badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.badge.conf { background: var(--accent-bg); color: var(--accent); }
.badge.done { background: var(--naver-bg); color: var(--ok); }
.badge.paid { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 6px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.kv dd.phone { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
.res .act { display: flex; gap: 5px; align-items: center; justify-content: space-between; margin-top: 2px; flex-wrap: wrap; }
.kchips { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.kchip { font-size: 11.5px; font-weight: 700; border-radius: 5px; padding: 0 6px; background: var(--ink); color: var(--on-ink); }
.empty { color: var(--muted); font-size: 13px; padding: 10px; background: var(--surface-2); border-radius: 8px; text-align: center; }

/* 오른쪽: 열쇠판 */
.keyhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.keyhead .stat { font-size: 12.5px; color: var(--muted); }
.keyhead .stat b { color: var(--fg); font-size: 15px; }
.keys { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.key { aspect-ratio: 1 / .98; max-width: 100%; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--faint); display: grid; align-content: center; justify-items: center; padding: 1px; line-height: 1.1; min-width: 0; overflow: hidden; }
.key b { font-size: 17px; font-weight: 700; }
.key span { font-size: 10.5px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key.in { background: var(--surface); border: 2px solid var(--ink); color: var(--ink); }
.key.pink { background: var(--pink); border: 2px solid var(--pink); color: var(--pink-fg); }
.key.red { background: var(--red); border: 2px solid var(--red); color: #fff; }
.key.void { visibility: hidden; }
.key.bulk { aspect-ratio: auto; height: auto; min-height: 0; align-self: stretch; font-size: 14px; font-weight: 800; color: var(--accent); border: 2px solid var(--accent); background: var(--accent-bg); }
.key.bulk:disabled { opacity: .45; }
.bulklist { max-height: 300px; overflow: auto; display: grid; gap: 4px; margin: 6px 0; font-size: 13.5px; }
.bulklist div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--line); background: var(--surface-2); }
.legend .l-in { border-color: var(--ink); background: var(--surface); }
.legend .l-pink { border-color: var(--pink); background: var(--pink); }
.legend .l-red { border-color: var(--red); background: var(--red); }

/* 주차등록: 뒤에 열어 둔 아마노 화면과 같은 항목 */
.park { border-top: 1px solid var(--line); padding-top: 6px; display: grid; gap: 5px; grid-template-rows: auto auto minmax(0, 1fr) auto; flex: 1; min-height: 0; }
.park h3 { margin: 0; font-size: 14px; color: var(--red); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.park h3 small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.park h3 small i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 4px; font-style: normal; }
.park .find { display: grid; grid-template-columns: auto 128px minmax(0, 1fr) auto; gap: 6px; margin: 0; align-items: center; }
.park .find label { font-size: 12px; color: var(--muted); font-weight: 600; }
.park .find input { border: 1.5px solid var(--red); border-radius: 8px; padding: 4px 8px; font-size: 15px; background: var(--surface); min-width: 0; min-height: 34px; }
.park .find .btn { border-color: var(--red); color: var(--red); min-height: 34px; }
.park .find { position: relative; }
.carpad { position: absolute; top: calc(100% + 4px); z-index: 60; width: 250px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border-radius: 12px; background: var(--surface); border: 2px solid var(--red); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.carpad[hidden] { display: none; }
.carpad button { height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 22px; font-weight: 700; touch-action: manipulation; }
.carpad button:active { background: var(--accent); color: #fff; }
.carpad button.fn { font-size: 15px; }
.carpad button.go { grid-column: 1 / -1; background: var(--red); border-color: var(--red); color: #fff; font-size: 18px; }
.park .body { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 6px; min-height: 0; }
.cars { border: 1.5px solid var(--red); border-radius: 8px; padding: 4px; display: grid; gap: 3px; align-content: start; overflow: auto; min-height: 0; }
.car { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 6px; align-items: center; padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; background: var(--surface-2); text-align: left; width: 100%; }
.car.on { border-color: var(--red); background: var(--warn-bg); }
.car b { font-size: 14px; }
.car small { color: var(--muted); font-size: 11px; }
.car .st { font-size: 11px; font-weight: 700; color: var(--ok); text-align: right; }
.cnt { font-size: 10.5px; font-weight: 700; background: var(--muted); color: var(--surface); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
.pcar { border: 1.5px solid var(--red); border-radius: 8px; padding: 6px; display: grid; gap: 4px; align-content: start; overflow: auto; min-height: 0; }
.pcar .no { font-size: 18px; font-weight: 700; text-align: center; background: var(--ink); color: var(--on-ink); border-radius: 6px; padding: 2px 0; }
.pcar .tm { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.pcar .tm b { color: var(--red); font-size: 14px; }
.dbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.dbtns .btn { min-height: 38px; font-size: 14px; border-color: var(--accent); color: var(--accent); padding: 2px 4px; }
.dlist { display: grid; gap: 2px; font-size: 11.5px; }
.dlist div { display: flex; justify-content: space-between; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 5px; padding: 1px 4px; }
.dlist button { border: 0; background: transparent; color: var(--red); font-size: 11px; font-weight: 700; padding: 0 2px; }
.synclog { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.synclog b { color: var(--fg); font-weight: 600; }

/* 팝업 */
.overlay { position: absolute; inset: 0; background: rgba(12, 16, 24, .5); display: grid; align-items: center; justify-items: center; z-index: 20; padding: 12px 16px; }
.sheet { background: var(--surface); color: var(--fg); width: min(480px, 100%); max-height: 100%; overflow: auto; border-radius: 14px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet h3 { margin: 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.sheet .x { border: 0; background: transparent; font-size: 24px; line-height: 1; padding: 2px 8px; color: var(--muted); }
.facts { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 10px; margin: 0; align-items: center; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.bigkeys { display: flex; gap: 6px; flex-wrap: wrap; }
.bigkey { font-size: 22px; font-weight: 700; min-width: 54px; text-align: center; padding: 4px 10px; border-radius: 10px; border: 2px solid var(--ink); }
.field { display: grid; gap: 4px; }
.field label, .field .label { font-size: 13px; font-weight: 600; }
.help { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.field input { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); font-size: 22px; font-weight: 700; min-height: 48px; width: 100%; letter-spacing: .03em; }
.field input:focus { border-color: var(--accent); }
.fixed { display: inline-block; font-size: 17px; font-weight: 700; padding: 4px 12px; background: var(--surface-2); border-radius: 10px; }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; font-weight: 700; line-height: 1; }
.stepper output { min-width: 28px; text-align: center; font-size: 20px; font-weight: 700; }
/* 현장입장: 왼쪽 정보 · 오른쪽 터치 키패드 (현장 10/6) */
.sheet.walksheet { width: min(600px, 100%); }
.walktop { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 14px; align-items: start; }
.stepnote { flex-basis: 100%; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.keypad button { height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 22px; font-weight: 700; touch-action: manipulation; }
.keypad button:active { background: var(--accent); color: #fff; }
.keypad button.fn { font-size: 15px; }
.banner { border-radius: 9px; padding: 7px 10px; font-size: 13px; background: var(--naver-bg); }
.banner.warn { background: var(--warn-bg); }
.banner b { font-weight: 700; }
.stack-btns { display: grid; gap: 6px; }
.stack-btns .btn { min-height: 50px; font-size: 16px; border-radius: 12px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-foot .btn { min-height: 46px; font-size: 15px; padding: 8px 16px; }
.steps { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: grid; gap: 1px; }
.steps li.done { color: var(--ok); }

/* 체험용 POS 화면 */
.pos { position: absolute; inset: 0; z-index: 40; background: #2B2F36; color: #EDEFF2; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-family: var(--font); }
.pos .bar { background: #C9302C; color: #fff; padding: 8px 16px; font-weight: 700; display: flex; justify-content: space-between; }
.pos .body { display: grid; place-content: center; gap: 12px; text-align: center; padding: 16px; }
.pos .body b { font-size: 26px; }
.pos .foot { padding: 12px 16px; display: flex; justify-content: flex-end; gap: 8px; background: #1F2227; }
.pos .foot button { background: #fff; color: #1F2227; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; }

.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; background: var(--ink); color: var(--on-ink); padding: 9px 16px; border-radius: 12px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

/* 반납안내 커튼: 위 가운데 손잡이를 아래로 끌면 화면 전체를 덮는 안내 그림이 내려옴 (열쇠 반납 독려 · 고객정보 가림)
   내려온 뒤 아래 손잡이를 누르면 바로 사라짐 · 그림 왼쪽 아래 빨간 별을 누르면 위로 빨리 걷힘 */
.curtain-tab { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 9000; padding: 3px 26px 5px; border: 3px solid #1fa84a; border-top: 0; border-radius: 0 0 16px 16px; background: rgba(12, 20, 16, .88); color: #3ddc6b; font-weight: 800; font-size: 14px; letter-spacing: .5px; cursor: grab; touch-action: none; user-select: none; white-space: nowrap; }
.curtain-tab[hidden] { display: none; }
.curtain { position: fixed; inset: 0; z-index: 9500; background: #f3efe8; transform: translateY(-100%); display: flex; align-items: center; justify-content: center; padding-bottom: 40px; box-sizing: border-box; touch-action: none; user-select: none; }
.curtain.anim { transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.curtain.fast { transition: transform .22s ease-in; }
.curtain .cimg { position: relative; width: min(100vw, calc((100vh - 46px) * 986 / 728)); aspect-ratio: 986 / 728; }
.curtain .cimg img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.curtain .star { position: absolute; left: 0; top: 84%; width: 12%; height: 16%; border: 0; background: transparent; cursor: pointer; }
.curtain .cbottom { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); padding: 6px 30px 4px; border: 3px solid #1fa84a; border-bottom: 0; border-radius: 16px 16px 0 0; background: rgba(12, 20, 16, .88); color: #3ddc6b; font-weight: 800; font-size: 14px; white-space: nowrap; cursor: pointer; }
</style>

    for (const x of samePerson(b)) {
      const last = group[group.length - 1];
      // 2시간 이내 간격(겹쳐도)이면 이어서 씀, 2시간보다 길면 연속이용 아님
      if (last && x.slot > last.slot && x.slot - last.slot <= CHAIN_STEP && x.qty <= last.qty) group.push(x); // 뒤 타임에 사람이 늘면 거기서 끊음 (늘어난 사람은 따로 입장)
      else { if (group.includes(b)) break; group = [x]; }
    }
    return group.includes(b) ? group : [b];
  }
  /** 이어 잡았는데 2시간 간격이 아닌 앞뒤 예약 (1~4시간 사이) → { other, gap: 분(+ 비어요 · − 겹쳐요) } */
  function oddNext(b) {
    if (!b || !b.phone) return [];
    return samePerson(b).filter((x) => x !== b && Math.abs(x.slot - b.slot) > CHAIN_STEP && Math.abs(x.slot - b.slot) <= 240)
      .map((x) => { const [p, n] = x.slot < b.slot ? [x, b] : [b, x]; return { other: x, gap: n.slot - (p.slot + RULES.useMinutes) }; });
  }
  /** 연속예약 열쇠별 이용시간(분): 열쇠 j 번째는 앞에서부터 수량이 j 이상인 타임까지 이어짐. 무제한이 끼면 null */
  function chainKeyMinutes(chain, qty) {
    const out = [];
    for (let j = 1; j <= qty; j++) {
      let n = 0;
      for (const x of chain) { if (x.qty >= j) n++; else break; }
      const part = chain.slice(0, n);
      // 끝 = 이어지는 마지막 예약 시간 + 1시간 50분 (2시간보다 짧은 간격이면 그만큼 짧아짐)
      out.push(part.some((x) => minutesFor(x.day, x.slot) == null) ? null : part[part.length - 1].slot - part[0].slot + RULES.useMinutes);
    }
    return out;
  }
  /** 묶음 전체 이용시간(가장 긴 열쇠 기준, 분). 무제한이 끼면 null */
  function chainMinutes(chain) {
    const ms = chainKeyMinutes(chain, chain[0].qty);
    return ms.includes(null) ? null : Math.max(...ms);
  }
  /** 연속예약 열쇠 안내: "2개 3시간 50분(15:50) · 1개 1시간 50분(13:50)" */
  function keyPlan(ch, qty) {
    const ms = chainKeyMinutes(ch, qty), cnt = new Map();
    for (const m of ms) cnt.set(m, (cnt.get(m) || 0) + 1);
    return [...cnt.entries()].sort((a, b) => (b[0] ?? 1e9) - (a[0] ?? 1e9)).map(([m, n]) => `${n}개 ${m == null ? "무제한" : `${dur(m)}(${hm(ch[0].slot + m)})`}`).join(" · ");
  }
  const dur = (m) => `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}`;
  /** 열쇠를 가진 손님의 이용시간(분, 예약 시간부터). 연속예약이면 입장 때 열쇠마다 정해 둔 값, 무제한이면 null */
  const useOf = (h, k) => {
    if (h.keyUse && k != null && h.keyUse[k] !== undefined) return h.keyUse[k];
    if (h.keyUse && k == null) { const v = h.keys.map((x) => h.keyUse[x]).filter((x) => x !== undefined); if (v.length) return v.includes(null) ? null : Math.min(...v); }
    return h.useMin !== undefined ? h.useMin : minutesFor(TODAY, h.slot);
  };

  // ── 열쇠 계산 ─────────────────────────────────────
  const holders = () => bookings[TODAY].concat(walkins).filter((x) => x.keys.length);
  const holderOf = (k) => holders().find((x) => x.keys.includes(k));
  const freeKeys = () => { const out = []; for (let k = 1; k <= RULES.keys; k++) if (!holderOf(k)) out.push(k); return out; };
  /* 열쇠 색: 예약한 입장시간(현장은 입장 시각)부터
     ~ 1시간 50분 검정 · 1시간 50분 ~ 2시간 분홍 · 2시간 넘으면 빨강. 무제한 손님은 계속 검정 */
  function keyColor(h, k) {
    const m = useOf(h, k);
    if (m == null) return "in";
    const used = now - h.slot;
    return used < m ? "in" : used < m + (RULES.pinkUntil - RULES.useMinutes) ? "pink" : "red";
  }
  /* 현장 판매 가능 열쇠: 지금부터 1시간 50분 동안 5분마다
     (안에 있는 손님 열쇠 + 그때 와 있을 네이버 예약 열쇠)를 뺀 값의 가장 작은 값.
     base = 기본 40개 안, all = 유동 5개까지 */
  function projection() {
    let worst = Infinity;
    for (let x = now; x <= now + RULES.useMinutes; x += 5) {
      let used = 0;
      for (const h of holders()) for (const k of h.keys) { const m = useOf(h, k); if (m == null || h.slot + m > x || x < now + 10) used++; }
      for (const b of bookings[TODAY]) {
        if (b.status !== "확정") continue;
        const m = minutesFor(TODAY, b.slot);
        if (b.slot - RULES.earlyMinutes <= x && (m == null || x < b.slot + m)) used += b.qty;
      }
      worst = Math.min(worst, RULES.keys - used);
    }
    const free = freeKeys().length;
    return { base: Math.max(0, Math.min(worst - (RULES.keys - RULES.baseKeys), free)), all: Math.max(0, Math.min(worst, free)) };
  }

  // ── 그리기 ───────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const findB = (id) => Object.values(bookings).flat().find((b) => b.id === id);

  function renderSlots() {
    ensureDay(viewDay);
    $("date").innerHTML = `${dateLabel(viewDay)}<small>${dayKind(viewDay)}</small>`;
    const list = bookings[viewDay];
    const tot = { done: 0, conf: 0, left: 0 };
    $("slots").innerHTML = SLOTS.map((s) => {
      const bs = list.filter((b) => b.slot === s);
      const ns = (naverSlots[viewDay] || {})[s];
      // 잔여 = 기준치 − 확정 − 완료. 기준치는 네이버 칸의 판매 수량(예약가능+확정+이용완료)이라 현장 설정에 따라 10이 아닐 수 있음
      const sum = (st) => bs.filter((b) => b.status === st).reduce((a, b) => a + b.qty, 0);
      const done = ns ? ns.done : sum("완료");
      const conf = ns ? ns.conf : sum("확정");
      const cap = ns ? ns.cap : viewDay === TODAY && capDemo[s] != null ? capDemo[s] : RULES.slotCap;
      const left = Math.max(0, cap - conf - done);
      tot.done += done; tot.conf += conf; tot.left += left;
      const isNow = viewDay === TODAY && now >= s - RULES.earlyMinutes && now < s + 25;
      return `<button class="slot ${s === selSlot ? "on" : ""} ${isNow ? "now" : ""}" data-act="slot" data-s="${s}" aria-pressed="${s === selSlot}">
        <span class="t num">${hm(s)}</span>
        <span class="c num dn">${done}</span><span class="c num ${conf ? "cf" : "lf"}">${conf}</span><span class="c num ${left ? "lf" : "full"}" title="기준 ${cap}">${left}</span></button>`;
    }).join("");
    renderSold(tot.done);
    $("slot-sum").innerHTML = `<span class="lb">${viewDay === TODAY ? "오늘 합" : "이날 합"}</span><span class="dn">${tot.done}</span><span class="${tot.conf ? "cf" : "lf"}">${tot.conf}</span><span class="${tot.left ? "lf" : "full"}">${tot.left}</span>`;
  }

  /** 네이버 '완료 n'에서 이번 방문 회차: 미입장이면 완료 n → 이번 n+1번째, 이용완료면 n+1번째 방문 */
  /* 근무자 화면은 실제 회차(11번째), 영수증은 10회 단위로 다시 셈(11회차 → 1번째).
     10·20·30…번째 방문이면 사은권 증정 */
  const stampOf = (n) => ((n - 1) % RULES.giftEvery) + 1;
  const isGift = (n) => n > 0 && n % RULES.giftEvery === 0;
  function visitText(b) {
    if (b.status === "완료" ? !b.visitNo : b.prevDone == null) return `<span class="help">방문 횟수 확인 중</span>`;
    const c = b.cancels ? ` · 취소 ${b.cancels}` : "";
    const n = b.status === "완료" ? b.visitNo : b.prevDone + 1;
    const gift = isGift(n) ? ` <span class="gift">${RULES.giftName} 증정</span>` : "";
    return (b.status === "완료" ? `<b>${n}번째 방문</b>` : `완료 ${b.prevDone}${c} → 이번 <b>${n}번째 방문</b>`) + gift;
  }
  function renderRes() {
    // 이름 가나다순 (네이버 목록 순서와 상관없이 · 입장해도 자리 그대로, 색으로만 미입장/입장완료 구분)
    const list = bookings[viewDay].filter((b) => b.slot === selSlot).sort((a, b) => a.name.localeCompare(b.name, "ko") || String(a.no || a.id).localeCompare(String(b.no || b.id)));

    $("res").innerHTML = list.length ? list.map((b) => {

      const oddTag = odd.length ? `<div class="chain bad num">⚠ 연속이용 아님 ${[b, ...odd.map((o) => o.other)].sort((x, y) => x.slot - y.slot).map((x) => hm(x.slot)).join(" · ")} — ${odd.map((o) => (o.gap > 0 ? `${o.gap}분 비어요` : `${-o.gap}분 겹쳐요`)).join(", ")}</div>` : "";
      const chainTag = oddTag + (ch.length < 2 ? "" : ci === 0 ? `<div class="chain">★${ch.length}타임 연속예약 <span class="num">${ch.map((x) => hm(x.slot)).join(" · ")}</span></div>` : `<div class="chain sub num">연속예약 ${ci + 1}/${ch.length} · 첫 예약 ${hm(ch[0].slot)}</div>`);
      if (b.status === "확정" && ci > 0) act = `<span class="help num">첫 예약(${hm(ch[0].slot)})에서 함께 입장 처리</span>`;
      else if (b.status === "확정") {
        if (!isToday) act = `<span class="help">이용일에 입장 처리</span>`;
        else act = `<span class="go">눌러서 입장 · 열쇠 지급 ›</span>${now < b.slot - RULES.earlyMinutes ? `<span class="help num">안내 ${hm(b.slot - RULES.earlyMinutes)} · 일찍 입장 가능</span>` : ""}`;
      } else if (b.keys.length) act = `<span class="kchips">${b.keys.map((k) => `<span class="kchip num">${k}</span>`).join("")}</span><span class="help num">${hm(b.enteredAt)} 입장</span>`;
      else if (b.outAt != null) act = `<span class="help num">${hm(b.enteredAt)} 입장 · ${hm(b.outAt)} 퇴장</span>`;
      else if (b.chainHead) act = `<span class="help num">연속예약 — ${hm(b.enteredAt)} 첫 예약으로 입장</span>`;
      if (b.naverPending) act += `<span class="npend">${b.naverBusy ? "네이버 이용완료 처리 중…" : `네이버 이용완료 대기${b.naverWhy ? ` — ${esc(b.naverWhy)}` : ""} (자동으로 다시)`}</span>`;
      return `<article class="res ${b.status === "완료" ? "done" : ""}" data-act="openRes" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)} 예약 열기">
        <div class="head"><span class="name">${esc(b.name)}</span><span class="badge ${b.status === "완료" ? "done" : "conf"}">${b.status === "완료" ? "이용완료" : "미입장"}</span></div>
        ${chainTag}<div class="visits num">${visitText(b)}</div>
        <dl class="kv">
          <dt>전화번호</dt><dd class="phone num">${fmtPhone(b.phone)}</dd>
          <dt>이용일시</dt><dd class="num">${when}</dd>
          <dt>수량</dt><dd>${b.product} ${b.qty}</dd>

        <div class="act">${act}</div>
      </article>`;
    }).join("") : `<div class="empty">이 시간 예약이 없어요</div>`;
  }

  function renderKeys() {
    const { base, all } = projection();
    $("key-stat").innerHTML = `사용 <b>${RULES.keys - freeKeys().length}</b>/${RULES.keys} · 현장 가능 <b>${base}</b>${all > base ? ` +유동 ${all - base}` : ""}`;
    let html = "";
    for (let k = 1; k <= 50; k++) {
      // 열쇠판 남는 칸(46~50) 자리에 '열쇠 일괄 반납처리'
      if (k > RULES.keys) { html += `<button class="key bulk" data-act="bulkReturn" style="grid-column: span ${50 - RULES.keys}" ${holders().length ? "" : "disabled"}>열쇠 일괄 반납처리</button>`; break; }
      const h = holderOf(k);
      if (!h) { html += `<button class="key free" data-act="key" data-k="${k}" aria-label="${k}번 빈 열쇠"><b class="num">${k}</b><span>&nbsp;</span></button>`; continue; }
      html += `<button class="key ${keyColor(h, k)}" data-act="key" data-k="${k}" aria-label="${k}번 ${esc(h.name)}"><b class="num">${k}</b><span>${esc(h.walk ? "현장" : h.name)}</span></button>`;
    }

  }

  // ── 주차 (아마노 화면 동기화) ───────────────────
  /* 데스크에서 입력·누른 것을 뒤에 열어 둔 아마노 할인등록 화면에 똑같이 넣고 누르고, 결과를 읽어 와 보여 줌.
     설치한 앱 안에서는 window.desk.amano(실제 아마노), 체험판에서는 아래 demoAmano(예시 자료)가 같은 모양으로 답함 */
  const DISC = ["3시간할인", "5시간할인", "15시간할인"]; // 쓰는 할인유형만 (아마노 화면의 같은 이름 버튼을 누름)
  const REAL = !!(window.desk && window.desk.amano);
  const demoAmano = (() => {
    const LOT = [["152가7781", "2026-10-05 09:52:10"], ["38다1172", "2026-10-05 10:05:51"], ["61머3020", "2026-10-05 10:41:03"], ["27노8814", "2026-10-05 11:02:44"],
      ["117무5514", "2026-10-05 11:26:27"], ["119허4402", "2026-10-05 11:48:15"], ["45루6603", "2026-10-05 12:33:09"], ["21보5520", "2026-10-05 12:57:31"],
      ["12가3456", "2026-10-05 13:20:05"], ["32우3456", "2026-10-05 13:31:44"], ["208라1172", "2026-10-04 23:12:09"]]
      .map(([no, at], i) => ({ id: String(774300 + i * 7), no, at }));
    const discs = {};
    let rows = [], sel = null;
    const parked = (c) => { const m = now - ((c.at.slice(0, 10) === TODAY ? 0 : -1440) + toMin(c.at.slice(11, 16))); return `${Math.floor(m / 60)}시간 ${m % 60}분`; };
    const state = () => {
      const c = LOT.find((x) => x.id === sel);
      return {
        needLogin: false,
        rows: rows.map((x) => ({ id: x.id, no: x.no, count: (discs[x.id] || []).length, at: x.at })),
        detail: c ? { no: c.no, at: c.at, parked: parked(c) } : { no: "", at: "", parked: "" },
        history: c ? (discs[c.id] || []).slice() : [],
        types: c ? ["3시간할인", "5시간할인", "15시간할인", "16시간할인", "17시간할인", "18시간할인"] : [],
      };
    };
    const ok = (extra = {}) => Promise.resolve(Object.assign({ ok: true, state: state() }, extra));
    return {
      search(day, no) { rows = LOT.filter((c) => c.no.includes(no) && c.at.slice(0, 10) >= day); sel = null; return ok(); },
      select(id) { sel = id; return ok(); },
      discount(t) { (discs[sel] = discs[sel] || []).unshift({ type: t, by: "astana(근무자)", at: `${TODAY} ${hm(now)}:00` }); return ok({ dialog: `${t}을(를) 등록하시겠습니까?` }); },
      remove(i) { (discs[sel] || []).splice(i, 1); return ok({ dialog: "삭제하시겠습니까?" }); },

  const amanoApi = REAL ? window.desk.amano : demoAmano;
  const park = { state: null, sel: null, busy: false, err: false, msg: "차량번호를 넣고 검색하면 아마노 화면에도 같은 값이 들어가요" };
  /* 할인 등록은 뒤에서 (네이버 이용완료처럼): 누르면 바로 '등록 중'으로 보이고 근무자는 다음 차를 검색함.
     실제 등록은 설치 앱의 숨은 아마노 창이 차례대로 하고, 실패하면 아래 줄에 빨갛게 남김 (꺼졌다 켜져도 이어서) */
  const PJ_KEY = "astana.parkJobs";
  park.jobs = (() => { try { return (JSON.parse(localStorage.getItem(PJ_KEY)) || []).map((j) => Object.assign(j, { run: false })); } catch (e) { return []; } })();
  park.q = null; // 마지막 검색 { day, no }
  function saveJobs() { try { localStorage.setItem(PJ_KEY, JSON.stringify(park.jobs)); } catch (e) {} }
  let parkJobBusy = false;
  async function parkFlush() {
    if (parkJobBusy) return;
    const j = park.jobs.find((x) => !x.why);
    if (!j) return;
    parkJobBusy = true; j.run = true; renderCars();
    let r;
    try { r = REAL ? await window.desk.amano.job(j) : await demoJob(j); } catch (e) { r = { ok: false, why: String(e && e.message || e) }; }
    parkJobBusy = false; j.run = false;
    if (r && r.ok) {
      park.jobs.splice(park.jobs.indexOf(j), 1);
      toast(`${j.carNo} ${j.type} 등록됨`);
      const row = park.state && park.state.rows.find((x) => x.id === j.id);
      if (row) row.count = (row.count || 0) + 1;
      // 그 차를 보고 있으면 할인내역을 새로 읽음
      if (park.sel === j.id && !park.busy) parkRun(`${j.carNo} 할인내역 새로 읽기`, () => amanoApi.select(j.id));
    } else j.why = (r && r.why) || "아마노 화면이 응답하지 않음";

    setTimeout(parkFlush, 0);
  }
  // 체험판: 뒤 창 대신 1.5초 걸리는 척
  async function demoJob(j) {
    await new Promise((res) => setTimeout(res, 1500));
    const keep = park.sel;
    await demoAmano.select(j.id);
    const r = await demoAmano.discount(j.type);
    await demoAmano.select(keep);

  async function parkRun(msg, fn) {
    if (park.busy) return;
    park.busy = true; park.err = false; park.msg = msg + " …"; renderCars();
    let r;
    try { r = await fn(); } catch (e) { r = { ok: false, why: String(e && e.message || e) }; }
    park.busy = false;
    if (r && r.state) park.state = r.state;

  function renderCars() {
    const st = park.state;
    const dis = park.busy ? "disabled" : "";
    $("cars").innerHTML = !st ? `<div class="empty">입차일은 새벽 손님 때문에 전날부터 찾아요</div>`
      : st.needLogin ? `<div class="empty">아마노 로그인이 풀렸어요${REAL ? `<br><button class="btn btn-sm" data-act="amanoShow">아마노 화면 보기</button>` : ""}</div>`
      : st.rows.length ? st.rows.map((c) => `<button class="car ${park.sel === c.id ? "on" : ""}" data-act="car" data-id="${esc(c.id)}" aria-pressed="${park.sel === c.id}" ${dis}>
          <span><b class="num">${esc(c.no)}</b>${c.count ? `<span class="cnt num">${c.count}건</span>` : ""}</span>
          <small class="num">${esc(c.at.slice(5, 16))} 입차</small>
          <small class="num">입차ID ${esc(c.id)}</small><span></span></button>`).join("")
      : `<div class="empty">검색된 차량이 없어요</div>`;
    const d = st && park.sel && st.detail && st.detail.no ? st : null;
    const btn = (t) => `<button class="btn" data-act="discount" data-h="${t}" ${park.busy || (d.types.length && !d.types.includes(t)) ? "disabled" : ""}>${t.replace("할인", "")}</button>`;
    const wait = d ? park.jobs.filter((j) => j.id === park.sel).map((j) => `<div><span class="num">${esc(j.type)} · ${j.why ? `<b style="color:var(--red)">등록 실패</b>` : "등록 중…"}</span><span></span></div>`).join("") : "";
    $("pcar").innerHTML = !d ? `<div class="empty">조회 목록에서 차량을 고르면 할인유형이 나와요</div>` : `
      <div class="no num">${esc(d.detail.no)}</div>
      <div class="tm num"><span>입차 ${esc(d.detail.at.slice(5, 16))}</span><b>${esc(d.detail.parked)}</b></div>
      <div class="dbtns">${DISC.map(btn).join("")}</div>
      <div class="dlist">${wait}${d.history.length ? d.history.map((h, i) => `<div><span class="num">${esc(h.type)} · ${esc(String(h.at).slice(11, 16))}</span>${h.canDelete === false ? `<span class="help">${esc(h.note || "삭제 불가")}</span>` : `<button data-act="discDel" data-i="${i}" aria-label="할인 삭제" ${dis}>삭제</button>`}</div>`).join("") : wait ? "" : `<span class="help">할인내역 없음</span>`}</div>`;
    const bad = park.jobs.filter((j) => j.why), going = park.jobs.length - bad.length;
    $("synclog").innerHTML = bad.length
      ? `<b style="color:var(--red)">⚠ 할인 등록 실패 ${bad.map((j) => `${esc(j.carNo)} ${esc(j.type)}`).join(", ")} — ${esc(bad[0].why)}</b> <button class="btn btn-sm" data-act="parkRetry">다시</button> <button class="btn btn-sm" data-act="parkDrop">지우기</button>`
      : `아마노${REAL ? "" : "(체험)"}: ${going ? `<b>뒤에서 할인 등록 중 ${going}건</b> · ` : ""}<b style="color:${park.err ? "var(--red)" : "inherit"}">${esc(park.msg)}</b>`;
  }

  /* 맨 위 '입장권 총 판매수' = 고른 날의 네이버 이용완료 장수(시간표 완료 합) + 현장입장 장수 (현장 10/6)
     현장입장 장수는 열쇠를 받은 개수(qty) — 반납해도 줄지 않음. 다른 날은 그날 저장 파일에서 읽음 */
  const walkByDay = {};
  function walkTickets(day) {
    let ws = day === TODAY ? walkins : walkByDay[day];
    if (!ws) {
      ws = [];
      try { const t = APP && window.desk.state ? window.desk.state.load(day) : null; if (t) ws = JSON.parse(t).w || []; } catch (e) { ws = []; }
      if (day < TODAY) walkByDay[day] = ws; // 지난날은 바뀌지 않으니 한 번만 읽음
    }
    return ws.reduce((a, w) => a + (w.qty || Math.max(1, (w.keys || []).length)), 0);
  }
  function renderSold(naverDone) {
    const walk = walkTickets(viewDay), all = naverDone + walk;
    const el = $("sold");
    el.innerHTML = `${viewDay === TODAY ? "오늘" : `${Number(viewDay.slice(5, 7))}/${Number(viewDay.slice(8))}`} 입장권 총 판매수 = <b class="num">${all}</b>장`;
    el.title = `네이버 이용완료 ${naverDone}장 + 현장입장 ${walk}장`;
  }

  // ── 네이버 판매 수량 자동 조절 ─────────────────────
  /* 2시간(4타임) 동안 안에 있는 손님 = 그 4타임의 네이버 예약(확정+완료) + 현장입장. 이 합이 목표(40~43)에 가깝게.
     - 이미 시작한 타임은 실제 숫자, 앞으로 올 타임은 예약 + 현장 추세(최근 3타임 현장 평균)
     - 바꿀 수 있는 타임(아직 시작 안 한 지금 · 앞 3타임)마다 '더 열 수 있는 수' = 그 타임이 들어간 모든 4타임 묶음의 남은 자리 중 가장 적은 것
     - 남은 자리를 한 장씩 나눠 줌: 예약이 많이 찬(인기) 타임에 더 (예약+1)/(더 준 수+1) 이 큰 순서 → 비인기 타임은 적게, 인기 타임은 많이
     - 회차당 수량 = 그 타임 예약 + 더 연 수, 한 타임 최대 max · 이미 예약된 것보다 적게는 안 함 */
  function planCaps(slots, adj, o) {
    const K = 4, idx = new Map(slots.map((x, i) => [x.t, i]));
    const base = slots.map((x) => x.used + x.walk + (x.started ? 0 : o.walkAvg || 0));
    const add = new Map(adj.map((t) => [idx.get(t), 0]).filter(([i]) => i != null));
    const winSum = (st) => { let v = 0; for (let j = Math.max(0, st); j < Math.min(slots.length, st + K); j++) v += base[j] + (add.get(j) || 0); return v; };
    const room = (i) => { let r = Infinity; for (let st = i - K + 1; st <= i; st++) r = Math.min(r, o.target - winSum(st)); return r; };
    for (let guard = 0; guard < 200; guard++) {
      let best = null, bv = -1;
      for (const [i, x] of add) {
        if (slots[i].mainUsed + x >= o.max || room(i) < 1) continue;
        const v = (1 + slots[i].used) / (x + 1);
        if (v > bv) { bv = v; best = i; }
      }
      if (best == null) break;
      add.set(best, add.get(best) + 1);
    }
    return [...add].map(([i, x]) => ({ t: slots[i].t, product: slots[i].product, from: slots[i].cap, to: slots[i].mainUsed + x, used: slots[i].used, walk: slots[i].walk, open: x }));
  }
  const capMain = (name) => new RegExp(RULES.capAuto.product.replace(/\s+/g, "\\s*")).test(name || "");
  /** 오늘 시간제 타임마다 { t, used(네이버 확정+완료 · 입장권 전부), mainUsed(조절할 상품), cap(조절할 상품의 회차당 수량), walk(현장), started } */
  function capSlots(day) {
    const list = bookings[day] || [];
    return SLOTS.filter((t) => minutesFor(day, t) != null).map((t) => {
      const ns = (naverSlots[day] || {})[t];
      const used = ns ? ns.conf + ns.done : list.filter((b) => b.slot === t && (b.status === "확정" || b.status === "완료")).reduce((a, b) => a + b.qty, 0);
      const raw = (naverRaw[day] || []).find((x) => toMin(x.time) === t && capMain(x.product));
      const walk = day === TODAY ? walkins.filter((w) => w.slot === t).reduce((a, w) => a + (w.qty || Math.max(1, w.keys.length)), 0) : 0;
      return { t, used, mainUsed: raw ? raw.conf + raw.done : used, cap: raw ? raw.cap : capDemo[t] ?? (ns ? ns.cap : RULES.slotCap), product: raw ? raw.product : "", walk, started: day === TODAY && t <= now };
    });
  }
  /** 지금 계획: { skip } 또는 { rows, adj, changes, walkAvg } */
  function capPlan() {
    const A = RULES.capAuto;
    if (!timedDay(TODAY)) return { skip: "오늘은 무제한인 날(비수기 평일)이라 조절하지 않아요" };
    const slots = capSlots(TODAY);
    const cur = Math.floor(now / 30) * 30;
    const adj = slots.filter((x) => x.t > now && x.t <= cur + 30 * A.ahead).map((x) => x.t);
    if (!adj.length) return { skip: "조절할 타임이 없어요 (시간제 타임이 끝남)" };
    const recent = slots.filter((x) => x.started && x.t >= cur - 60);
    const walkAvg = recent.length ? Math.round((recent.reduce((a, x) => a + x.walk, 0) / recent.length) * 10) / 10 : 0;
    const plan = planCaps(slots, adj, { target: A.target, max: A.max, walkAvg });
    // 이 타임으로 끝나는 4타임 묶음의 예상 손님 (계획대로 다 팔리면)
    const occ = (x) => { const c = plan.find((y) => y.t === x.t); return x.used + x.walk + (x.started ? 0 : walkAvg) + (c ? c.to - x.mainUsed : 0); };
    const win = (t) => { const i = slots.findIndex((x) => x.t === t); let v = 0; for (let j = Math.max(0, i - 3); j <= i; j++) v += occ(slots[j]); return Math.round(v); };
    return { slots, adj, walkAvg, plan, win, changes: plan.filter((c) => c.to !== c.from) };
  }
  let capBusy = false, capLastAt = null, capMark = null;
  const capLog = (() => { try { return JSON.parse(localStorage.getItem("astanakiz-caplog-" + TODAY)) || []; } catch (e) { return []; } })();
  function capNote(x) { capLog.unshift(Object.assign({ at: hm(now) }, x)); capLog.length = Math.min(capLog.length, 60); try { localStorage.setItem("astanakiz-caplog-" + TODAY, JSON.stringify(capLog)); } catch (e) { /* 저장 못 해도 동작 */ } }
  /** 한 번 조절: 네이버를 새로 읽고 → 계획 → 바뀌는 타임만 네이버에 넣음 (manual = 근무자가 누름) */
  async function capRun(manual) {
    if (capBusy) return;
    if (!manual && (naverBusy || sheet.mode === "enter" || sheet.mode === "walk")) return "wait";
    capBusy = true; if (sheet.mode === "settings") renderSheet();
    try {
      if (APP) { if (naverBusy) { toast("네이버를 불러오는 중이에요 — 잠시 뒤에 다시"); return "wait"; } await loadNaver(TODAY, false); if (naverErr && /로그인/.test(naverErr)) { capNote({ ok: false, why: naverErr }); return; } }
      const p = capPlan();
      capLastAt = now;
      if (p.skip) { if (manual) toast(p.skip); return; }
      if (!p.changes.length) { capNote({ ok: true, msg: `바꿀 것 없음 (${p.plan.map((c) => `${hm(c.t)} ${c.to}`).join(" · ")})` }); return; }
      const done = [];
      for (const c of p.changes) {
        // 조절할 상품 칸을 못 찾았으면 손대지 않음 (다른 상품 칸을 바꾸지 않게)
        if (APP && !c.product) { capNote({ t: hm(c.t), from: c.from, to: c.to, ok: false, why: `네이버에서 '${RULES.capAuto.product}' 상품 칸을 못 찾음` }); continue; }
        const r = APP ? await window.desk.naver.setCap({ day: TODAY, product: c.product, time: hm(c.t), n: c.to }).catch((e) => ({ ok: false, why: String(e) })) : { ok: true, from: c.from, to: c.to };
        capNote({ t: hm(c.t), from: c.from, to: c.to, ok: !!(r && r.ok), why: r && !r.ok ? r.why : "" });
        if (r && r.ok) {
          done.push(`${hm(c.t)} ${c.from}→${c.to}`);
          const raw = (naverRaw[TODAY] || []).find((x) => toMin(x.time) === c.t && capMain(x.product));
          if (raw) raw.cap = c.to; else capDemo[c.t] = c.to;
          const ns = (naverSlots[TODAY] || {})[c.t]; if (ns) ns.cap += c.to - c.from;
        }
      }
      const bad = p.changes.length - done.length;
      toast(`네이버 판매 수량 조절${done.length ? `: ${done.join(" · ")}` : ""}${bad ? ` · 실패 ${bad}건 (운영 설정 → 수량 자동조절)` : ""}`);
    } finally { capBusy = false; renderAll(); if (sheet.mode === "settings") renderSheet(); }
  }
  /** 매분: 켜져 있으면 10분마다 (실패 · 바쁨이면 다음 분에 다시) */
  function capTick() {
    const A = RULES.capAuto;
    if (!A.on || !timedDay(TODAY)) return;
    const mark = Math.floor(now / A.every) * A.every;
    if (capMark === mark || now < toMin(RULES.naverAuto.from) || now > toMin(RULES.unlimitedFrom)) return;
    capMark = mark; // 같은 10분에 두 번 안 돌게 — 바빠서 못 했으면 다음 분에 다시
    capRun(false).then((r) => { if (r === "wait" && capMark === mark) capMark = null; });
  }
  function saveCapAuto() {
    const v = Object.assign({}, RULES.capAuto);
    if (APP && window.desk.config) window.desk.config.set({ capAuto: v });
    else try { localStorage.setItem("astanakiz-capauto", JSON.stringify(v)); } catch (e) { /* 저장 못 해도 동작 */ }
  }

  function refreshText() {
    if (naverBusy) return `네이버: ${naverStep || "불러오는 중…"}`;
    // 뒤에서 하는 네이버 이용완료가 실패한 예약이 있으면 계속 빨간 글로 (성공하면 사라짐)
    const fail = (bookings[TODAY] || []).filter((b) => b.naverPending && b.naverWhy);
    if (fail.length) return `⚠ 네이버 이용완료 실패 ${fail.length}건: ${fail.map((b) => `${b.name} ${hm(b.slot)}`).join(", ")} — 2분마다 다시 · 안 되면 네이버에서 직접`;
    if (naverErr) return `⚠ ${naverErr}`;
    const nx = autoNext(now);
    return [lastRefresh == null ? "" : `${hm(lastRefresh)} 불러옴`, nx == null ? "" : `다음 ${hm(nx)}`, RULES.capAuto.on && timedDay(TODAY) ? `수량조절 ${capBusy ? "중…" : capLastAt == null ? "켜짐" : hm(capLastAt)}` : ""].filter(Boolean).join(" · ");
  }
  /** 정해진 자동 시각이 지났는데 그 뒤로 오늘 예약을 안 불러왔으면 불러옴
      (팝업을 쓰는 중이면 닫을 때까지 기다림 · 실패하면 1분 뒤 다시 · PC가 잠깐 멈췄어도 놓치지 않음) */
  function autoLoad() {
    const due = autoDue(now);
    if (due == null || (todayAt != null && todayAt >= due) || sheet.mode || naverBusy) return;
    if (autoTry != null && autoTry >= due && now - autoTry < 5) return; // 실패했으면 5분 뒤 다시 (계속 같은 날짜를 돌지 않게)
    autoTry = now;
    if (APP) { loadNaver(TODAY); return; }
    lastRefresh = todayAt = now; renderAll(); toast(`${hm(now)} 네이버 예약 자동 불러옴 (체험)`);
  }
  function renderAll() { saveState(); $("now").textContent = hm(now); $("refresh-at").textContent = refreshText(); $("refresh-at").style.color = (naverErr || (bookings[TODAY] || []).some((b) => b.naverPending && b.naverWhy)) && !naverBusy ? "var(--red)" : ""; renderSlots(); renderRes(); renderKeys(); renderCars(); }

  // ── 팝업 ─────────────────────────────────────────
  const sheet = { mode: null };
  function openSheet(s) { for (const k of Object.keys(sheet)) delete sheet[k]; Object.assign(sheet, s); $("overlay").hidden = false; renderSheet(); focusFirst(); }
  function focusFirst() { setTimeout(() => { const f = $("sheet").querySelector("[data-autofocus]"); if (f) f.focus(); }, 30); }
  function closeSheet() { sheet.mode = null; $("overlay").hidden = true; }

  function walkState() {
    const { base, all } = projection();
    const need = sheet.keys.length;
    const over = need > all, flex = !over && need > base;
    return { base, all, need, over, flex, phoneOk: digits(sheet.phone).length === 11 };
  }

  function renderSheet() {
    const el = $("sheet");
    el.classList.toggle("wide", sheet.mode === "enter");
    el.classList.toggle("walksheet", sheet.mode === "walk");
    el.classList.toggle("keysheet", sheet.mode === "key");
    el.classList.toggle("setsheet", sheet.mode === "settings");
    if (sheet.mode === "enter") {
      const b = findB(sheet.id);
      const ch = chainOf(b), ci = ch.indexOf(b);
      const m = ch.length > 1 ? chainMinutes(ch) : minutesFor(b.day, b.slot);
      // 예약 당일이면 언제든 입장 (5분 전은 손님 안내 기준일 뿐, 근무자가 현장 상황을 보고 더 일찍 들여보낼 수 있음)
      // 연속예약의 두 번째부터는 첫 예약에서 함께 처리
      const canEnter = b.status === "확정" && b.day === TODAY && ci <= 0;
      const early = canEnter && now < b.slot - RULES.earlyMinutes;
      let pickHtml = "";
      if (b.status === "확정") {
        let btns = "";
        for (let k = 1; k <= RULES.keys; k++) {
          const used = !!holderOf(k), on = sheet.keys.includes(k);
          btns += `<button type="button" class="num ${on ? "on" : ""}" data-act="pickKey" data-k="${k}" ${used || !canEnter ? "disabled" : ""} aria-pressed="${on}" aria-label="${k}번${used ? " 지급됨" : ""}">${k}</button>`;
        }
        pickHtml = `<div class="field"><span class="label">지급할 열쇠 <span class="help num">예약 수량 ${b.qty}개만큼 누르세요 · ${sheet.keys.length}/${b.qty} · 흐린 번호는 이미 지급됨</span></span><div class="kpick">${btns}</div></div>`;
      }
      const chainNote = ch.length < 2 ? "" : ci > 0 ? `<div class="banner warn">연속예약 ${ci + 1}/${ch.length} — 첫 예약(${hm(ch[0].slot)}) 카드에서 입장 처리하면 이 예약도 함께 이용완료돼요</div>`
        : `<div class="banner"><b>★${ch.length}타임 연속예약</b> (${ch.map((x) => `${hm(x.slot)} ${x.qty}장`).join(" · ")}) — 입장하면 ${ch.length}건 모두 이용완료 · 열쇠 ${b.qty}개: ${keyPlan(ch, b.qty)}</div>`;
      const oddN = oddNext(b);
      const oddNote = oddN.length ? `<div class="banner warn"><b>⚠ 연속이용 아님</b> — ${oddN.map((o) => `${hm(o.other.slot)} 예약과 ${o.gap > 0 ? `${o.gap}분 비어요` : `${-o.gap}분 겹쳐요`}`).join(", ")}. 연속이용은 2시간 이내 간격 예약만이에요. 이 예약은 따로 1시간 50분 — 끝나면 나갔다가 다음 예약 시간에 다시 입장하도록 안내해 주세요 (중간에 열쇠가 모자랄 수 있어요)</div>` : "";
      const note = oddNote + chainNote + (b.status !== "확정" ? "" : b.day !== TODAY ? `<div class="banner warn">이용일(${b.day.slice(5).replace("-", "/")})에 입장 처리할 수 있어요</div>`
        : early ? `<div class="banner">예약 ${hm(b.slot)}보다 일찍 입장 — 근무자 판단으로 가능해요 (손님 안내 기준은 ${hm(b.slot - RULES.earlyMinutes)}). ${m == null ? "" : `이용시간은 예약 시간부터라 일찍 온 만큼 더 놀 수 있어요 (반납 ${hm(b.slot + m)})`}</div>` : "");
      el.innerHTML = `
        <h3 id="sheet-title">네이버 예약자 <button class="x" data-act="close" aria-label="닫기">×</button></h3>
        <dl class="facts">

    // 퇴장시간: 열쇠마다 다르면(연속예약) "오후 5시 50분 (13번 오후 3시 50분)"
    const ends = h.keys.map((k) => ({ k, m: useOf(h, k) }));
    const main = ends.some((e) => e.m == null) ? null : Math.max(...ends.map((e) => e.m));
    const extra = main == null ? [] : ends.filter((e) => e.m !== main);
    const out = main == null ? "시간제한 없음" : krTime(h.slot + main) + (extra.length ? ` (${extra.map((e) => `${e.k}번 ${krTime(h.slot + e.m)}`).join(", ")})` : "");
    const naver = !h.walk;
    return {
      // 현장 이용자는 이름을 모름 → 고객명은 빈칸 (줄은 그대로)
      구분: naver ? "네이버" : "현장", 고객: h.walk ? "   " : maskName(h.name), 전화뒤4: digits(h.phone).slice(-4), 열쇠: h.keys.join(", "),
      // 입장시간 = 예약한 입장 시간 (현장은 입장한 시각)
      입장시간: krTime(h.slot), 퇴장시간: out, 누계: h.visitNo ? String(h.visitNo) : "", 기준회: String(RULES.giftEvery), 사은권: RULES.giftName,
      날짜: TODAY, 시각: hm(now), _네이버: naver && !!h.visitNo, _현장: !naver, _사은권: naver && !!h.visitNo && isGift(h.visitNo),
    };
  };

  // ── 초과요금 미터 ────────────────────────────────
  /* 초과요금 (열쇠 1개 기준, 예약 입장시간부터)
     ~ 1:50:00 페널티 없음 · 1:50:01 부터 카운트업 시작
     2:00:00 정각에 5,000원 · 2:10:00 정각에 10,000원 … 10분이 꽉 찰 때마다 오름
     열쇠 수만큼 곱함. POS 결제를 누른 순간 금액으로 고정 */
  function overInfo(h) {
    // 열쇠마다 반납 시각이 다를 수 있음(연속예약) → 열쇠별로 세어 더함
    let best = { sec: 0, due: 0, units: 0 };
    let due = 0;
    for (const k of h.keys) {
      const m = useOf(h, k);
      if (m == null) continue;
      const secOver = (now * 60 + sec) - (h.slot + m) * 60;
      if (secOver <= 0) continue;
      const units = Math.floor(secOver / (RULES.overUnitMin * 60));
      due += units * RULES.overFee;
      if (secOver > best.sec) best = { sec: secOver, units };
    }
    return { sec: best.sec, units: best.units, due };
  }
  const won = (n) => n.toLocaleString("ko-KR") + "원";
  const clock = (t) => `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
  function meterHtml(h) {
    if (h.overPaid) return `<div class="meter paid"><div class="mt">초과요금 결제 완료</div><div class="amt num">${won(h.overPaid.amount)}</div><div class="calc num">초과 ${clock(h.overPaid.sec)} 기준 · ${hm(h.overPaid.at)} POS 결제</div></div>`;
    const o = overInfo(h);
    if (o.sec <= 0) return "";
    const nextIn = RULES.overUnitMin * 60 - (o.sec % (RULES.overUnitMin * 60));
    return `<div class="meter">
      <div class="mt">반납 시간 지남 · 초과 경과</div>
      <div class="tick num">${clock(o.sec)}</div>
      <div class="amt num">${won(o.due)}</div>
      <div class="calc num">${won(RULES.overFee)} × ${o.units}(10분) × 열쇠 ${h.keys.length}개 · 다음 +${won(RULES.overFee * h.keys.length)}까지 ${Math.floor(nextIn / 60)}:${String(nextIn % 60).padStart(2, "0")}</div>
      <button class="btn btn-red" data-act="payOver" ${o.due ? "" : "disabled"}>POS로 결제 · ${won(o.due)}</button>
    </div>`;
  }
  const holderById = (id) => bookings[TODAY].concat(walkins).find((x) => x.id === id && x.keys.length);
  let sec = 0; // 체험 시계의 초
  setInterval(() => {
    if (APP) {
      const d = new Date(); sec = d.getSeconds();
      const m = d.getHours() * 60 + d.getMinutes();
      if (m !== now) { now = m; renderAll(); }
    } else {
      sec++;
      if (sec >= 60) { sec = 0; now++; renderAll(); }
    }
    autoLoad();
    capTick();
    if (sheet.mode === "key" && $("pos").hidden) { const h = holderById(sheet.hid); const mt = $("meter"); if (h && mt) { const before = !!overInfo(h).due; mt.innerHTML = meterHtml(h); if (sec === 0 || (!!overInfo(h).due !== before)) renderSheet(); } }
  }, 1000);

  // POS 화면으로: 앱에서는 켜져 있는 POS 창을 앞으로 띄우고, 데스크 창이 다시 앞에 오면 결제 끝으로 봄
  let posAway = false;
  let CFG = null; // 설치한 앱의 설정 (아마노 주소 · POS 창 제목 · 배운 칸)
  async function goPos() {
    if (window.desk && window.desk.pos) {
      // 설치한 앱: 실제 OKPOS 창으로 바로 넘어감 (못 찾으면 알리기만 — 가짜 POS 화면은 띄우지 않음)
      const r = await window.desk.pos.show();
      if (r && r.ok) { posAway = true; return; }
      toast((r && r.why) || "POS 창을 찾지 못함");
      return;
    }
    $("pos").hidden = false; // 체험판: 가짜 POS 화면
  }
  window.addEventListener("focus", () => { if (posAway) { posAway = false; acts.posDone(); } });

  // ── 동작 ─────────────────────────────────────────
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600); }
  function nextFree(from, exclude) {
    const free = freeKeys().filter((k) => !exclude.includes(k));
    return free.filter((k) => k >= from).concat(free.filter((k) => k < from))[0];
  }
  function returnKeys(h, ks) {
    h.keys = h.keys.filter((k) => !ks.includes(k));
    if (!h.keys.length) h.outAt = now;
    toast(`${ks.join(", ")}번 반납${h.keys.length ? "" : ` · ${h.walk ? "현장입장자" : h.name + "님"} 퇴장`}`);
  }
  // 현장입장 전화번호: 010은 고정, 뒤 8자리만 받음 (010을 지워도 다시 붙음)
  function walkPhone(v) {
    const d = digits(v);
    return "010" + (d.startsWith("010") ? d.slice(3) : d.length < 3 ? "" : d).slice(0, 8);
  }
  const walkFmt = (p) => { const r = digits(p).slice(3); return "010-" + r.slice(0, 4) + (r.length > 4 ? "-" + r.slice(4) : ""); };
  function updateWalkButtons() {
    const done = $("w-done"); if (!done) return;
    const st = walkState();
    done.disabled = st.over || !st.phoneOk || (st.flex && !sheet.flexOk);
  }

  const acts = {
    // 새로고침: 자동 시각(매시 20분 · 50분) 사이에 들어온 예약을 바로 불러옴 (체험판은 화면만 다시 그림)
    refresh() {
      if (APP) { loadNaver(viewDay, true); return; }
      lastRefresh = now; if (viewDay === TODAY) todayAt = now; renderAll(); toast(`${hm(now)} 새로고침 (체험)`);
    },
    time(btn) { now += Number(btn.dataset.min); renderAll(); autoLoad(); if (sheet.mode === "key") renderSheet(); },
    day(btn) { viewDay = shiftDay(viewDay, Number(btn.dataset.d)); renderAll(); },
    // 시간 칸을 누르면 그 시간만 네이버에서 다시 불러옴 (전체는 위의 [새로고침])
    slot(btn) { selSlot = Number(btn.dataset.s); renderAll(); if (APP) loadNaver(viewDay, false, hm(selSlot)); },
    openRes(el) { openSheet({ mode: "enter", id: el.dataset.id, keys: [] }); },
    pickKey(btn) {
      const k = Number(btn.dataset.k), b = findB(sheet.id);
      if (sheet.keys.includes(k)) sheet.keys = sheet.keys.filter((x) => x !== k);
      else if (sheet.keys.length < b.qty) sheet.keys.push(k);
      else if (b.qty === 1) sheet.keys = [k];
      else { toast(`수량 ${b.qty}개를 이미 골랐어요. 고른 번호를 다시 눌러 빼 주세요`); return; }
      renderSheet();
    },
    key(btn) {
      const k = Number(btn.dataset.k);
      const h = holderOf(k);
      if (h) { openSheet({ mode: "key", hid: h.id }); return; }
      openSheet({ mode: "walk", keys: [k], phone: "010", paid: false, flexOk: false }); // 010은 미리 넣어 둠
    },
    async doEnter(btn) {
      const b = findB(sheet.id);
      if (sheet.keys.length !== b.qty || sheet.busy) return;
      if (sheet.keys.some((k) => holderOf(k))) { toast("그 사이 다른 손님이 쓴 열쇠가 있어요. 다시 골라 주세요."); sheet.keys = []; renderSheet(); return; }
      // 열쇠는 바로 등록하고 네이버 이용완료는 뒤에서 (naverFlush) — 근무자가 기다리지 않음
      if (APP) b.naverPending = true;
      const ch = chainOf(b);
      Object.assign(b, { status: "완료", keys: sheet.keys.slice(), enteredAt: now, visitNo: b.prevDone == null ? null : b.prevDone + 1 });
      const moveSlot = (x) => { const nsl = (naverSlots[x.day] || {})[x.slot]; if (nsl) { nsl.conf = Math.max(0, nsl.conf - x.qty); nsl.done += x.qty; } }; // 다음 불러오기 전까지 칸 숫자도 확정 → 완료
      moveSlot(b);
      if (ch.length > 1 && ch[0] === b) {
        // 연속예약: 열쇠 이용시간을 묶음 전체로, 나머지 예약도 이용완료 (네이버는 뒤에서 차례로 · 실패하면 자동으로 다시)
        const ms = chainKeyMinutes(ch, b.qty);
        b.keyUse = Object.fromEntries(b.keys.map((k, i) => [k, ms[i]]));
        let prevQty = b.qty;
        for (const x of ch.slice(1)) {
          if (x.status !== "확정") continue;
          if (x.qty > prevQty) break; // 뒤 타임에 사람이 늘면 그 예약은 따로 입장 처리 (열쇠를 더 줘야 함)
          prevQty = x.qty;
          Object.assign(x, { status: "완료", enteredAt: now, chainHead: b.id, naverPending: APP, visitNo: x.prevDone == null ? null : x.prevDone + 1 + ch.indexOf(x) });
          moveSlot(x);
        }
      }
      closeSheet();
      if (APP) setTimeout(naverFlush, 0); // 네이버 이용완료는 뒤에서
      // 방문 횟수를 아직 모르면(네이버 카드에서 못 읽음) 입장권은 뒤에서 네이버 이용완료 때 '완료 n'을 읽은 뒤 출력
      const waitVisit = APP && b.prevDone == null && PRINT.forms.enter.auto;
      if (waitVisit) b.printWaiting = true;
      toast(`${b.name}님 입장 · 열쇠 ${b.keys.join(", ")}번${APP ? " · 네이버 이용완료는 뒤에서 처리 중" : " · 네이버 이용완료"}${isGift(b.visitNo) ? ` · ${b.visitNo}번째 방문, ${RULES.giftName}을 드리세요` : ""}${waitVisit ? " · 입장권은 방문 횟수를 확인한 뒤 출력" : printForm("enter", keyVals(b))}`);
      renderAll();
    },
    qty(btn) {
      const d = Number(btn.dataset.d);
      if (d < 0 && sheet.keys.length > 1) sheet.keys.pop();
      if (d > 0) { const add = nextFree(sheet.keys[sheet.keys.length - 1] + 1, sheet.keys); if (add) sheet.keys.push(add); else toast("빈 열쇠가 없어요"); }
      renderSheet(); $("w-phone").focus();
    },
    flexOk() { sheet.flexOk = !sheet.flexOk; renderSheet(); },
    // 터치 키패드: 전화번호 뒤 8자리
    kp(btn) {
      const k = btn.dataset.k;
      let rest = digits(sheet.phone).slice(3);
      if (k === "del") rest = rest.slice(0, -1); else if (k === "clr") rest = ""; else if (rest.length < 8) rest += k;
      sheet.phone = "010" + rest;
      const p = $("w-phone"); if (p) p.value = walkFmt(sheet.phone);
      updateWalkButtons();
    },
    // 맨 위 'POS로 이동': 결제와 상관없이 POS 화면으로 (POS를 최소화하면 데스크로 돌아옴)
    async posGo() {
      if (window.desk && window.desk.pos) {
        const r = await window.desk.pos.show();
        if (!r || !r.ok) toast((r && r.why) || "POS 창을 찾지 못함");
        return;
      }
      $("pos-amt").textContent = "POS 화면"; $("pos").hidden = false; // 체험판: 가짜 POS 화면
    },
    pay() { sheet.paid = true; $("pos-amt").textContent = `현장입장 ${sheet.keys.length}장`; goPos(); },
    payOver() {
      const h = holderById(sheet.hid); const o = overInfo(h); if (!o.due) return;
      sheet.pending = { amount: o.due, sec: o.sec, at: now }; // 누르기 직전 금액으로 고정
      $("pos-amt").textContent = `초과요금 ${won(o.due)} (열쇠 ${h.keys.join(", ")}번)`; goPos();
    },
    posDone() {
      $("pos").hidden = true;
      if (sheet.mode === "key" && sheet.pending) { const h = holderById(sheet.hid); if (h) h.overPaid = sheet.pending; sheet.pending = null; toast(`초과요금 ${won(h.overPaid.amount)} 결제됨 (영수증은 POS에서)`); }
      renderSheet(); const p = $("w-phone"); if (p) p.focus();
    },
    walkDone() {
      if (sheet.keys.some((k) => holderOf(k))) { toast("그 사이 다른 손님이 쓴 열쇠가 있어요"); closeSheet(); renderAll(); return; }
      const w = walkin(digits(sheet.phone), sheet.keys, now);
      closeSheet(); toast(`현장입장자 · 열쇠 ${w.keys.join(", ")}번 등록${printForm("enter", keyVals(w))}`); renderAll();
    },
    bulkReturn() { openSheet({ mode: "bulk" }); },
    bulkDo() {
      const hs = holders().slice();
      const n = hs.reduce((a, h) => a + h.keys.length, 0);
      for (const h of hs) { h.keys = []; h.outAt = now; }
      closeSheet(); renderAll(); toast(`열쇠 ${n}개 일괄 반납 · ${hs.length}명 퇴장 처리`);
    },
    returnAll() { const h = holderById(sheet.hid); returnKeys(h, h.keys.slice()); closeSheet(); renderAll(); },
    returnKey(btn) {
      const h = holderById(sheet.hid); returnKeys(h, [Number(btn.dataset.k)]); renderAll();
      if (h.keys.length) renderSheet(); else closeSheet();
    },
    settings() { openSheet({ mode: "settings", tab: "rules" }); },
    async setTab(btn) {
      sheet.tab = btn.dataset.t;
      if (sheet.tab === "link" && REAL) CFG = await window.desk.config.get();
      renderSheet();
    },
    async cfgSave() {
      const patch = { amanoUrl: $("cfg-url").value.trim(), posTitle: $("cfg-pos").value.trim(), amanoId: $("cfg-id").value.trim() };
      if ($("cfg-pw").value) patch.amanoPw = $("cfg-pw").value;
      const r = await window.desk.config.set(patch);
      if (r && r.ok === false) { toast(r.why); return; }
      CFG = await window.desk.config.get(); toast("저장했어요"); renderSheet();
    },
    async learn(btn) {
      toast("아마노 화면에서 그 칸을 한 번 클릭하세요");
      const r = await window.desk.amano.learn(btn.dataset.k);
      CFG = await window.desk.config.get();
      toast(r && r.ok ? "기억했어요" : (r && r.why) || "기억하지 못했어요"); renderSheet();
    },
    async findPrinters() {
      if (APP && window.desk.print) {
        const r = await window.desk.print.list();
        if (!r || !r.ok) { PRINT.msg = `프린터 목록을 못 읽음: ${(r && r.why) || ""}`; renderSheet(); return; }
        PRINT.list = r.list;
      }
      PRINT.found = true;
      if (!PRINT.sel || !PRINT.list.some((p) => p.name === PRINT.sel)) {
        const guess = PRINT.list.find((p) => RECEIPT_RE.test(p.name) && !/pdf|xps|fax|onenote/i.test(p.name));
        PRINT.sel = guess ? guess.name : null;
      }
      PRINT.msg = `프린터 ${PRINT.list.length}대 찾음${PRINT.sel ? ` · ${PRINT.sel} 고름` : " · 영수증 프린터를 직접 골라 주세요"}${APP ? "" : " (체험)"}`;
      savePrint(); renderSheet();
    },
    capNow() { capRun(true); },
    addPeak() { const last = RULES.peaks[RULES.peaks.length - 1]; RULES.peaks.push({ from: last ? last.to : TODAY, to: last ? last.to : TODAY }); savePeaks(); renderSheet(); },
    delPeak(btn) { RULES.peaks.splice(Number(btn.dataset.i), 1); savePeaks(); renderSheet(); renderAll(); },
    printMode(btn) { PRINT.mode = btn.dataset.m; PRINT.msg = ""; savePrint(); renderSheet(); },
    async findPorts() {
      if (APP && window.desk.print && window.desk.print.ports) {
        PRINT.msg = "COM 포트 찾는 중…"; renderSheet();
        const r = await window.desk.print.ports();
        if (!r || !r.ok) { PRINT.msg = `포트를 못 읽음: ${(r && r.why) || ""}`; renderSheet(); return; }
        PRINT.ports = r.list;
      } else PRINT.ports = [{ name: "USB Serial Port (COM3)", port: "COM3" }, { name: "통신 포트 (COM1)", port: "COM1" }];
      PRINT.portsFound = true;
      if (!PRINT.port && PRINT.ports.length) PRINT.port = (PRINT.ports.find((p) => /usb|serial|printer|prolific|ch34|cp210|ftdi/i.test(p.name)) || PRINT.ports[0]).port;
      PRINT.msg = PRINT.ports.length ? `COM 포트 ${PRINT.ports.length}개 · OKPOS 프린터 설정과 같은 포트를 고르세요` : "COM 포트가 없어요 — 프린터 케이블 · 전원을 확인해 주세요";
      savePrint(); renderSheet();
    },
    pickPort(btn) { PRINT.port = btn.dataset.p; PRINT.msg = ""; savePrint(); renderSheet(); },
    pickPrinter(btn) { PRINT.sel = btn.dataset.n; PRINT.msg = ""; savePrint(); renderSheet(); },
    async testPrint(btn) {
      if (!APP || !window.desk.print) { toast(`${printerName()}로 테스트 출력 보냄 (체험)`); return; }
      PRINT.busy = true; PRINT.msg = "출력 보내는 중…"; renderSheet();
      const dlg = !!(btn && btn.dataset.act === "testPrintDlg");
      const r = await sendPrint(PRINT.forms.enter.text, SAMPLE, { dialog: dlg });
      PRINT.busy = false;
      PRINT.msg = r && r.ok ? `${printerName()}로 보냈어요 — 종이가 나오고 ${PRINT.cut && !dlg ? "잘렸는지" : "나왔는지"} 확인해 주세요. 글자가 깨져 나오면 속도를 바꿔 보세요${r.cutWhy ? ` (자르기 실패: ${r.cutWhy})` : ""}` : `출력 실패: ${(r && r.why) || "응답 없음"}`;
      renderSheet();
    },
    testPrintDlg(btn) { return acts.testPrint(btn); },
    previewKind(btn) { SAMPLE = btn.dataset.k === "walk" ? SAMPLE_WALK : SAMPLE_NAVER; renderSheet(); },
    resetForm() { PRINT.forms.enter.text = ENTER_FORM; savePrint(); renderSheet(); },
    car(btn) {
      park.sel = btn.dataset.id;
      const c = park.state.rows.find((x) => x.id === park.sel);
      parkRun(`${c.no} 선택`, () => amanoApi.select(park.sel));
    },
    // 할인 버튼: 기다리지 않고 '등록 중'으로 올린 뒤 바로 다음 차 검색 (등록은 뒤에서)
    discount(btn) {
      const c = park.state.rows.find((x) => x.id === park.sel), type = btn.dataset.h;
      if (!c || !park.q) return;
      if (park.jobs.some((j) => j.id === c.id && j.type === type && !j.why)) { toast(`${c.no} ${type}은 이미 등록 중이에요`); return; }
      park.jobs.push({ day: park.q.day, no: park.q.no, id: c.id, carNo: c.no, type, at: hm(now) });
      saveJobs();
      park.err = false; park.msg = `${c.no} ${type} → 뒤에서 등록 중. 다음 차를 검색하세요`;
      renderCars();
      $("car-q").value = ""; $("car-q").focus();
      parkFlush();
    },
    parkRetry() { park.jobs.forEach((j) => delete j.why); saveJobs(); renderCars(); parkFlush(); },
    parkDrop() {
      if (!confirm("실패한 할인 등록을 지울까요? 아마노에는 등록되지 않은 상태예요.")) return;
      park.jobs = park.jobs.filter((j) => !j.why); saveJobs(); renderCars();
    },
    discDel(btn) { parkRun("할인내역 삭제", () => amanoApi.remove(Number(btn.dataset.i))); },
    amanoShow() { if (REAL) window.desk.amano.show(); },
    naverShow() { if (APP) window.desk.naver.show(); },
    // 문제 확인용: 지금 네이버 창 화면을 바탕화면 '아스타나키즈-진단' 폴더에 저장
    async naverDump() {
      if (!APP || !window.desk.naver.dump) return;
      const r = await window.desk.naver.dump();
      toast(r && r.ok ? "바탕화면 '아스타나키즈-진단' 폴더에 저장했어요" : `저장 못 함: ${(r && r.why) || ""}`);
    },
    async naverHome() {
      const r = await window.desk.naver.setHome();
      CFG = await window.desk.config.get();
      toast(r && r.ok ? "네이버 시작 화면을 기억했어요" : (r && r.why) || "기억하지 못했어요"); renderSheet();
      if (r && r.ok) loadNaver(viewDay, true);
    },
    close() { closeSheet(); },
  };

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (btn && !btn.disabled && acts[btn.dataset.act]) { acts[btn.dataset.act](btn); return; }
    if (e.target === $("overlay")) acts.close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !$("pos").hidden) return;
    if (sheet.mode) acts.close();
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "form-text") { PRINT.forms[PRINT.cur].text = t.value; $("paper").innerHTML = paperHtml(t.value, SAMPLE); savePrint(); }
    if (t.id === "form-auto") { PRINT.forms[PRINT.cur].auto = t.checked; savePrint(); }
    if (t.id === "print-cut") { PRINT.cut = t.checked; savePrint(); }
    if (t.id === "cap-on") { RULES.capAuto.on = t.checked; capMark = null; saveCapAuto(); renderAll(); toast(t.checked ? "네이버 판매 수량 자동 조절을 켰어요 (10분마다)" : "자동 조절을 껐어요"); }
    if ((t.id === "cap-target" || t.id === "cap-max") && t.value) { RULES.capAuto[t.id === "cap-target" ? "target" : "max"] = Math.max(1, Math.min(60, Number(t.value) || 0)); saveCapAuto(); }
    if (t.id === "com-baud") { PRINT.baud = Number(t.value); savePrint(); }
    if (t.id === "w-phone") { sheet.phone = walkPhone(t.value); t.value = walkFmt(sheet.phone); updateWalkButtons(); }
    const m = /^p(f|t)-(\d+)$/.exec(t.id);
    if (m && t.value) { RULES.peaks[+m[2]][m[1] === "f" ? "from" : "to"] = t.value; savePeaks(); renderAll(); }
  });
  // 차량번호 숫자패드: 칸을 누르거나(터치 · 마우스) 커서가 가면 뜨고, 다른 곳을 누르거나 검색하면 닫힘
  (function carPad() {
    const q = $("car-q"), pad = $("carpad");
    // 왼쪽 조회 목록 칸 위에 띄움 (오른쪽 할인정보 · '등록 중'은 가리지 않게)
    const open = () => { const c = $("cars"); pad.style.left = "0px"; pad.style.width = Math.max(220, c.offsetWidth) + "px"; pad.hidden = false; };
    const close = () => { pad.hidden = true; };
    q.addEventListener("focus", open);
    q.addEventListener("pointerdown", open);
    q.addEventListener("blur", close);
    q.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    pad.addEventListener("pointerdown", (e) => e.preventDefault()); // 패드를 눌러도 커서가 칸에 그대로
    pad.addEventListener("mousedown", (e) => e.preventDefault());
    pad.addEventListener("click", (e) => {
      const b = e.target.closest("[data-cp]"); if (!b) return;
      const k = b.dataset.cp;
      if (k === "go") { close(); $("park-form").requestSubmit(); return; }
      q.value = k === "del" ? q.value.slice(0, -1) : k === "clr" ? "" : q.value + k;
      q.focus();
    });
    window.__carPad = { open, close };
  })();
  $("park-form").addEventListener("submit", (e) => {
    e.preventDefault();
    $("carpad").hidden = true;
    const day = $("car-day").value, no = digits($("car-q").value);
    if (!no) { toast("차량번호를 넣어 주세요"); return; }
    park.sel = null; park.q = { day, no };
    parkRun(`입차일 ${day} · 차량번호 ${no} 검색`, () => amanoApi.search(day, no));
  });

  // 창 크기에 맞춰 1024×768 화면을 통째로 맞춤 (가운데 정렬)
  function fit() {
    const st = $("stage");
    const k = Math.min(window.innerWidth / 1024, window.innerHeight / 768);
    st.style.transform = `scale(${k})`;
    st.style.left = Math.max(0, (window.innerWidth - 1024 * k) / 2) + "px";
    st.style.top = Math.max(0, (window.innerHeight - 768 * k) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  // 주차 입차일: 기본 전날 (새벽 손님 때문)
  $("car-day").value = shiftDay(TODAY, -1);
  if (APP) {
    // 자정이 지나 날짜가 바뀌면 새 날로 다시 열기 (열쇠·입장 기록은 날짜별로 저장돼 있음). 팝업을 쓰는 중이면 닫은 뒤
    setInterval(() => { if (localKey(new Date()) !== TODAY && !sheet.mode) location.reload(); }, 30 * 1000);
    document.querySelectorAll("[data-act=time]").forEach((b) => (b.hidden = true));
    document.querySelector(".top .tag").textContent = "";
    document.querySelector(".top .tag").title = "";
    if (window.desk.config) window.desk.config.get().then((c) => { if (c && c.build) document.querySelector(".top .tag").textContent = `ver.${c.build}`; }).catch(() => {});
  }

  // 시험용: 입장권을 만드는 함수들 (자동 시험이 실제 입장 손님으로 출력 내용을 확인)
  document.addEventListener("change", (e) => { if (e.target.id === "cap-target" || e.target.id === "cap-max") renderSheet(); }); // 숫자를 다 넣으면 계획 다시
  window.__deskTest = { planCaps, capPlan, capRun, capLog, capDemo, RULES, walkin, setNow: (m) => { now = m; renderAll(); }, keyVals, receiptLines, escposParts, form: () => PRINT.forms.enter.text, holders: () => holders(), LINE_COLS };

  // ── 반납안내 커튼 ─────────────────────────────────
  (function curtain() {
    const tab = $("curtain-tab"), cur = $("curtain");
    let drag = null;
    const set = (y, mode) => { cur.classList.remove("anim", "fast"); if (mode) cur.classList.add(mode); cur.style.transform = `translateY(${y})`; };
    const show = () => { cur.setAttribute("aria-hidden", "false"); tab.hidden = true; set("0", "anim"); };
    const hideNow = () => { cur.setAttribute("aria-hidden", "true"); set("-100%"); tab.hidden = false; }; // 아래 손잡이: 바로 사라짐
    const liftFast = () => { cur.setAttribute("aria-hidden", "true"); set("-100%", "fast"); setTimeout(() => (tab.hidden = false), 220); }; // 빨간 별: 위로 빨리 걷힘
    // 위 손잡이를 끌어 내림 (손가락 · 마우스). 그냥 누르기만 해도 내려옴
    tab.addEventListener("pointerdown", (e) => { drag = { y0: e.clientY }; try { tab.setPointerCapture(e.pointerId); } catch (err) { /* 없음 */ } set("-100%"); });
    tab.addEventListener("pointermove", (e) => { if (drag) set(`calc(-100% + ${Math.max(0, e.clientY - drag.y0)}px)`); });
    tab.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const dy = Math.max(0, e.clientY - drag.y0);
      drag = null;
      if (dy > window.innerHeight * 0.2 || dy < 6) show(); else set("-100%", "anim");
    });
    tab.addEventListener("pointercancel", () => { drag = null; set("-100%", "anim"); });
    tab.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") show(); });
    $("curtain-bottom").addEventListener("click", hideNow);
    $("curtain-bottom").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") hideNow(); });
    $("curtain-star").addEventListener("click", liftFast);
  })();
  fit();
  renderAll();
  parkFlush(); // 꺼지기 전에 남은 할인 등록 이어서
})();
</script>
