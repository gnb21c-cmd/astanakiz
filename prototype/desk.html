<title>아스타나키즈 입장 데스크</title>
<meta name="description" content="네이버 예약 확인·이용완료, 열쇠 관리, 현장 입장(POS 결제 전환), 아마노 주차등록을 POS 화면 한 장(1024×768)에서 처리하는 근무자용 체험판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치 (사장님 스케치 기준, POS 1024×768 한 장)
   왼쪽: 날짜 ← → · 시간별 확정/잔여 | 가운데: 고른 시간의 예약자 명단 | 오른쪽: 열쇠판 10칸×5줄 · 아래 주차등록
   각 칸 안에서만 스크롤. 1000px 보다 좁으면 한 줄씩 쌓음 */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F4F6F9;
  --fg: #141A26;
  --muted: #5D6778;
  --faint: #A9B1BE;
  --line: #D9DEE6;
  --ink: #141A26;
  --on-ink: #FFFFFF;
  --accent: #2B59C3;
  --accent-bg: #E3EAFA;
  --naver: #0B8F47;
  --naver-bg: #E1F3E8;
  --sky-bg: #DCEFFC;
  --sky-line: #8CC5EE;
  --done-bg: #E6E8EC;
  --pink: #F2A7BC;
  --pink-fg: #7A1F3A;
  --red: #D23A3A;
  --nm-k3: #A87400; /* 3자녀가정 이름 (사장님 10/20 — 밝은 화면은 짙은 노랑, 어두운 화면은 노랑) */
  --yellow: #FFD23F; --yellow-fg: #C81E1E; /* 예약 수량 2장 이상 스티커: 노랑 네모 · 빨강 글씨 (사장님 10/16) */
  --ochre: #E8CB8E; /* 이벤트 쿠폰 지급 네모 (옅은 황토색 · 밝은 · 어두운 화면 같음) */
  --ok: #1D7F52;
  --warn-bg: #FBE3E3;
  /* V2.0 색 약속 (사장님 10/21): 한 가지 뜻에 한 가지 색 — 미입장(할 일) 파랑 · 사은권 금색 · 빨강은 지금 처리할 문제에만
     열쇠 테두리: 네이버 예약 = 잉크(어두운 화면 흰색) · 현장 = 파랑(--walk) · 서비스 = 잉크 점선 */
  --todo: #2563EB; --todo-fg: #FFFFFF;
  --gift: #FFC400; --gift-fg: #2B1F00;
  --walk: #2563EB;
  --err-bg: #FDE7E7;
  --amber: #B45F00;
  --shadow: 0 1px 2px rgba(20, 26, 38, .06), 0 3px 12px rgba(20, 26, 38, .05);
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* V2.0 시안 B '선명한 다크' (사장님 10/21) — 더 검은 바탕 · 흰 글씨 · 원색 */
    --sky-bg: #0C2440; --sky-line: #2D6CB0; --done-bg: #1A1F28;
    --bg: #06080C; --surface: #10141B; --surface-2: #161B24; --fg: #FFFFFF; --muted: #B3BDCC; --faint: #545F70; --line: #252D3A;
    --ink: #FFFFFF; --on-ink: #06080C; --accent: #5B97FF; --accent-bg: #0F2347; --naver: #18E07A; --naver-bg: #0B3B24;
    --pink: #FF8DB9; --pink-fg: #2A0614; --red: #FF4646; --yellow: #FFD400; --yellow-fg: #D10000; --nm-k3: #FFE14D; --ok: #46F2A0; --warn-bg: #3D0E10;
    --todo: #2F7BFF; --todo-fg: #FFFFFF; --gift: #FFD400; --gift-fg: #1C1400; --walk: #3D8BFF; --err-bg: #3D0E10; --amber: #FF9F1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-bg: #0C2440; --sky-line: #2D6CB0; --done-bg: #1A1F28;
  --bg: #06080C; --surface: #10141B; --surface-2: #161B24; --fg: #FFFFFF; --muted: #B3BDCC; --faint: #545F70; --line: #252D3A;
  --ink: #FFFFFF; --on-ink: #06080C; --accent: #5B97FF; --accent-bg: #0F2347; --naver: #18E07A; --naver-bg: #0B3B24;
  --pink: #FF8DB9; --pink-fg: #2A0614; --red: #FF4646; --yellow: #FFD400; --yellow-fg: #D10000; --nm-k3: #FFE14D; --ok: #46F2A0; --warn-bg: #3D0E10;
  --todo: #2F7BFF; --todo-fg: #FFFFFF; --gift: #FFD400; --gift-fg: #1C1400; --walk: #3D8BFF; --err-bg: #3D0E10; --amber: #FF9F1A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 12px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.4; overflow: hidden; }
/* POS 화면 1024×768 을 그대로 그리고, 창 크기에 맞춰 통째로 줄이거나 키움 (칸 배치는 절대 바뀌지 않음) */
#stage { position: absolute; top: 0; left: 0; width: 1024px; height: 768px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100%; padding: 8px 16px; display: grid; gap: 8px; grid-template-rows: auto minmax(0, 1fr); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-weight: 600; min-height: 36px; }
.btn:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn-ink:hover { background: var(--ink); opacity: .9; }
.btn-sm { padding: 2px 9px; min-height: 28px; font-size: 12.5px; border-radius: 7px; }

/* 위 막대 */
.top { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.top .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
.top .brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: none; cursor: pointer; border-radius: 8px; padding: 2px 4px; margin-left: -4px; }
.top .brand:hover { background: var(--surface-2); }
.top .tag { font-size: 11.5px; color: var(--muted); }
.captable { width: 100%; border-collapse: collapse; font-size: 14px; }
.captable th, .captable td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; }
.captable th { font-size: 12px; color: var(--muted); font-weight: 600; }
.captable tr.adj td { background: var(--accent-bg); }
.captable small { color: var(--muted); font-size: 11px; }
.captable .up { color: var(--ok); font-size: 12px; } .captable .down { color: var(--red); font-size: 12px; } .captable td.over { color: var(--red); font-weight: 700; }
.caplog { display: grid; gap: 2px; font-size: 12.5px; max-height: 150px; overflow: auto; } .caplog .bad { color: var(--red); }
.top .posgo { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; padding: 4px 9px; }
.top .capforce { display: inline-flex; align-items: center; gap: 5px; flex: none; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 6px 2px 4px; font-size: 11px; line-height: 1.15; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.top .capforce input { width: 17px; height: 17px; margin: 0; accent-color: var(--todo); cursor: pointer; }
.top .capforce.on { border-color: var(--todo); color: var(--fg); background: var(--accent-bg); }
.top .capforce.auto, .top .capforce.off { cursor: default; }
.top .capforce.off { opacity: .55; }
.top .spacer { flex: 1; }
.top .now { font-size: 22px; font-weight: 700; border: 0; background: transparent; padding: 0; color: var(--fg); cursor: default; } /* 시계 = 관리자 숨은 입구 (두 번 누르기) */
.top .manualbtn { color: var(--accent); border-color: var(--accent); }
.top .rgrp { display: flex; align-items: center; gap: 4px; } /* 오른쪽 묶음은 촘촘히 — 가운데 커튼 손잡이에 안 가리게 */
.top .rgrp .sold { padding: 2px 6px; }
.top .rgrp .sold b { font-size: 17px; }
.top .sold { font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: var(--fg); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 2px 8px; cursor: pointer; } /* 바탕화면 · 총 판매수 (글씨 줄임 · 커튼 손잡이에 안 가리게 · 10/9) */
.top .sold:hover { border-color: var(--accent); }
.soldlist { max-height: 420px; overflow: auto; display: grid; gap: 4px; margin: 6px 0; }
.soldlist .srow { display: grid; grid-template-columns: minmax(0, 1fr) 118px 112px 40px 92px; gap: 8px; align-items: center; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14.5px; cursor: pointer; }
.soldlist.bykey .srow { grid-template-columns: minmax(0, 1fr) 118px 150px 40px; } /* 열쇠 번호로 찾기: 날짜까지 · 삭제 버튼 없음 */
.soldlist .srow:hover { outline: 1.5px solid var(--line); }
.soldlist .srow.out { opacity: .5; text-decoration: line-through; }
.soldlist .srow.out button { text-decoration: none; }
.soldlist .sk { font-weight: 700; }
.soldlist .sk .kcur { background: var(--yellow); color: #2b2100; border-radius: 5px; padding: 0 5px; } /* 그 열쇠를 지금 쓰는 · 마지막에 쓴 사람 (사장님 10/21) */
.soldlist .sk .kold { color: var(--muted); font-weight: 600; } /* 그 앞에 같은 열쇠를 쓴 사람 */
.soldlist .sk small, .reckeys small { color: #E8A33D; font-weight: 700; margin-left: 4px; font-size: 11.5px; } /* 일괄 반납 = 열쇠를 하나씩 확인하지 않음 */
.soldnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.soldnav select { min-height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 14px; padding: 0 8px; }
.reccard dd.phone { font-size: 22px; font-weight: 800; }
.top .btn { white-space: nowrap; flex-shrink: 0; }
.top .sold b { font-size: 19px; color: var(--accent); }

/* 세 칸 */
.cols { display: grid; gap: 8px; grid-template-columns: 222px 244px minmax(0, 1fr); height: 100%; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
.panel h2 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.panel h2 small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.panel { height: 100%; }
/* 가운데 칸: 위에 새로고침 버튼, 그 아래로 예약자 명단 상자를 내림 */
.midcol, .leftcol { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; min-width: 0; }
.memoboxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 4px; }
.mbox { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 38px; padding: 0 4px; border-radius: 9px; border: 1px solid var(--ink); background: var(--surface); color: var(--fg); font-size: 13.5px; font-weight: 700; cursor: pointer; }
.mbox .mname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbox.adm { border-color: var(--accent); color: var(--accent); }
.mbox .mcnt { position: absolute; top: -7px; right: -5px; min-width: 18px; height: 18px; line-height: 15px; box-sizing: border-box; border-radius: 9px; padding: 0 4px; font-size: 11px; font-weight: 800; text-align: center; border: 1.5px solid var(--todo); color: var(--todo); }
.mbox .mcnt { background: var(--bg); }
.mbox .mcnt.new { background: var(--todo); color: var(--todo-fg); }
.refresh { min-height: 38px; width: 100%; font-size: 14px; border-color: var(--ink); color: var(--ink); background: var(--surface); } /* 테두리 · 글씨 흰색 */
.refresh small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.scroll { min-height: 0; display: grid; gap: 5px; align-content: start; overflow: auto; flex: 1; }

/* 왼쪽: 날짜 · 시간표 */
.datebar { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; align-items: center; gap: 4px; }
.datebar button.arrow { height: 34px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 16px; font-weight: 700; }
.datebar .d { text-align: center; font-weight: 700; font-size: 14px; line-height: 1.15; }
.datebar .d small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
/* 시간 · 확정 · 잔여 세 칸 */
.slot-head { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 2px; font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 4px; text-align: center; }
.slot { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); align-items: center; gap: 2px; width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 4px; border-radius: 9px; text-align: left; }
.slot .t { border: 1.5px solid transparent; border-radius: 8px; text-align: center; font-weight: 800; padding: 2px 0; background: transparent; }
.slot-sum { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px 4px 5px; margin: 2px 4px 2px; border-bottom: 3px double var(--line); text-align: center; font-weight: 800; font-size: 15px; }
.slot-sum .lb { font-size: 12.5px; border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 0; }
.slot-sum .dn { color: var(--muted); }
.slot .c { text-align: center; font-weight: 700; font-size: 15px; }
.slot.unl { position: relative; }
.slot.unl::before { content: ""; position: absolute; left: 4px; right: 4px; top: -2px; height: 2px; border-radius: 1px; background: var(--red); pointer-events: none; } /* 17:30 과 18:00 사이: 18:00부터 무제한 */
.slot .c.full, .slot-sum .full { color: var(--red); }
.slot .c.dn { color: var(--muted); }
.slot .c.cf, .slot-sum .cf { color: #3ddc6b; } /* 확정 = 예전 커튼 손잡이 연두색 (사장님 10/7) */
.slot .c.lf, .slot-sum .lf { color: var(--fg); }
.slot.now .t { border-color: var(--accent); color: var(--accent); }
.slot.on { background: var(--accent-bg); border-color: var(--ink); } /* 고른 시간 줄: 테두리 흰색 · 배경 그대로 (사장님 10/8) */
.slot.on .t { background: var(--ink); color: var(--on-ink); border-color: var(--ink); } /* 시간 칸: 흰 바탕 · 검정 글씨 */
.slot:hover { background: var(--surface-2); }
.slot.on:hover { background: var(--accent-bg); }

/* 가운데: 예약자 명단 */
.res { border: 1px solid var(--sky-line); border-radius: 10px; padding: 7px 9px; display: grid; gap: 3px; background: var(--sky-bg); }  /* 미입장: 하늘색 */
.res.done { background: var(--done-bg); border-color: var(--line); }  /* 입장완료(이용완료): 회색 */
.badge.conf { background: var(--surface); }
.res { cursor: pointer; }
.res:hover { border-color: var(--accent); }
.res .go { font-size: 12.5px; font-weight: 700; color: var(--accent); }
/* 예약자 팝업의 열쇠 고르기: 15칸 × 3줄 */
.kpick { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
.kpick button { aspect-ratio: 1; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700; padding: 0; }
.kpick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.kpick button[disabled] { border-color: var(--line); background: var(--surface-2); color: var(--faint); opacity: .45; cursor: default; font-weight: 500; }
.sheet.wide { width: min(620px, 100%); }
/* 운영 설정 V2.0 (사장님 10/21): 왼쪽 메뉴 7개 · 오른쪽만 내려 봄 · 긴 설명은 [?] */
.sheet.setsheet { width: min(1000px, 100%); height: min(740px, 100%); grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.setwrap { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 14px; min-height: 0; }
.setnav { display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); padding-right: 10px; overflow: auto; }
.setnav button { display: grid; gap: 1px; text-align: left; min-height: 48px; padding: 6px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 600; }
.setnav button small { font-size: 11px; font-weight: 500; color: var(--faint); }
.setnav button:hover { background: var(--surface-2); color: var(--fg); }
.setnav button.on { background: var(--accent-bg); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.setnav button.on small { color: var(--muted); }
.setbody { overflow: auto; min-height: 0; display: grid; gap: 12px; align-content: start; padding: 0 4px 12px 0; }
.setbody .evgrid { grid-template-columns: minmax(0, 1fr) 300px; }
.setbody .evgrid > :nth-child(3) { grid-column: 2; grid-row: 1 / span 2; }
.setbody .psub { max-width: 420px; }
.setcard { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; }
.setcard.plain { border-color: var(--line); }
.setcard.stack { display: grid; gap: 10px; }
.setcard .svswitch { margin-left: 0; }
.skv > .help { white-space: nowrap; }
.setsheet h3 > .help, .mansheet h3 > .help { margin: 0 auto 0 10px; }
.skv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: 13px; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
.qhelp { justify-self: start; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 12px; min-width: 24px; height: 24px; padding: 0 7px; font-size: 12px; font-weight: 700; margin-left: 4px; vertical-align: middle; }
.qhelp[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.qtext[hidden] { display: none; }
.qtext { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; line-height: 1.5; background: var(--surface-2); border-radius: 8px; padding: 6px 9px; margin-top: 4px; }
.stafflist { display: grid; gap: 6px; max-width: 460px; }
.staffrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.seg2.sm button { min-height: 30px; font-size: 13px; }
/* 근무자 메뉴얼 (V2.0) — 내려 보며 읽기 · 그림 = 체험판 화면 (apps/desk/tools/manual-shots.js) */
.sheet.mansheet { width: min(980px, 100%); height: min(740px, 100%); grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
.mannav { display: flex; gap: 6px; flex-wrap: wrap; }
.mannav button { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 16px; min-height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.manbody { overflow: auto; min-height: 0; display: grid; gap: 22px; align-content: start; padding: 2px 6px 24px 0; }
.mansec { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; padding-top: 14px; border-top: 1px solid var(--line); }
.mansec.full { grid-template-columns: minmax(0, 1fr); }

  // ── 네이버 불러오기 (설치한 앱) ─────────────────────
  const naverSlots = {}; // 날짜 → 시각(분) → { cap, conf, done } (입장권 상품 합계)
  const capDemo = {}; // 체험판: 시각 → 회차당 수량 (네이버 대신 · 수량 자동 조절)
  const naverRaw = {}; // 날짜 → 네이버 칸 그대로 [{ time, product, cap, conf, done }] (수량 자동 조절이 상품 칸을 고를 때)
  let naverBusy = false;
  let naverErr = "";
  let naverStep = ""; // 네이버에서 지금 하는 단계 (불러오는 동안 버튼에 보임)
  if (APP && window.desk.naver.onStep) window.desk.naver.onStep((m) => { naverStep = m; if (naverBusy) $("refresh-at").textContent = refreshText(); }); // 마지막 불러오기가 실패한 까닭 (다음에 성공할 때까지 버튼에 보임)
  // ── 네이버 톡톡 상담 (키즈 · 카페) ─────────────────
  /* 같은 네이버 아이디로 톡톡 파트너센터 상담 목록을 뒤에 열어 두고, 목록 줄마다 붙는 붉은 원(손님이 보낸 안 읽은 말풍선 수)을 더해 버튼에 붉은 원으로.

     왼쪽 메뉴 '상담관리 111' · '안읽은 메시지 111개' 숫자는 쓰지 않음 (상담완료를 잘 안 눌러 쌓인 수 · 사장님 10/8) */
  const TALK_NAME = { kids: "키즈상담", cafe: "카페상담" };
  const TALK_API = window.desk && window.desk.talk;

  }
  let naverNext = null; // 불러오는 중에 다른 날짜를 부탁받으면 끝난 뒤 이어서 (날짜를 바꿔도 따라가게)
  /** 네이버에서 불러오기. only = "14:00" 이면 그 시간 칸만 (근무자가 시간 칸을 누를 때), 없으면 하루 전체 (새로고침 · 자동) */
  async function loadNaver(day, loud, only) {
    if (!APP) return;

    const sl = {};

    naverSlots[day] = sl;

    else naverRaw[day] = (naverRaw[day] || []).filter((x) => x.time !== only).concat(r.slots.filter((x) => x.time === only).map((x) => Object.assign({}, x)));

      const done = n.status === "완료";

  // 네이버에 아직 이용완료를 못 누른 예약(연속예약의 뒤 예약 · '네이버 없이 등록')을 차례로 처리, 실패하면 2분마다 다시

  /* 오늘의 열쇠 · 입장 기록은 이 PC에 저장 → 프로그램을 껐다 켜도 · 컴퓨터를 다시 켜도 · 재설치해도 그대로 (현장 10/6)

  /* 열쇠 기록: 그 손님이 받은 열쇠 번호는 반납해도 남김(keysTaken) — 다음날 아침 없는 열쇠를 마지막에 누가 썼는지 찾아 연락 (사장님 10/8)

  const noteKeys = (h) => { if (h.keys && h.keys.length) h.keysTaken = [...new Set([...(h.keysTaken || []), ...h.keys])]; };

  }

  // ── 연속예약 ─────────────────────────────────────

     열쇠는 첫 예약 수량만큼, 열쇠마다 이어지는 타임 수만큼 이용시간: 1타임 1:50 · 2타임 3:50 · 3타임 5:50 (n × 2시간 − 10분)
       예) 12:00 3장 + 14:00 2장 → 열쇠 2개 3시간 50분, 1개 1시간 50분. 무제한 시간이 끼면 무제한
     간격이 2시간이 아니게 이어 잡은 예약(11:30 · 14:00 등)은 '시간 어긋남'으로 따로 표시 — 근무자가 시간 조정 · 나갔다 다시 입장을 안내
     방문 횟수(마일리지)는 네이버와 같이 예약 건수로 셈 — 연속예약도 예약마다 1회 */
  const CHAIN_STEP = RULES.useMinutes + 10; // 120분
  const samePerson = (b) => (bookings[b.day] || []).filter((x) => x.name === b.name && digits(x.phone) === digits(b.phone) && x.phone).sort((x, y) => x.slot - y.slot);
  /** 이 예약 전 네이버 '완료' 수 — 같은 사람이 오늘 이미 따로 입장(이용완료)했는데 네이버를 다시 불러오기 전이면 '완료 n'이 옛 숫자 → 그만큼 올림 (10/15) */
  const doneSoFar = (b) => { let m = b.prevDone; if (m == null) return m; for (const x of samePerson(b)) if (x !== b && x.status === "완료") { const e = x.visitEnd || x.visitNo; if (e != null && e > m) m = e; } return m; };
  const liftDone = (x) => { if (x.status === "완료") return; const m = doneSoFar(x); if (m != null && m > x.prevDone) x.prevDone = m; };
  /* 같은 사람(이름 + 전화번호)이 같은 시간에 예약을 나눠 한 것 (1장 + 1장 등) → 한 번에 입장 · 네이버도 모두 이용완료 (사용자 지시 10/7)
     첫 카드(예약번호 순) = 대표, 열쇠는 합친 장수만큼 대표에게 */
  const partyOf = (b) => (b && b.phone ? samePerson(b).filter((x) => x.slot === b.slot).sort((x, y) => String(x.no || x.id).localeCompare(String(y.no || y.id))) : [b]);
  const slotQty = (b) => partyOf(b).reduce((a, x) => a + x.qty, 0);
  /** 입장할 때 같이 처리할 같은 시간 예약 (아직 입장 전인 것) · 대표 = 그중 첫 번째 */
  const partyOpen = (b) => partyOf(b).filter((x) => x.status === "확정");
  const partyNeed = (b) => partyOpen(b).reduce((a, x) => a + x.qty, 0) || b.qty;
  function chainOf(b) {
    if (!b || !b.phone) return [b];
    let group = [];
    for (const x of samePerson(b)) {
      const last = group[group.length - 1];
      if (last && x.slot === last.slot) { if (x === b) return [b]; continue; } // 같은 시간 나눠 한 예약은 대표 하나로 (함께 처리)
      // 이미 입장한(이용완료) 예약 뒤에 새로 생긴 예약(확정)은 묶지 않음 — '추가 예약' 알림에서 처리하거나 따로 입장 (10/7 충돌 검토)
      if (last && last.status === "완료" && x.status === "확정" && !x.chainHead) { if (group.includes(b)) break; group = [x]; continue; }
      // 2시간 이내 간격(겹쳐도)이면 이어서 씀, 2시간보다 길면 연속이용 아님
      if (last && x.slot > last.slot && x.slot - last.slot <= CHAIN_STEP && slotQty(x) <= slotQty(last)) group.push(x); // 뒤 타임에 사람이 늘면 거기서 끊음 (늘어난 사람은 따로 입장)
      else { if (group.includes(b)) break; group = [x]; }
    }
    return group.includes(b) ? group : [b];
  }
  /** 이어 잡았는데 2시간 간격이 아닌 앞뒤 예약 (1~4시간 사이) → { other, gap: 분(+ 비어요 · − 겹쳐요) } */
  function oddNext(b) {
    if (!b || !b.phone) return [];
    return samePerson(b).filter((x) => x !== b && Math.abs(x.slot - b.slot) > CHAIN_STEP && Math.abs(x.slot - b.slot) <= 240)
      .map((x) => { const [p, n] = x.slot < b.slot ? [x, b] : [b, x]; return { other: x, gap: n.slot - (p.slot + RULES.useMinutes) }; });
  }
  /** 연속예약 열쇠별 이용시간(분): 열쇠 j 번째는 앞에서부터 수량이 j 이상인 타임까지 이어짐. 무제한이 끼면 null */
  function chainKeyMinutes(chain, qty) {
    const out = [];
    for (let j = 1; j <= qty; j++) {
      let n = 0;
      for (const x of chain) { if (slotQty(x) >= j) n++; else break; }
      const part = chain.slice(0, n);
      // 끝 = 이어지는 마지막 예약 시간 + 1시간 50분 (2시간보다 짧은 간격이면 그만큼 짧아짐)
      out.push(part.some((x) => minutesFor(x.day, x.slot) == null) ? null : part[part.length - 1].slot - part[0].slot + RULES.useMinutes);
    }
    return out;
  }
  /** 묶음 전체 이용시간(가장 긴 열쇠 기준, 분). 무제한이 끼면 null */
  function chainMinutes(chain) {
    const ms = chainKeyMinutes(chain, chain[0].qty);
    return ms.includes(null) ? null : Math.max(...ms);
  }
  /** 연속예약 열쇠 안내: "2개 3시간 50분(15:50) · 1개 1시간 50분(13:50)" */
  function keyPlan(ch, qty) {
    const ms = chainKeyMinutes(ch, qty), cnt = new Map();
    for (const m of ms) cnt.set(m, (cnt.get(m) || 0) + 1);
    return [...cnt.entries()].sort((a, b) => (b[0] ?? 1e9) - (a[0] ?? 1e9)).map(([m, n]) => `${n}개 ${m == null ? "무제한" : `${dur(m)}(${hm(ch[0].slot + m)})`}`).join(" · ");
  }
  const dur = (m) => `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}`;
  /** 열쇠를 가진 손님의 이용시간(분, 예약 시간부터). 연속예약이면 입장 때 열쇠마다 정해 둔 값, 무제한이면 null */
  const useOf = (h, k) => {
    if (golden) return null; // 골든벨: 지금 안에 있는 손님도 모두 무제한
    if (h.keyUse && k != null && h.keyUse[k] !== undefined) return h.keyUse[k];
    if (h.keyUse && k == null) { const v = h.keys.map((x) => h.keyUse[x]).filter((x) => x !== undefined); if (v.length) return v.includes(null) ? null : Math.min(...v); }
    return h.useMin !== undefined ? h.useMin : minutesFor(TODAY, h.slot);
  };

  // ── 입금대기 예약 자동 취소 (사장님 10/8) ─────────────────────
  let unpaidBusy = false;
  const unpaidLog = (() => { try { return JSON.parse(localStorage.getItem("astanakiz-unpaid-" + TODAY)) || []; } catch (e) { return []; } })();
  /** 지금 취소 대상: 오늘 · 확정 · 입금대기 · 아직 입장 안 함 · 지금 타임 ~ 2시간 뒤 */
  const unpaidDue = () => (bookings[TODAY] || []).filter((b) => b.status === "확정" && b.unpaid && b.enteredAt == null && b.slot >= Math.floor(now / 30) * 30 && b.slot <= now + RULES.unpaidCancel.within);
  async function unpaidSweep() {
    if (!APP || !RULES.unpaidCancel.on || unpaidBusy || !window.desk.naver.cancel) return;
    const list = unpaidDue();
    if (!list.length) return;
    unpaidBusy = true;
    try {
      for (const b of list) {
        const r = await window.desk.naver.cancel({ day: b.day, time: hm(b.naverSlot ?? b.slot), product: b.naverProduct || "", no: b.no, qty: b.qty }).catch((e) => ({ ok: false, why: String(e) }));
        unpaidLog.unshift({ at: hm(now), name: b.name, time: hm(b.slot), qty: b.qty, ok: !!(r && r.ok), why: r && !r.ok ? r.why : "" });
        if (r && r.ok) {
          const arr = bookings[TODAY]; arr.splice(arr.indexOf(b), 1);
          const ns = (naverSlots[TODAY] || {})[b.slot]; if (ns) ns.conf = Math.max(0, ns.conf - b.qty);
          toast(`입금대기 예약 자동 취소: ${b.name} ${hm(b.slot)} ${b.qty}장`);
        } else if (r && r.paid) b.unpaid = false; // 그 사이 결제함 → 대상에서 뺌
        else toast(`입금대기 예약 취소 실패: ${b.name} ${hm(b.slot)} — ${(r && r.why) || "응답 없음"}`);
      }
      unpaidLog.length = Math.min(unpaidLog.length, 40);
      try { localStorage.setItem("astanakiz-unpaid-" + TODAY, JSON.stringify(unpaidLog)); } catch (e) { /* 저장 못 해도 동작 */ }
    } finally { unpaidBusy = false; renderAll(); }
  }

  // ── 추가 예약 (이용 중인 손님이 뒤 타임을 또 예약 · 사장님 10/7) ─────────────────────
  /* 네이버를 불러올 때마다(매시 20 · 50분 + 새로고침) 열쇠를 가진 손님과 같은 사람(이름 + 전화번호, 현장손님은 전화번호)의
     아직 입장 안 한 뒤 타임 예약을 찾음. L = 지금 열쇠가 덮는 마지막 예약 타임(반납 시각 − 1시간 50분)
     - 딱 2시간 뒤(L + 2:00)        → 열쇠 반납 시각을 자동 연장 + 알림 → [확인] 하면 네이버 이용완료
     - 2시간보다 가까움(1:30 이하)   → 알림: '그 예약 시간부터 1시간 50분' / '처음부터 이어서(L + 3:50, 2타임이면 3시간 50분)' 중 선택 → 네이버 이용완료
     - 2시간 30분 이상 떨어짐        → 알림: '당겨서 이어서(L + 3:50)' + 이용완료 / '그대로 두기'(이용완료 안 함 · 따로 입장)
     - 이미 지금 반납 시각 안        → 알림: [확인] 하면 네이버 이용완료 (다시 켰을 때 등)
     알림은 그 손님 열쇠 창 옆에 띄움 (지금 열쇠 정보와 같이 보고 결정) */
  const extEnd = (h) => { const v = h.keys.map((k) => useOf(h, k)); return v.includes(null) || !v.length ? null : h.slot + Math.max(...v); };
  const samePhone = (a, b) => digits(a.phone) && digits(a.phone) === digits(b.phone);
  function extFor(h) {
    if (!h || h.svc || !h.keys.length) return null; // 서비스 키는 추가 예약을 찾지 않음 (원래 손님 열쇠에서)
    const end = extEnd(h);
    if (end == null) return null; // 무제한 손님
    const L = end - RULES.useMinutes;
    const x = (bookings[TODAY] || []).filter((y) => y.status === "확정" && !y.chainHead && y.enteredAt == null && !extIgnored.has(y.no) && y.slot > h.slot && samePhone(y, h) && (h.walk || y.name === h.name))
      .sort((p, q) => p.slot - q.slot)[0];
    if (!x) return null;
    const d = x.slot - L;
    const type = x.extAuto ? "auto" : d <= 0 ? "covered" : d === 2 * 60 ? "auto" : d < 2 * 60 ? "short" : "far";
    const xm = minutesFor(TODAY, x.slot);
    return { h, x, L, end, d, type, endBooking: xm == null ? null : x.slot + RULES.useMinutes, endChain: xm == null ? null : L + 2 * 60 + RULES.useMinutes };
  }
  /** 열쇠 반납 시각을 newEnd 로 (예약 인원만큼의 열쇠 · 늘리기만) */
  function extApply(e, newEnd) {
    const { h, x } = e;
    h.keyUse = h.keyUse || Object.fromEntries(h.keys.map((k) => [k, useOf(h, k)]));
    for (const k of h.keys.slice(0, Math.max(1, x.qty))) {
      const cur = useOf(h, k);
      if (newEnd == null) h.keyUse[k] = null;
      else if (cur != null && h.slot + cur < newEnd) h.keyUse[k] = newEnd - h.slot;
    }
  }
  function extComplete(e) {
    const { h, x } = e;
    liftDone(x);
    Object.assign(x, { status: "완료", enteredAt: now, chainHead: h.id, naverPending: APP, visitNo: x.prevDone == null ? null : x.prevDone + 1 });
    const nsl = (naverSlots[x.day] || {})[x.slot]; if (nsl) { nsl.conf = Math.max(0, nsl.conf - x.qty); nsl.done += x.qty; }
    if (APP) setTimeout(naverFlush, 0);
  }
  /* 추가 예약이 10번째 (사장님 10/20): 이용 중인 손님의 뒤 타임 예약을 이용완료하면 마일리지 10 · 20 …번째가 되는지
     → 알림에 '사은권을 드려야 해요 · 손님은 이용 중 — 연락해 전달' · 확인하면 그 예약에 giftDue (전달하면 giftGiven 시각) — [사은권 전달함]까지 열쇠 창 · 카드에 남고 반납 전에 물음 (열쇠판 칸 표시는 10/21 사장님 말씀으로 뺌) */
  const extGift = (e) => { const x = e.x; if (!x || x.prevDone == null || evFrozen(x)) return 0; const n = doneSoFar(x) + 1 - evSub(x); return isGift(n) ? n : 0; };
  const extGiftHtml = (e) => { const n = extGift(e); return n ? `<div class="banner giftwarn"><b>이 예약을 이용완료하면 ${n}번째 예약완료 — ${RULES.giftName}을 드려야 해요</b><br>손님은 이용 중 — <b class="num">${fmtPhone(e.x.phone || e.h.phone)}</b> 로 연락해 전달하세요</div>` : ""; };
  /** 이 열쇠 손님이 아직 못 받은 사은권 (본인 · 함께 이용완료한 추가 예약) */
  const giftPend = (h) => (h ? (bookings[TODAY] || []).filter((x) => x.giftDue && !x.giftGiven && (x === h || x.chainHead === h.id)) : []);
  const giftDueHtml = (h) => giftPend(h).map((x) => `<div class="banner giftdue"><span><b>사은권 전달 전</b> — ${x.giftDue}번째 예약완료 ${RULES.giftName} · <b class="num">${fmtPhone(x.phone)}</b> <span class="help">(손님께 연락해 전달)</span></span><button class="btn btn-sm btn-ink" data-act="giftGiven" data-no="${esc(x.no)}">사은권 전달함</button></div>`).join("");
  /** 반납 · 일괄 반납 전에: 사은권을 못 받은 손님이 있으면 물음 — [확인] = 드렸음(전달함으로 남김) · [취소] = 반납 안 함 */
  function giftAsk(hs) {
    const p = hs.flatMap(giftPend);
    if (!p.length) return true;
    if (!confirm(`${p.map((x) => `${x.name}님 ${x.giftDue}번째 예약완료 ${RULES.giftName}을 아직 전달하지 않았어요.`).join("\n")}\n\n지금 드렸으면 [확인] — 전달함으로 남기고 반납\n아직이면 [취소] — 반납하지 않고 돌아가요 (먼저 드리세요)`)) return false;
    for (const x of p) x.giftGiven = hm(now);
    saveState();
    return true;
  }
  const extSeen = new Set(); // 이번에 알린 예약번호 (같은 걸 계속 띄우지 않게)
  /** 네이버를 불러온 뒤: 추가 예약 찾기 → 딱 2시간이면 자동 연장 → 알림 (다른 창이 열려 있으면 닫힐 때) */
  function extScan() {
    const found = holders().map(extFor).filter(Boolean);
    for (const e of found) if (e.type === "auto" && !e.x.extAuto) { extApply(e, e.endBooking); e.x.extAuto = true; saveState(); }
    const fresh = found.filter((e) => !extSeen.has(e.x.no));
    fresh.forEach((e) => extSeen.add(e.x.no));
    if (fresh.length) { toast(`추가 예약 ${fresh.length}건 — ${fresh.map((e) => `${e.h.walk ? walkTag(e.h) : e.h.name} 열쇠 ${e.h.keys.join(",")}번`).join(" · ")}`); extShowNext(); }
    renderAll();
  }
  function extShowNext() {
    if (sheet.mode) return; // 다른 창이 끝나면 (closeSheet 에서 다시)
    const e = holders().map(extFor).filter(Boolean)[0];
    if (e && extSeen.has(e.x.no)) openSheet({ mode: "key", hid: e.h.id });
  }

  // ── 열쇠 계산 ─────────────────────────────────────
  const holders = () => bookings[TODAY].concat(walkins, svcKeys).filter((x) => x.keys.length);
  const holderOf = (k) => holders().find((x) => x.keys.includes(k));
  const freeKeys = () => { const out = []; for (let k = 1; k <= RULES.keys; k++) if (!holderOf(k)) out.push(k); return out; };
  /* 열쇠 색: 예약한 입장시간(현장은 입장 시각)부터
     ~ 1시간 50분 검정 · 1시간 50분 ~ 2시간 분홍 · 2시간 넘으면 빨강. 무제한 손님은 계속 검정 */
  function keyColor(h, k) {
    const m = useOf(h, k);
    if (m == null) return "in";
    const used = now - h.slot;
    return used < m ? "in" : used < m + (RULES.pinkUntil - RULES.useMinutes) ? "pink" : "red";
  }
  /* 현장 판매 가능 열쇠: 지금부터 1시간 50분 동안 5분마다
     (안에 있는 손님 열쇠 + 그때 와 있을 네이버 예약 열쇠)를 뺀 값의 가장 작은 값.
     base = 기본 40개 안, all = 유동 5개까지 */
  function projection() {
    let worst = Infinity;
    for (let x = now; x <= now + RULES.useMinutes; x += 5) {
      let used = 0;
      for (const h of holders()) for (const k of h.keys) { const m = useOf(h, k); if (m == null || h.slot + m > x || x < now + 10) used++; }
      for (const b of bookings[TODAY]) {
        if (b.status !== "확정") continue;
        const m = baseMinutes(TODAY, b.slot); // 아직 안 온 예약은 골든벨이어도 원래 시간 안에만 올 수 있다고 (안 온 지난 예약이 계속 자리를 막지 않게)
        if (b.slot - RULES.earlyMinutes <= x && (m == null || x < b.slot + m)) used += b.qty;
      }
      worst = Math.min(worst, RULES.keys - used);
    }
    const free = freeKeys().length;
    return { base: Math.max(0, Math.min(worst - (RULES.keys - RULES.baseKeys), free)), all: Math.max(0, Math.min(worst, free)) };
  }

  // ── 그리기 ───────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const findB = (id) => Object.values(bookings).flat().find((b) => b.id === id);

  /** 시간 칸마다 네이버 완료 · 확정(미입장) · 잔여 — 왼쪽 표 · 폰 실시간 현황이 같이 씀
      잔여 = 기준치 − 확정 − 완료. 기준치는 네이버 칸의 판매 수량(예약가능+확정+이용완료)이라 현장 설정에 따라 10이 아닐 수 있음 */
  function slotStats(day) {
    ensureDay(day);
    const list = bookings[day];
    return SLOTS.map((s) => {
      const bs = list.filter((b) => b.slot === s);
      const ns = (naverSlots[day] || {})[s];
      const sum = (st) => bs.filter((b) => b.status === st).reduce((a, b) => a + b.qty, 0);
      const done = ns ? ns.done : sum("완료");
      const conf = ns ? ns.conf : sum("확정");
      const cap = ns ? ns.cap : day === TODAY && capDemo[s] != null ? capDemo[s] : RULES.slotCap;
      return { s, done, conf, cap, left: Math.max(0, cap - conf - done) };
    });
  }
  function renderSlots() {
    ensureDay(viewDay);
    $("date").innerHTML = `${dateLabel(viewDay)}<small>${dayKind(viewDay)}</small>`;
    const tot = { done: 0, conf: 0, left: 0 };
    $("slots").innerHTML = slotStats(viewDay).map(({ s, done, conf, cap, left }) => {
      tot.done += done; tot.conf += conf; tot.left += left;
      const isNow = viewDay === TODAY && now >= s - RULES.earlyMinutes && now < s + 25;
      const unl = timedDay(viewDay) && s === toMin(RULES.unlimitedFrom); // 이 줄부터 무제한 → 위에 빨간 선 (사장님 10/9)
      return `<button class="slot ${s === selSlot ? "on" : ""} ${isNow ? "now" : ""} ${unl ? "unl" : ""}" data-act="slot" data-s="${s}" aria-pressed="${s === selSlot}"${unl ? ` title="${RULES.unlimitedFrom}부터 무제한"` : ""}>
        <span class="t num">${hm(s)}</span>
        <span class="c num dn">${done}</span><span class="c num ${conf ? "cf" : "lf"}">${conf}</span><span class="c num ${left ? "lf" : "full"}" title="기준 ${cap}">${left}</span></button>`;
    }).join("");
    renderSold(tot.done);
    $("slot-sum").innerHTML = `<span class="lb">${viewDay === TODAY ? "오늘 합" : "이날 합"}</span><span class="dn">${tot.done}</span><span class="${tot.conf ? "cf" : "lf"}">${tot.conf}</span><span class="${tot.left ? "lf" : "full"}">${tot.left}</span>`;
  }

  /** 네이버 '완료 n'에서 이번 방문 회차: 미입장이면 완료 n → 이번 n+1번째, 이용완료면 n+1번째 방문 */
  /* 근무자 화면은 실제 회차(11번째), 영수증은 10회 단위로 다시 셈(11회차 → 1번째).
     10·20·30…번째 방문이면 사은권 증정 */
  const stampOf = (n) => ((n - 1) % RULES.giftEvery) + 1;
  const isGift = (n) => n > 0 && n % RULES.giftEvery === 0;
  /* 카드 문구 (사용자 지시 10/7 — '방문' 대신 네이버 기준 '예약 이용완료'로, 손님과 다툼이 없게):
     이용완료한 예약 = "N번째 예약완료" · 아직 입장 전 = "완료 8 · 취소 2 → 9번 완료 예정" (네이버 예약 1건 = 1번, 장수와 무관) */
  /* 방문 이벤트(10/15): 기간 중에는 마일리지가 멈춤 → "완료 8 · 마일리지 8 멈춤" + 이벤트 안내 · 사은권 표시 없음
     끝난 뒤(또 지난 이벤트가 있으면) 마일리지 = 네이버 완료 − 이벤트 기간 이용완료
     → 원래 모양 그대로 '완료 (마일리지) → n번 완료 예정' + 작게 '(네이버 완료 11 − 이벤트 6)' (사장님 10/19: 네이버 11 · 12번째가 아니라 완료 5 · 6번째) */
  function visitText(b) {
    if (b.status === "완료" ? !b.visitNo : b.prevDone == null) return `<span class="help">이용완료 횟수 확인 중</span>`;
    const c = b.cancels ? ` · 취소 ${b.cancels}` : "", done = b.status === "완료";
    if (!done) liftDone(b); // 같은 사람이 오늘 이미 따로 입장했으면 '완료 n'을 그만큼 (네이버를 다시 불러오면 같아짐)
    /* 재방문 이벤트 기간 (사장님 10/16): 카드에는 네이버 이용완료 횟수 · 마일리지 · 사은권을 안 보임 (장부에는 이름 · 전화 · 완료 수를 계속 셈)
       처음 오는 손님(또는 기한이 지나 다시 시작) = "이벤트 시작" · 기한 안에 다시 온 손님 = 옅은 황토색 네모 "{사은품} 쿠폰 지급하세요"
       자세한 것(다음 기한 · 오늘 이미 방문)은 글자에 마우스를 올리면 */
    if (evActive() && evIn(b.day)) {
      if (evEarly(b)) return `<span class="help">이벤트 켜기 전 입장</span>`;
      const ev = evOf(b);
      if (!ev) return `<span class="help">이용완료 횟수 확인 중</span>`;
      const tip = esc(evLabel(ev));
      if (ev.st === "성공") return `<span class="evcoupon" title="${tip}">${esc(EV.gift || "사은품")} 쿠폰 지급하세요</span>`;
      return `<span class="evstart" title="${tip}">${ev.same ? "오늘 이미 방문" : "이벤트 시작"}</span>`;
    }
    const sub = evSub(b);
    if (done && evWas(b)) return `<b>${b.visitNo}번째 예약완료</b> · 이벤트 기간 방문 <span class="help">(마일리지 ${(b.visitEnd || b.visitNo) - sub})</span>`; // 마일리지에 안 들어간 방문
    /* 같은 날 여러 건 (사장님 10/20: '완료 8' 손님이 같은 시간 1장 + 1장 → 함께 입장하면 10번째인데 입장 전 카드에 사은권 표시가 없었음)
       입장 전: 그날 이 손님 예약 중 먼저 이용완료될 미입장 예약까지 셈 — 대표 카드는 함께 처리하는 묶음 전체 '9 · 10번' · 입장 뒤 대표 카드도 '9 · 10번째' */
    const P = done ? null : planOf(b);
    const n = (done ? b.visitNo : P.n) - sub, last = (done ? b.visitEnd || b.visitNo : P.n + P.group - 1) - sub;
    let g = 0;
    for (let k = n; k <= last && !g; k++) if (isGift(k)) g = k;
    const gift = g ? ` <span class="gift">${RULES.giftName} 증정</span>` : "";
    const nums = last <= n ? `${n}` : last === n + 1 ? `${n} · ${last}` : `${n} ~ ${last}`;
    return done ? `<b>${nums}번째 예약완료</b>${gift}${sub ? ` <span class="help">(네이버 ${b.visitNo} − 이벤트 ${sub})</span>` : ""}`
      : `완료 ${b.prevDone - sub}${c} → <b>${nums}번 완료 예정</b>${last > n ? ` · 함께 ${last - n + 1}건` : ""}${gift}${P.sep ? ` <span class="help">(오늘 앞 예약 ${P.sep}건 포함)</span>` : ""}${sub ? ` <span class="help">(네이버 완료 ${b.prevDone} − 이벤트 ${sub})</span>` : ""}`;
  }
  /** 이 카드(대표)에서 입장하면 함께 이용완료되는 미입장 예약 — 입장 처리(doEnter)와 같은 순서: 같은 시간 나눈 예약 → 연속예약 뒤 타임 (사람이 늘면 거기서 끊음) */
  function entryGroup(b) {
    const out = partyOpen(b).slice(), ch = chainOf(b);
    if (ch.length > 1 && ch[0] === b) {
      let prevQty = partyNeed(b);
      for (const y of ch.slice(1)) { if (y.status !== "확정") continue; if (slotQty(y) > prevQty) break; prevQty = slotQty(y); out.push(...partyOpen(y)); }
    }
    return out;
  }
  /** 미입장 예약의 이번 회차 = '완료 n' + 1 + 그날 이 손님 예약 중 먼저 이용완료될 미입장 예약 수 (시간 → 예약번호 순 = 입장 처리 순서)
      → { n, group(대표 카드면 함께 처리하는 건수, 아니면 1), sep(따로 입장할 앞 예약 수 — 오늘 그 시간 1시간 50분이 다 지나도록 안 온 예약은 안 셈) } */
  function planOf(b) {
    const order = samePerson(b).slice().sort((x, y) => x.slot - y.slot || String(x.no || x.id).localeCompare(String(y.no || y.id)));
    let h = b;
    if (partyOpen(h).indexOf(h) > 0) h = partyOpen(h)[0];
    const hc = chainOf(h);
    if (hc.indexOf(h) > 0 && hc[0].status === "확정") h = hc[0];
    const hg = entryGroup(h), grp = hg.includes(b) ? hg : [b];
    let ahead = 0, sep = 0;
    for (const x of order) {
      if (x === b) break;
      if (x.status !== "확정") continue;
      if (grp.includes(x)) { ahead++; continue; }
      if (x.day === TODAY && x.slot + RULES.useMinutes <= now) continue; // 그 시간이 다 지나도록 안 옴
      ahead++; sep++;
    }
    return { n: b.prevDone + 1 + ahead, group: h === b ? grp.length : 1, sep };
  }
  /** 이번 입장으로 함께 이용완료되는 예약들 중 사은권 회차가 있는지 (예: 8 → 같은 시간 2건이면 9, 10) — 마일리지 기준(이벤트 기간 이용완료는 뺌) · 이벤트 기간엔 없음 */
  const giftIn = (h) => { if (!h.visitNo || evFrozen(h)) return 0; const s = evSub(h), a = h.visitNo - s, z = (h.visitEnd || h.visitNo) - s; for (let n = Math.max(1, a); n <= z; n++) if (isGift(n)) return n; return 0; };
  /** 대리예약: 예약자 정보와 함께 방문자 이름 · 전화번호도 (네이버 '방문자' 줄 "박소희(010-2785-4295)") */
  /** 예약 수량: 2장 이상이면 숫자만 노랑 네모 · 빨강 글씨 (열쇠를 여러 개 줘야 함 · 사장님 10/9 빨강 글씨 → 10/16 노랑 네모) */
  const qtyNum = (q) => (q >= 2 ? `<b class="qmany num">${q}</b>` : String(q));
  function visitorRow(b) {
    if (!b.visitor) return "";
    const m = /^(.*?)\s*\(([\d-]+)\)\s*$/.exec(b.visitor);
    return `<dt>방문자</dt><dd class="num visitor">${esc(m ? m[1] : b.visitor)}${m ? ` ${fmtPhone(m[2])}` : ""}</dd>`;
  }
  function renderRes() {
    // 미입장 카드를 위에 이름 가나다순, 입장 완료(이용완료) 카드는 밑으로 내려 다시 가나다순 (사장님 10/8)
    const list = bookings[viewDay].filter((b) => b.slot === selSlot).sort((a, b) => (a.status === "완료") - (b.status === "완료") || a.name.localeCompare(b.name, "ko") || String(a.no || a.id).localeCompare(String(b.no || b.id)));
    const q = list.reduce((a, b) => a + b.qty, 0);
    $("res-title").textContent = `${hm(selSlot)} 예약자`;
    $("res-sub").textContent = `${list.length}명 · 수량 ${q}`;
    const isToday = viewDay === TODAY;
    $("res").innerHTML = list.length ? list.map((b) => {
      const d = new Date(b.day + "T12:00:00");
      const when = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.(${DOW[d.getDay()]}) ${hm(b.slot)}`;
      let act = "";
      const ch = chainOf(b), ci = ch.indexOf(b);
      const odd = oddNext(b);
      const oddTag = odd.length ? `<div class="chain bad num">⚠ 연속이용 아님 ${[b, ...odd.map((o) => o.other)].sort((x, y) => x.slot - y.slot).map((x) => hm(x.slot)).join(" · ")} — ${odd.map((o) => (o.gap > 0 ? `${o.gap}분 비어요` : `${-o.gap}분 겹쳐요`)).join(", ")}</div>` : "";
      const chainTag = oddTag + (ch.length < 2 ? "" : ci === 0 ? `<div class="chain">★${ch.length}타임 연속예약 <span class="num">${ch.map((x) => hm(x.slot)).join(" · ")}</span></div>` : `<div class="chain sub num">연속예약 ${ci + 1}/${ch.length} · 첫 예약 ${hm(ch[0].slot)}</div>`);
      const pty = partyOf(b), ptyOpen = partyOpen(b);
      const partyTag = pty.length > 1 ? `<div class="chain">같은 시간 예약 ${pty.indexOf(b) + 1}/${pty.length} · 함께 입장</div>` : "";
      if (b.status === "확정" && ptyOpen.indexOf(b) > 0) act = `<span class="help num">같은 시간 첫 카드에서 함께 입장 처리</span>`;
      else if (b.status === "확정" && ci > 0) act = `<span class="help num">첫 예약(${hm(ch[0].slot)})에서 함께 입장 처리</span>`;
      else if (b.status === "확정") {
        if (!isToday) act = `<span class="help">이용일에 입장 처리</span>`;
        else act = `<span class="go">눌러서 입장 · 열쇠 지급 ›</span>${now < b.slot - RULES.earlyMinutes ? `<span class="help num">안내 ${hm(b.slot - RULES.earlyMinutes)} · 일찍 입장 가능</span>` : ""}`;
      } else if (b.keys.length) act = `<span class="kchips">${b.keys.map((k) => `<span class="kchip num">${k}</span>`).join("")}</span><span class="help num">${hm(b.enteredAt)} 입장</span>`;
      else if (b.outAt != null) act = `<span class="help num">${hm(b.enteredAt)} 입장 · ${hm(b.outAt)} 퇴장</span>`;
      else if (b.chainHead) act = `<span class="help num">연속예약 — ${hm(b.enteredAt)} 첫 예약으로 입장</span>`;
      if (b.giftDue) act += b.giftGiven ? `<span class="help num">${RULES.giftName} ${b.giftGiven} 전달</span>` : `<span class="npend">${b.giftDue}번째 ${RULES.giftName} 전달 전 — 손님께 연락해 전달 (열쇠 창 [사은권 전달함])</span>`;
      if (b.naverPending) act += `<span class="npend">${b.naverBusy ? "네이버 이용완료 처리 중…" : `네이버 이용완료 대기${b.naverWhy ? ` — ${esc(b.naverWhy)}` : ""} (자동으로 다시)`}</span>`;
      return `<article class="res ${b.status === "완료" ? "done" : ""}" data-act="openRes" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)} 예약 열기">
        <div class="head"><span class="name">${nameHtml(b)}${b.proxy ? ` <span class="badge proxy">대리예약</span>` : ""}${noteOf(b) && noteOf(b).m ? ` <span class="badge memo" title="${esc(noteOf(b).m)}">메모</span>` : ""}</span>${b.unpaid && b.status === "확정" ? `<span class="badge unpaid">입금대기</span>` : `<span class="badge ${b.status === "완료" ? "done" : "conf"}">${b.status === "완료" ? "이용완료" : "미입장"}</span>`}</div>
        ${partyTag}${chainTag}<div class="visits num">${visitText(b)}</div>
        <dl class="kv">
          <dt>전화번호</dt><dd class="phone num">${fmtPhone(b.phone)}</dd>${visitorRow(b)}
          <dt>이용일시</dt><dd class="num">${when}${b.naverSlot != null && b.naverSlot !== b.slot ? ` <span class="moved">네이버 ${hm(b.naverSlot)}</span>` : ""}</dd>
          <dt>수량</dt><dd>${b.product} ${qtyNum(b.qty)}</dd>
          <dt>결제상태</dt><dd><span class="badge paid">${b.pay}</span></dd>
        </dl>
        <div class="act">${act}</div>
      </article>`;
    }).join("") : `<div class="empty">이 시간 예약이 없어요</div>`;
  }

    const discs = {};

    const parked = (c) => { const m = now - ((c.at.slice(0, 10) === TODAY ? 0 : -1440) + toMin(c.at.slice(11, 16))); return `${Math.floor(m / 60)}시간 ${m % 60}분`; };
    const state = () => {
      const c = LOT.find((x) => x.id === sel);
      return {
        needLogin: false,
        rows: rows.map((x) => ({ id: x.id, no: x.no, count: (discs[x.id] || []).length, at: x.at })),
        detail: c ? { no: c.no, at: c.at, parked: parked(c) } : { no: "", at: "", parked: "" },
        history: c ? (discs[c.id] || []).slice() : [],

    return {
      search(day, no) { rows = LOT.filter((c) => c.no.includes(no) && c.at.slice(0, 10) >= day); sel = null; return ok(); },
      select(id) { sel = id; return ok(); },
      discount(t) { (discs[sel] = discs[sel] || []).unshift({ type: t, by: "astana(근무자)", at: `${TODAY} ${hm(now)}:00` }); return ok({ dialog: `${t}을(를) 등록하시겠습니까?` }); },
      remove(i) { (discs[sel] || []).splice(i, 1); return ok({ dialog: "삭제하시겠습니까?" }); },

  })();
  const amanoApi = REAL ? window.desk.amano : demoAmano;
  const park = { state: null, sel: null, busy: false, err: false, msg: "차량번호를 넣고 검색하면 아마노 화면에도 같은 값이 들어가요" };
  /* 할인 등록은 뒤에서 (네이버 이용완료처럼): 누르면 바로 '등록 중'으로 보이고 근무자는 다음 차를 검색함.
     실제 등록은 설치 앱의 숨은 아마노 창이 차례대로 하고, 실패하면 아래 줄에 빨갛게 남김 (꺼졌다 켜져도 이어서) */
  const PJ_KEY = "astana.parkJobs";
  park.jobs = (() => { try { return (JSON.parse(localStorage.getItem(PJ_KEY)) || []).map((j) => Object.assign(j, { run: false })); } catch (e) { return []; } })();
  park.q = null; // 마지막 검색 { day, no }
  function saveJobs() { try { localStorage.setItem(PJ_KEY, JSON.stringify(park.jobs)); } catch (e) {} }
  let parkJobBusy = false;
  async function parkFlush() {
    if (parkJobBusy) return;
    const j = park.jobs.find((x) => !x.why);
    if (!j) return;
    parkJobBusy = true; j.run = true; renderCars();
    let r;
    try { r = REAL ? await window.desk.amano.job(j) : await demoJob(j); } catch (e) { r = { ok: false, why: String(e && e.message || e) }; }
    parkJobBusy = false; j.run = false;
    if (r && r.ok) {
      park.jobs.splice(park.jobs.indexOf(j), 1);
      toast(`${j.carNo} ${j.type} 등록됨`);
      const row = park.state && park.state.rows.find((x) => x.id === j.id);
      if (row) row.count = (row.count || 0) + 1;
      // 그 차를 보고 있으면 할인내역을 새로 읽음
      if (park.sel === j.id && !park.busy) parkRun(`${j.carNo} 할인내역 새로 읽기`, () => amanoApi.select(j.id));
    } else j.why = (r && r.why) || "아마노 화면이 응답하지 않음";
    saveJobs(); renderCars();
    setTimeout(parkFlush, 0);
  }
  // 체험판: 뒤 창 대신 1.5초 걸리는 척
  async function demoJob(j) {
    await new Promise((res) => setTimeout(res, 1500));
    const keep = park.sel;
    await demoAmano.select(j.id);
    const r = await demoAmano.discount(j.type);
    await demoAmano.select(keep);

  }
  async function parkRun(msg, fn) {
    if (park.busy) return;
    park.busy = true; park.err = false; park.msg = msg + " …"; renderCars();
    let r;
    try { r = await fn(); } catch (e) { r = { ok: false, why: String(e && e.message || e) }; }
    park.busy = false;
    if (r && r.state) park.state = r.state;
    park.err = !r || !r.ok;
    park.msg = r && r.ok ? `${msg} → 완료${r.dialog ? ` (확인 창 '${r.dialog}' 자동 확인)` : ""}` : (r && r.why) || "아마노 화면이 응답하지 않음";

  function renderCars() {
    const st = park.state;
    const dis = park.busy ? "disabled" : "";
    $("cars").innerHTML = !st ? `<div class="empty">입차일은 새벽 손님 때문에 전날부터 찾아요</div>`

      : st.rows.length ? st.rows.map((c) => `<button class="car ${park.sel === c.id ? "on" : ""}" data-act="car" data-id="${esc(c.id)}" aria-pressed="${park.sel === c.id}" ${dis}>

    const wait = d ? park.jobs.filter((j) => j.id === park.sel).map((j) => `<div><span class="num">${esc(j.type)} · ${j.why ? `<b style="color:var(--red)">등록 실패</b>` : "등록 중…"}</span><span></span></div>`).join("") : "";
    $("pcar").innerHTML = !d ? `<div class="empty">조회 목록에서 차량을 고르면 할인유형이 나와요</div>` : `
      <div class="no num">${esc(d.detail.no)}</div>
      <div class="tm num"><span>입차 ${esc(d.detail.at.slice(5, 16))}</span><b>${esc(d.detail.parked)}</b></div>
      <div class="dbtns">${DISC.map(btn).join("")}</div>
      <div class="dlist">${wait}${d.history.length ? d.history.map((h, i) => `<div><span class="num">${esc(h.type)} · ${esc(String(h.at).slice(11, 16))}</span>${h.canDelete === false ? `<span class="help">${esc(h.note || "삭제 불가")}</span>` : `<button data-act="discDel" data-i="${i}" aria-label="할인 삭제" ${dis}>삭제</button>`}</div>`).join("") : wait ? "" : `<span class="help">할인내역 없음</span>`}</div>`;
    const bad = park.jobs.filter((j) => j.why), going = park.jobs.length - bad.length;
    $("synclog").innerHTML = bad.length
      ? `<b class="errline">⚠ 할인 등록 실패 ${bad.map((j) => `${esc(j.carNo)} ${esc(j.type)}`).join(", ")} — ${esc(bad[0].why)}</b> <button class="btn btn-sm" data-act="parkRetry">다시</button> <button class="btn btn-sm" data-act="parkDrop">지우기</button>`
      : `아마노${REAL ? "" : "(체험)"}: ${going ? `<b>뒤에서 할인 등록 중 ${going}건</b> · ` : ""}<b style="color:${park.err ? "var(--red)" : "inherit"}">${esc(park.msg)}</b>`;
  }

  /* 맨 위 '입장권 총 판매수' = 고른 날의 네이버 이용완료 장수(시간표 완료 합) + 현장입장 장수 (현장 10/6)
     현장입장 장수는 열쇠를 받은 개수(qty) — 반납해도 줄지 않음. 다른 날은 그날 저장 파일에서 읽음 */
  const dayFiles = {};
  /** 그날 저장 파일 { b: 입장한 예약, w: 현장입장, x: 통계에서 뺀 예약번호 } — 오늘은 화면의 것, 지난날은 파일에서 한 번만 읽음
      저장 파일은 지우지 않음 (입장권 목록에서 2주 전까지 보고 찾음) */
  function dayFile(day) {
    if (day === TODAY) return { b: [], w: walkins, x: testOut, sa: svExtra, s: svcKeys };
    if (!dayFiles[day]) {
      let f = {};
      try { const t = APP && window.desk.state ? window.desk.state.load(day) : null; if (t) f = JSON.parse(t); } catch (e) { f = {}; }
      dayFiles[day] = { b: f.b || [], w: f.w || [], x: new Set(f.x || []), sa: f.sa && typeof f.sa === "object" ? f.sa : {}, s: Array.isArray(f.s) ? f.s : [] };
    }
    return dayFiles[day];
  }
  const KEEP_DAYS = 14; // 입장권 목록 · 열쇠 찾기: 오늘 포함 2주
  /** 입장권 목록 줄 (네이버 이용완료 + 현장구매) — 열쇠를 가져간 순서, 최근이 위 (사장님 10/8)
      지난날은 저장 파일의 입장 기록(열쇠 · 전화번호)을 먼저, 네이버에서 불러온 예약은 없는 것만 */
  function entryRows(day) {
    const f = dayFile(day), seen = new Set();
    const nb = f.b.concat(bookings[day] || []).filter((b) => b.status === "완료" && b.no && !seen.has(b.no) && seen.add(b.no));
    return nb.map((b) => ({ k: "n", id: b.no, day, name: b.name, phone: b.phone, src: b, keys: b.keysTaken || b.keys || [], at: b.enteredAt != null ? b.enteredAt : b.slot, qty: b.qty, out: f.x.has(b.no) }))
      .concat(f.w.map((w) => ({ k: "w", id: w.id, day, name: w.extra ? `추가 1타임 · ${w.of}` : isEv(w) ? `${walkTag(w)} 입장` : "현장구매자", ev: isEv(w), phone: w.phone, src: w, keys: w.keysTaken || w.keys || [], at: w.enteredAt != null ? w.enteredAt : w.slot, qty: walkQty(w), out: false })))
      .concat((f.s || []).map((x) => ({ k: "s", id: x.id, day, name: svcLabel(x), phone: x.phone, src: x, keys: x.keysTaken || x.keys || [], at: x.enteredAt != null ? x.enteredAt : x.slot, qty: 0, out: false, svc: true })))
      .sort((a, b) => b.at - a.at || a.name.localeCompare(b.name, "ko"));
  }
  const walkQty = (w) => w.qty || Math.max(1, (w.keys || []).length);
  /** 서비스 키 이름: '서비스 키 · 백성욱 3번' / '서비스 키 · 직원 홍길동' */
  const svcLabel = (x) => `서비스 키 · ${x.of ? x.of.label : `직원${x.name && x.name !== "직원" ? " " + x.name : ""}`}`;
  function walkTickets(day) { return dayFile(day).w.filter((w) => !isEv(w)).reduce((a, w) => a + walkQty(w), 0); } // 이벤트 입장은 판매 아님
  const evTickets = (day) => dayFile(day).w.filter(isEv).reduce((a, w) => a + walkQty(w), 0);
  /** 통계에서 뺀(시험으로 잡힌) 네이버 이용완료 장수 */
  const testQty = (day) => { const x = dayFile(day).x; return (bookings[day] || []).filter((b) => x.has(b.no) && b.status === "완료").reduce((a, b) => a + b.qty, 0); };
  function renderSold(naverDoneAll) {
    const naverDone = Math.max(0, naverDoneAll - testQty(viewDay));
    const walk = walkTickets(viewDay), all = naverDone + walk;
    const el = $("sold");
    el.innerHTML = `${viewDay === TODAY ? "" : `${Number(viewDay.slice(5, 7))}/${Number(viewDay.slice(8))} `}총 판매수 = <b class="num">${all}</b>`; // 글씨를 줄임 (사장님 10/9)
    const ev = evTickets(viewDay);
    el.title = `네이버 이용완료 ${naverDone}장 + 현장입장 ${walk}장${ev ? ` (이벤트 입장 ${ev}명은 판매 아님 · 따로)` : ""}`;
  }

  // ── 네이버 판매 수량 자동 조절 ─────────────────────
  /* 어느 시각에도 안에 있는 손님(열쇠 · 좌석)이 상한(43)을 넘지 않게, 목표(42)에 가깝게 — 아직 시작 안 한 앞 3타임의 네이버 '회차당 수량'을 바꿈.
     타임 시작 시각마다 안에 있을 손님 =
       ① 지금 안에 있는 손님(열쇠) 중 그때 아직 안 나간 사람 — 좌석(열쇠) 기준 (사장님 10/9): 일찍 나간 사람 · 시간을 옮겨 들어온 사람 ·
          연장한 사람 모두 실제 반납 시각대로 → 일찍 비운 자리는 바로 앞 타임에 다시 팖 (o.present)
       ② 시작한 타임인데 아직 안 온 예약 — 늦게라도 올 수 있어 끝 시간까지 자리를 잡아 둠 (o.present)
       ③ 아직 안 시작한 타임(1시간 50분 = 4타임 안)의 예약 · 팔릴 수 + 예상 현장
          - 바꿀 타임: 예약 + 더 연 수 (다 팔린다고)
          - 먼 타임: 예상(F)이 열린 수량보다 적으면(비인기) 예상만큼, 아니면(인기) 열린 수량이 다 팔린다고 (o.forecast · 사장님 10/9 — 비인기 몫을 인기 타임에)
            F = 같은 요일(월~금 각각 · 토 · 일 · 공휴일)의 지난주 70% · 최근 3주 평균 10% · 추세 10% · 오늘 예약 속도 10% (capMix)
            과거 같은 요일 실적이 없으면: 지금 열쇠(예약) 수준 90% · 오늘 추세(예약 속도로 늘린 수) 10% (사장님 10/9 — 무조건 다 팔린다고 보지 않음)
     - 한 장씩 줄 때 예상이 큰(인기) 타임 먼저 · 한 타임 최대 max · 이미 예약된 것보다 적게는 안 함 (자리가 없으면 예약 수로 닫음)
     - 그래도 상한을 넘는 시각이 있으면: 더 연 수 → 먼 타임의 안 팔린 수량 순서로 줄임
     - 10분마다 다시 계산 (반납 · 새 예약 · 예상이 바뀌면 바로 따라감)
     o.present 가 없으면(계산 시험 · 예전 방식) 시작한 타임은 예약 + 현장이 4타임 동안 있다고 봄 */
  function planCaps(slots, adj, o) {
    const K = 4, n = slots.length, idx = new Map(slots.map((x, i) => [x.t, i]));
    const add = new Map(adj.map((t) => [idx.get(t), 0]).filter(([i]) => i != null));
    const cut = new Map(); // 먼 타임을 줄인 수 (상한을 넘는 시각이 있을 때만)
    const farCap = (j) => slots[j].cap - (cut.get(j) || 0);
    const ew = (x) => (x.expWalk != null ? x.expWalk : o.walkAvg || 0);
    // 먼 타임이 팔릴 장수(그 타임 입장권 전부): 열린 수량까지 · 예상이 있으면 예상까지 (이미 팔린 것보다 적게는 안 봄)
    const farSold = (j) => {
      const x = slots[j], open = x.used - x.mainUsed + Math.max(farCap(j), x.mainUsed);
      const f = x.fc !== undefined ? x.fc : x.demand; // fc = 과거 같은 요일 실적이 있을 때만 (없으면 null → 열린 수량 다)
      return o.forecast && f != null ? Math.max(x.used, Math.min(open, Math.ceil(f - 1e-9))) : open;
    };
    const occ = (j) => {
      const x = slots[j];
      if (x.started) return o.present ? 0 : x.used + x.walk; // 좌석 기준이면 ① ② 로 셈
      if (add.has(j)) return x.used + add.get(j) + x.walk + ew(x);
      return farSold(j) + x.walk + ew(x);
    };
    const P = (T) => (o.present || []).reduce((a, p) => a + (p.from <= T && T < p.to ? p.n : 0), 0);
    const at = (k) => { let v = P(slots[k].t); for (let j = Math.max(0, k - K + 1); j <= k; j++) v += occ(j); return v; }; // 타임 k 시작 때 안에 있을 손님
    const live = (k) => !o.present || !slots[k].started; // 이미 지난 시각은 볼 필요 없음
    const room = (i) => { let r = Infinity; for (let k = i; k < Math.min(n, i + K); k++) if (live(k)) r = Math.min(r, o.target - at(k)); return r; };
    for (let guard = 0; guard < 300; guard++) {
      let best = null, bv = -1;
      for (const [i, x] of add) {
        if (slots[i].mainUsed + x >= o.max || room(i) < 1) continue;
        const d = slots[i].demand != null ? slots[i].demand : slots[i].used;
        const v = (1 + d) / (x + 1);
        if (v > bv) { bv = v; best = i; }
      }
      if (best == null) break;
      add.set(best, add.get(best) + 1);
    }
    // 마지막 안전장치: 그래도 상한을 넘는 시각이 있으면 그 4타임의 아직 안 팔린 수량을 줄임 — 바꿀 타임 먼저, 그다음 먼 타임
    const ceil = o.ceiling != null ? o.ceiling : o.target;
    for (let k = 0; k < n; k++) {
      if (!live(k)) continue;
      for (let guard = 0; guard < 100 && at(k) > ceil + 1e-9; guard++) {
        const js = []; for (let j = Math.max(0, k - K + 1); j <= k; j++) js.push(j);
        const a = js.find((j) => add.has(j) && add.get(j) > 0);
        if (a != null) { add.set(a, add.get(a) - 1); continue; }
        const f = js.filter((j) => !slots[j].started && !add.has(j) && farSold(j) > slots[j].used).sort((p, q) => (farSold(q) - slots[q].used) - (farSold(p) - slots[p].used))[0];
        if (f == null) break; // 이미 팔린 것(예약 · 안에 있는 손님)만으로 넘음 → 더 줄일 게 없음
        const x = slots[f];
        cut.set(f, x.cap - (farSold(f) - (x.used - x.mainUsed) - 1)); // 팔릴 수가 한 장 줄도록 열린 수량을 낮춤
      }
    }
    const worst = (t) => { const i = idx.get(t); let m = -Infinity; for (let k = i; k < Math.min(n, i + K); k++) if (live(k)) m = Math.max(m, at(k)); return Math.round(m === -Infinity ? at(i) : m); }; // 이 타임 손님이 있는 동안 가장 많을 때
    const out = [...add].map(([i, x]) => ({ t: slots[i].t, product: slots[i].product, from: slots[i].cap, to: slots[i].mainUsed + x, used: slots[i].used, walk: slots[i].walk, open: x, demand: slots[i].demand, worst: worst(slots[i].t) }));
    for (const [i, c] of cut) out.push({ t: slots[i].t, product: slots[i].product, from: slots[i].cap, to: slots[i].cap - c, used: slots[i].used, walk: slots[i].walk, open: slots[i].cap - c - slots[i].mainUsed, far: true, worst: worst(slots[i].t) });
    out.sort((p, q) => p.t - q.t);

  /* 예약 속도 · 과거 실제 수: 이 PC에 저장

  const capDayClass = (day) => (peakOf(day) ? "성수기" : "비수기") + (isHoliday(day) ? "휴일" : "평일");
  const capStore = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };

  /** 같은 요일 종류 (사장님 10/9 — 같은 요일 · 평일/공휴일 구분): 월~금 각각 · 토 · 일 · 평일에 낀 공휴일 */

  /** 예상 (사장님 10/9): 지난주 70% · 최근 3주 평균 10% · 추세 10% · 오늘(실시간) 10% — 없는 것은 빼고 남은 비율로 나눔

  /** 과거 같은 요일 실적이 없을 때 예상 (사장님 10/9): 지금 열쇠(예약) 수준 90% · 오늘 추세 10% */

  /** 예상 판매(그 타임 입장권 전부) · 예상 현장: capMix (과거가 없으면 capNoHist · 현장은 오늘 추세) */

  /** 수량조절 계획에 쓰는 이용시간(분): 시간제는 원래대로 · 체크한 평일(손님은 그대로 무제한)은 18:00 전 입장을 1시간 50분 머문다고 봄 */

  /** 오늘 시간제 타임마다 { t, used(네이버 확정+완료 · 입장권 전부), mainUsed(조절할 상품), cap(조절할 상품의 회차당 수량), walk(현장), started } */

      const used = Math.max(0, (ns ? ns.conf + ns.done : list.filter((b) => b.slot === t && (b.status === "확정" || b.status === "완료")).reduce((a, b) => a + b.qty, 0)) - (day === TODAY ? out : 0));

  }
  /** 네이버에 넣을 회차당 수량 (사장님 10/9): 고객에게 보이는 잔여(회차당 수량 − 예약)는 10장을 넘지 않게 — 안내 '최대 10팀'과 맞게.
      목표 P(최대 13)를 한 번에 열지 않고 예약 b 가 늘수록 천천히: b + ⌈10 × (P − b) ÷ P⌉ (P 13: 10 → 예약 2명 11(잔여 9) → 6명 12 → 12명 13)

    const out = [];

  /** 지금 계획: { skip } 또는 { slots, adj, plan, changes, walkAvg, win } */
  function capPlan() {
    const A = RULES.capAuto;
    // 가동하는 날: 성수기(평일 · 휴일) · 비수기 주말 · 휴일 = 시간제인 날. 비수기 평일은 제외 (사용자 지시 10/6) — 근무자가 [오늘 수량조절]을 체크한 날만 (10/21)
    if (!capDay()) return { skip: "오늘은 비수기 평일(무제한)이라 조절하지 않아요 — 사람이 몰리면 맨 위 [오늘 수량조절]을 체크 (오늘만)" };
    const slots = capSlots(TODAY);
    const cur = Math.floor(now / 30) * 30;
    // 영업 전(새벽 · 아침)이면 그날 첫 타임들을 (현장 10/7: 새벽 2시에 눌렀더니 조절할 타임이 없었음)
    const first = slots.find((x) => x.t > now);
    const upTo = first && first.t > cur + 30 ? first.t - 30 + 30 * A.ahead : cur + 30 * A.ahead;
    const adj = slots.filter((x) => x.t > now && x.t <= upTo).map((x) => x.t);

    const list = (bookings[TODAY] || []).filter((b) => (b.status === "확정" || b.status === "완료") && !testOut.has(b.no));
    const sumQ = (f) => list.filter(f).reduce((a, b) => a + b.qty, 0);

  const capTry = { day: shiftDay(TODAY, 7), time: "10:00", n: 11 }; // 한 칸 시험 (기본: 다음 주 같은 요일 10:00)

  /** 한 번 조절: 네이버를 새로 읽고 → 계획 → 바뀌는 타임만 네이버에 넣음 (manual = 근무자가 누름) */

    if (capBusy) return;

  /** 매분: 켜져 있으면 10분마다 (실패 · 바쁨이면 다음 분에 다시) */

  }

  function refreshText() {

    // 뒤에서 하는 네이버 이용완료가 실패한 예약이 있으면 계속 빨간 글로 (성공하면 사라짐)
    const fail = (bookings[TODAY] || []).filter((b) => b.naverPending && b.naverWhy);
    if (fail.length) return `⚠ 네이버 이용완료 실패 ${fail.length}건: ${fail.map((b) => `${b.name} ${hm(b.slot)}`).join(", ")} — 2분마다 다시 · 안 되면 네이버에서 직접`;

    SV.retry = ib && !ib.ok ? { day: TODAY, m: now + 10 } : null;
    svSaveCfg();
    const same = again && prev && prev.ok === SV.last.ok && !!(prev.inbox && prev.inbox.ok) === !!(ib && ib.ok);
    if (!same) toast(r && r.demo ? `체험판: 설문 누적(응답 ${p.answered.total} · 제외 ${p.excluded.total})을 보고 파일로 남기는 흉내${ib ? " · 보고함에도 보내는 흉내" : ""}`
      : `${r && r.ok ? "설문 누적을 보고 파일로 남겼어요" : `설문 보고 파일을 못 썼어요: ${(r && r.why) || "응답 없음"}`}${ib ? (ib.ok ? " · 보고함에 보냄 (보고 앱에 바로 보여요)" : ` · 보고함 실패: ${ib.why} — 10분 뒤 다시`) : " · 보고 열쇠가 없어 보고함에는 안 보냄"}`);
    if (sheet.mode === "settings" && sheet.tab === "etc") renderSheet();
  }
  /** 보낸 숫자 (바뀌었는지 보려고) */
  const svSig = (p) => JSON.stringify([p.options.map((o) => [o.label, o.today, o.total]), p.excluded, p.answered]);
  /** 매일 20:00 (설문 기간 · 보내기 켬 · 그날 아직 안 보냄) — 보낸 뒤 숫자가 바뀌면(늦게 온 손님 · [+]) 10초 안에 그날 파일을 다시 씀 (보고 시스템이 22:45까지 30분마다 가져감) */
  function svTick() {
    if (svBusy || !svOn()) return;
    if (SV.retry && SV.retry.day === TODAY && now >= SV.retry.m && svKey.has) { svSend(false); return; } // 보고함 실패 → 10분 뒤 다시
    if (!SV.send || now < 20 * 60) return;
    if (SV.sentDay !== TODAY) svSend(false);
    else if (sec % 10 === 0 && svSig(svPayload()) !== SV.sentSig) svSend(false);
  }

  // ── 이벤트 입장 수 → 보고 앱 (사장님 10/21) ─────────────────────
  /* 예전: 보고 자료가 POS 의 0원 이벤트 상품(예: '[평일] 한가위 무제한 쿠폰') 판매 수량으로 '이벤트 무료입장'을 셈
     → 이제 현장 [이벤트 입장]은 POS 를 안 거치니 데스크가 그날 이벤트 입장 수를 보냄
     - 매일 20:00 (설문 누적을 보내는 때와 같이 · 설문을 안 하는 기간에도 이것만) 하루 한 번 · 보고 열쇠로 boards/{열쇠}/deskStats/event-{날짜} (astanakiz-event · 손님 정보 없음)
     - 이벤트 손님이 없는 날도 0 으로 · 20:00 뒤 숫자가 바뀌면(늦게 온 이벤트 손님 · 기록 삭제) 10초 안에 다시 · 실패하면 10분 뒤 다시 */
  const EVS = { sentDay: "", sig: "", last: null, retry: null };
  const EVS_APP = () => APP && !!(window.desk && window.desk.eventStat);
  if (APP && window.desk.config) window.desk.config.get().then((c) => { const v = c && c.eventStat; if (v) Object.assign(EVS, { sentDay: String(v.sentDay || ""), sig: String(v.sig || ""), last: v.last || null, retry: v.retry && /^\d{4}-\d{2}-\d{2}$/.test(v.retry.day || "") ? { day: v.retry.day, m: Number(v.retry.m) || 0 } : null }); }).catch(() => {});
  const evsSaveCfg = () => { if (APP && window.desk.config) window.desk.config.set({ eventStat: { sentDay: EVS.sentDay, sig: EVS.sig, last: EVS.last, retry: EVS.retry } }); };
  /** 보낼 글: 그날 이벤트 입장 수(명) · 이벤트 이름별 */
  function evsPayload() {
    const by = new Map();
    for (const w of walkins) if (isEv(w)) by.set(w.ev, (by.get(w.ev) || 0) + walkQty(w));
    return { type: "astanakiz-event", v: 1, day: TODAY, sentAt: `${TODAY} ${hm(now)}`, count: evTickets(TODAY), names: [...by].map(([name, n]) => ({ name: name || "이벤트", n })) };
  }
  const evsSig = (p) => JSON.stringify([p.count, p.names]);
  let evsBusy = false;
  async function evsSend(why) {
    if (evsBusy || !EVS_APP()) return;
    evsBusy = true;
    const p = evsPayload(), at = `${TODAY} ${hm(now)}`;
    const r = await window.desk.eventStat.send({ json: JSON.stringify(p), at }).catch((e) => ({ ok: false, why: String(e) }));
    evsBusy = false;
    EVS.last = { at, ok: !!(r && r.ok), why: (r && r.why) || "", count: p.count, auto: why !== "manual" };
    if (EVS.last.ok) { EVS.sentDay = TODAY; EVS.sig = evsSig(p); EVS.retry = null; } else EVS.retry = { day: TODAY, m: now + 10 };
    evsSaveCfg();
    if (why === "manual") toast(EVS.last.ok ? `이벤트 입장 ${p.count}명을 보고 앱으로 보냈어요` : `이벤트 입장 수를 못 보냈어요: ${EVS.last.why}`);
    else if (!EVS.last.ok) toast(`이벤트 입장 수 보내기 실패: ${EVS.last.why} — 10분 뒤 다시`);
    const el = $("evs-row"); if (el && sheet.mode === "settings" && sheet.tab === "etc") el.innerHTML = evsRow();
  }
  /** 1초마다: 20:00 (보고 열쇠가 있을 때) 그날 아직 안 보냈으면 · 보낸 뒤 숫자가 바뀌면 · 실패했으면 10분 뒤 */
  function evsTick() {
    if (!EVS_APP() || !stateReady || evsBusy || !svKey.has || now < 20 * 60) return;
    if (EVS.retry && EVS.retry.day === TODAY) { if (now >= EVS.retry.m) evsSend("auto"); return; }
    if (EVS.sentDay !== TODAY) { evsSend("auto"); return; }
    if (sec % 10 === 0 && evsSig(evsPayload()) !== EVS.sig) evsSend("change");
  }
  function evsRow() {
    const L = EVS.last, n = evTickets(TODAY);
    const st = !EVS_APP() ? "체험판: 설치한 앱에서 매일 20:00 보고 앱으로 보내요" : !svKey.has ? "보고 열쇠를 넣으면 매일 20:00 보고 앱으로 보내요" : L ? `마지막 ${L.at.slice(0, 10) === TODAY ? "" : L.at.slice(5, 10) + " "}${L.at.slice(11)} ${L.auto ? "자동" : "직접"} ${L.ok ? `보냄 (${L.count}명)` : `실패: ${L.why}`}${EVS.retry && EVS.retry.day === TODAY ? ` — ${hm(EVS.retry.m)} 다시` : ""}` : "아직 안 보냄 — 20:00 에 보내요";
    return `<div class="btns" style="align-items:center"><span class="label">이벤트 입장 수</span><button class="btn btn-sm" data-act="evsSendNow" ${EVS_APP() && svKey.has ? "" : "disabled"}>지금 보내기</button>
      <span class="help num ${L && !L.ok ? "evwarn" : ""}">오늘 ${n}명 · 매일 20:00 (설문과 같이 · 설문이 없어도) · ${esc(st)}</span></div>`;
  }

  // ── 네이버 재고 자동 오픈 (사장님 10/20) ─────────────────────
  /* 매일 오늘 + 30일 날짜를 두 상품(평일 무제한 / 휴일 1시간 50분 · 야간자유) 모두 회차마다 재고 10개로 — 앱 본체(main.js stockTick · naver-stock.js)가
     10:30 → 실패하면 12:00 → 16:00 → 20:20 에 (어느 때든 성공하면 그날 남은 것은 안 함). 1.54: 확인하지 않고 바로 [재고수정] (이미 넣은 날도 10개로)
     데스크는 운영 설정 → 네이버 설정 '매일 재고 열기'에서 켜기 · 끄기 · [확인만 해 보기](그 날짜 '모든 회차' 확인 창까지 가 보고 취소 · 바꾸지 않음) · [지금 한 번 열기] · 결과 */
  const ST = { view: null };
  const ST_APP = () => APP && !!(window.desk && window.desk.stock);
  const stShort = (n) => String(n || "").replace(/\s*입장권$/, "").split(" / ")[0];
  const stMd = (d) => (d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "");
  let stPollAt = 0, stPolling = false, stCfgTimer = 0;
  function stLoad() { if (ST_APP()) window.desk.stock.job().then((v) => { if (v && v.ok) { ST.view = v; stShow(); } }, () => {}); }
  if (ST_APP()) {
    stLoad();
    window.desk.stock.onDone((v) => {
      ST.view = v; stShow();
      const j = v && v.job;
      if (!j) return;
      const opened = j.products.flatMap((p) => p.done.map((d) => `${stShort(p.name)} ${stMd(d)}`));
      if (j.dry) toast(`재고 확인만: ${stPlanText(j)}`, 8000);
      else if (j.ok) toast(opened.length ? `네이버 재고를 열었어요 — ${opened.join(" · ")} (회차마다 ${j.qty}개)` : `네이버 재고 — ${stMd(j.target)}까지 이 PC 가 이미 열었어요`, opened.length ? 8000 : 0);
      else toast(`네이버 재고 열기 실패: ${stWhy(j)}${j.auto ? ` — ${stNext(v) ? stNext(v) + " 다시" : "오늘 남은 때 없음 · [지금 한 번 열기]로"}` : ""}`, 10000);
    });
  }
  const stWhy = (j) => j.why || (j.products.find((p) => p.why) || {}).why || "알 수 없음";
  // 확인만: 열 날마다 [재고수정] → 그 날짜 → '모든 회차' 확인 창까지 가 보고 [취소] (바꾸지 않음)
  const stMissed = (p) => (p.missed && p.missed.length ? ` · 못 연 날 ${stMd(p.missed[0])}${p.missed.length > 1 ? `~${stMd(p.missed[p.missed.length - 1])}` : ""} (직접 확인)` : "");
  const stPlanText = (j) => j.products.map((p) => `${stShort(p.name)} ${p.why ? `못 함(${p.why})` : (p.checked || []).length ? `${p.checked.map(stMd).join(", ")} 재고수정 창까지 됨` : p.plan.length ? `열 날 ${p.plan.map(stMd).join(", ")}` : `할 것 없음 (${stMd(j.target)}까지 엶)`}${p.skipped.length ? ` · 건너뜀 ${p.skipped.map(stMd).join(", ")}` : ""}${stMissed(p)}`).join(" · ");
  /** 그날 다음 기회 (못 했으면) */
  function stNext(v) {
    if (!v || !v.cfg.on || v.doneDay === TODAY) return "";
    const tried = v.tried && v.tried.day === TODAY ? v.tried.slots : [];
    const i = v.times.findIndex((t, k) => !tried.includes(k) && toMin(t) > now);
    return i >= 0 ? v.times[i] : "";
  }
  function stText() {
    if (!ST_APP()) return "체험판: 설치한 앱에서 네이버 예약상품 재고를 매일 열어요";
    const v = ST.view;
    if (!v) return "확인 중…";
    const j = v.job, L = v.last;
    if (j && j.running) return `${j.dry ? "확인 중" : "여는 중"} — ${j.step || "네이버 예약상품"}`;
    const out = [];
    if (v.doneDay === TODAY) out.push(`오늘 끝남 (→ ${stMd(shiftDay(TODAY, v.cfg.ahead))})`);
    if (j && j.dry) out.push(`확인만 ${j.at.slice(11)}: ${stPlanText(j)}`);
    if (L) out.push(`마지막 ${L.at.slice(0, 10) === TODAY ? "" : stMd(L.at.slice(0, 10)) + " "}${L.at.slice(11)} ${L.auto ? "자동" : "직접"} ${L.ok ? `성공${L.products.some((p) => p.done.length) ? ` (${L.products.filter((p) => p.done.length).map((p) => `${stShort(p.name)} ${p.done.map(stMd).join(", ")}`).join(" · ")})` : ` (${stMd(L.target)}까지 이미 엶)`}${L.products.map(stMissed).join("")}` : `실패: ${L.why || (L.products.find((p) => p.why) || {}).why || ""}`}`);
    const nx = stNext(v);

      <button class="btn btn-sm" data-act="stDry" ${run ? "disabled" : ""}>확인만 해 보기</button><button class="btn btn-sm" data-act="stNow" ${run ? "disabled" : ""}>지금 한 번 열기</button></div>
      <span class="help">매일 10:30 (실패하면 12:00 · 16:00 · 20:20) <b>오늘 + ${c.ahead}일</b>을 두 상품 회차마다 <b>${c.qty}개</b>로 (이미 넣은 날도)</span>
      <span class="help ${bad ? "evwarn" : ""}" id="st-text">${esc(stText())}</span>`;
  };
  const stShow = () => { const el = $("st-row"); if (el && sheet.mode === "settings" && sheet.tab === "naver") el.innerHTML = stRow(); };
  /** 1초마다: 여는 중이면 2초쯤마다 진행을 물음 */
  function stTick() {
    if (!ST_APP() || stPolling || !(ST.view && ST.view.job && ST.view.job.running) || Date.now() - stPollAt < 1500) return;
    stPolling = true; stPollAt = Date.now();
    window.desk.stock.job().then((v) => { stPolling = false; if (v && v.ok) { ST.view = v; stShow(); } }, () => { stPolling = false; });
  }

  // ── 근무자 메뉴얼 (V2.0 · 사장님 10/21) ─────────────────────
  /* 맨 위 [근무자 메뉴얼] → 입장 · 퇴장 · 화면 위치별 조작 (내려 보며 읽기)
     그림 = prototype/manual/*.jpg (체험판 화면 · apps/desk/tools/manual-shots.js 로 다시 찍음 · 설치본은 desk.html 옆 manual/)
     MANUAL_MARKS = 그림 1의 번호 자리 (% · 찍을 때 나온 값) */
  const MANUAL_MARKS = [[14.8, 0.6], [38.7, 0], [1, 5.4], [1, 12.4], [23.4, 12.4], [48.7, 9.8], [48.7, 59.5], [48.7, 66.5], [69.3, 0.6]];
  const MANUAL_TOC = [["man1", "① 화면 한눈에"], ["man2", "② 예약 손님 입장"], ["man3", "③ 현장 손님 입장"], ["man4", "④ 퇴장 · 열쇠 반납"], ["man5", "⑤ 마감 · 일괄 반납"], ["man6", "⑥ 주차등록"], ["man7", "⑦ 메모장"], ["man8", "⑧ 이럴 땐"]];
  const manImg = (f, alt) => `<img src="manual/${f}" alt="${alt}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'help',textContent:'(그림을 못 불러옴 — ${alt})'}))">`;
  const manSteps = (rows, tip) => `<div class="mansteps">${rows.map((r, i) => `<div><span class="n">${i + 1}</span><span>${r}</span></div>`).join("")}${tip ? `<div class="tip">${tip}</div>` : ""}</div>`;
  function manualHtml() {

      ["2", "<b>반납안내 커튼</b> — 손잡이를 내리면 손님께 반납 안내를 크게 (아래를 누르면 걷힘)"],
      ["3", "<b>메모 상자</b> — 근무자마다 하나 + 관리자 · 숫자 = 아직 완료 안 한 것 (칠해져 있으면 새 전달)"],
      ["4", "<b>시간표</b> — 시간마다 완료 · 확정 · 잔여 · 시간 줄을 누르면 그 시간 예약자 (네이버에서 다시 불러옴)"],
      ["5", "<b>새로고침 · 예약자</b> — 고른 시간의 네이버 예약 카드 · 파랑 <b>미입장</b> 카드를 눌러 입장"],
      ["6", "<b>열쇠판</b> — 숫자 = 열쇠 번호 · 바탕색 = 이용 시간 · 테두리 = 네이버(흰색) / 현장(파랑) / 서비스(흰 점선)"],
      ["7", "<b>키즈상담 · 카페상담</b> (붉은 숫자 = 새 상담) · <b>열쇠 일괄 반납처리</b> (마감)"],

      <div class="manbody" id="manual-body">

        <section class="mansec full" id="man8"><h4>⑧ 이럴 땐</h4><div class="mansteps">
          <div class="tip"><b>예약이 안 보이면</b> → 가운데 위 <b>[새로고침]</b> 또는 시간표의 그 시간 줄을 누름 (네이버 예약은 09:50부터 매시 20분 · 50분에 자동)</div>
          <div class="tip"><b>빨간 글 · 빨간 상자</b> = 지금 확인할 문제 (초과요금 · 실패) — 그 일을 먼저</div>
          <div class="tip"><b>사은권</b> = 금색 표시 (예약 카드 · 입장 창 · 열쇠 창) → 2만원 사은권을 드리고 <b>[사은권 전달함]</b></div>
          <div class="tip"><b>POS로 갔다 돌아오기</b> → POS를 작업표시줄로 최소화하면 데스크가 앞으로 · 맨 위 [포스 전환]은 결제와 상관없이 POS로</div>
          <div class="tip"><b>더 자세한 것</b> → 인쇄용 직원 메뉴얼 (PDF) · 관리자에게</div>

      </div>`;
  }

  // ── 근무자 메모장 (V2.0 · 사장님 10/21 다시: 사람마다 상자) ─────────────────────
  /* 시간표 위 상자 = 근무자마다 하나 + 관리자 (운영 설정 → 근무자 등록에서 더하면 상자가 늘어남 · 상자 글 = 이름 · 별칭 · 성)
     - 평일 1명 · 주말 2명이 돌아가며 PC 앞 → 날(평일 / 주말)로 나누지 않고 사람마다
     - 상자 숫자 = 아직 완료 안 한 것 (내 메모 + 받은 전달) — 쓴 것이 없어도 받은 전달이 있으면 보임 · 아직 접수 안 한 새 전달이 있으면 칠함
     - 상자 → 그 사람 메모장
       · 받은 전달: [접수](받았어요 · 보낸 사람이 봄) → 할 일을 마치면 [완료] (알리기만 한 것은 바로 [완료])
       · 내 메모: 쓰고 Enter → 할 일 · ☐ = 완료(지난 기록 · 되돌리기) · × 지우기
       · 전달하기: 받을 사람 고르기(여럿 · 관리자 상자는 처음부터 모든 근무자) → 쓰고 Enter
       · 보낸 전달: 사람마다 아직 / 접수 / 완료 (아무도 접수 안 했으면 [회수])
       · 지난 기록(내가 완료한 것) · 전체 전달 기록(모두 같이 봄) · 찾기
     - 앱: 이 PC 앱 폴더 staff-memo.json (staff-memo.js) · 체험판: 이 브라우저 · 클라우드로 안 보냄 */
  const MEMO_LS = "astanakiz-staffmemo", MEMO_ADMIN = "admin";
  const MEMO = { admin: "관리자", staff: [], notes: [], msgs: [] };
  const MEMO_APP = () => APP && !!(window.desk && window.desk.memo);
  let memoTimer = 0;
  /** 읽기: 2번 모양 · 체험판에 남은 1번 모양(평일 ↔ 주말 전달)은 전달로 (받는 사람 = 쓴 사람 빼고 모든 근무자) */
  function memoLoad(v) {
    if (!v || (v.v !== 1 && v.v !== 2)) return;
    MEMO.admin = String(v.admin || "관리자");
    MEMO.staff = (Array.isArray(v.staff) ? v.staff : []).map((s) => ({ id: s.id, name: s.name || "" }));
    MEMO.notes = Array.isArray(v.notes) ? v.notes : [];
    MEMO.msgs = Array.isArray(v.msgs) ? v.msgs : [];
    for (const h of v.v === 1 && Array.isArray(v.hand) ? v.hand : []) {
      const to = MEMO.staff.map((s) => s.id).filter((p) => p !== h.by);
      if (to.length) MEMO.msgs.push({ id: h.id, from: h.by || "", to, text: h.text, at: h.at, st: h.ok ? Object.fromEntries(to.map((p) => [p, { ack: h.ok, done: h.ok }])) : {} });
    }
  }
  if (MEMO_APP()) window.desk.memo.get().then((r) => { if (r && r.ok) { memoLoad(r.memo); renderMemoBoxes(); if (sheet.mode === "memo" || (sheet.mode === "settings" && sheet.tab === "staff")) renderSheet(); } }, () => {});
  else try { memoLoad(JSON.parse(localStorage.getItem(MEMO_LS))); } catch (e) { /* 없음 */ }
  function memoSave() {
    clearTimeout(memoTimer); memoTimer = 0;
    const d = { v: 2, admin: MEMO.admin, staff: MEMO.staff, notes: MEMO.notes, msgs: MEMO.msgs };
    if (MEMO_APP()) window.desk.memo.set(d).then((r) => { if (!(r && r.ok)) toast(`메모 저장 실패: ${(r && r.why) || "응답 없음"}`, 8000); }, (e) => toast(`메모 저장 실패: ${e}`, 8000));
    else try { localStorage.setItem(MEMO_LS, JSON.stringify(d)); } catch (e) { /* 저장 못 해도 화면은 동작 */ }
    renderMemoBoxes();
  }
  const memoSaveSoon = () => { clearTimeout(memoTimer); memoTimer = setTimeout(memoSave, 600); };
  const memoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const memoStamp = () => `${TODAY} ${hm(now)}`;
  /** "2026-10-21 13:40" → 오늘이면 13:40 · 아니면 10/21 13:40 */
  const memoWhen = (at) => (!at ? "" : at.slice(0, 10) === TODAY ? at.slice(11) : `${+at.slice(5, 7)}/${+at.slice(8, 10)} ${at.slice(11)}`);
  /** 상자 차례: 근무자(등록한 차례) → 관리자 */
  const memoPeople = () => MEMO.staff.map((s) => ({ id: s.id, name: s.name || "이름 없음" })).concat([{ id: MEMO_ADMIN, name: MEMO.admin || "관리자", admin: true }]);
  const staffName = (id) => { if (id === MEMO_ADMIN) return MEMO.admin || "관리자"; const x = id && MEMO.staff.find((s) => s.id === id); return x ? x.name || "이름 없음" : id ? "지운 근무자" : ""; };
  const memoSt = (m, p) => (m.st || {})[p] || {};
  const memoMsgDone = (m) => m.to.every((p) => memoSt(m, p).done);
  /** 그 사람이 아직 완료 안 한 것: 내 메모 · 받은 전달 (fresh = 아직 접수 안 한 전달) */
  function memoTodo(id) {
    const notes = MEMO.notes.filter((n) => n.who === id && !n.done);
    const inbox = MEMO.msgs.filter((m) => m.to.includes(id) && !memoSt(m, id).done);
    return { notes, inbox, fresh: inbox.filter((m) => !memoSt(m, id).ack), n: notes.length + inbox.length };
  }
  /** 메인 화면 상자 (화면을 그릴 때마다) */
  function renderMemoBoxes() {
    const el = $("memo-boxes");
    if (!el) return;
    el.innerHTML = memoPeople().map((p) => {
      const o = memoTodo(p.id);
      const tip = `${p.name} 메모장${o.n ? ` — 완료 안 한 것 ${o.n} (내 메모 ${o.notes.length} · 받은 전달 ${o.inbox.length}${o.fresh.length ? ` · 새 전달 ${o.fresh.length}` : ""})` : ""}`;
      return `<button class="mbox ${p.admin ? "adm" : ""}" data-act="memoOpen" data-id="${p.id}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="mname">${esc(p.name)}</span>${o.n ? `<span class="mcnt num ${o.fresh.length ? "new" : ""}">${o.n}</span>` : ""}</button>`;
    }).join("");
  }
  const memoDraft = (k) => esc((sheet.draft || {})[k] || "");
  const memoMark = (t, q) => { const e = esc(t); if (!q) return e; const i = t.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? e : esc(t.slice(0, i)) + `<mark>${esc(t.slice(i, i + q.length))}</mark>` + esc(t.slice(i + q.length)); };
  /** 받는 사람마다 아직 · 접수 · 완료 */
  const memoStatus = (m) => m.to.map((p) => { const x = memoSt(m, p); return `<span class="mst ${x.done ? "done" : x.ack ? "ack" : ""}" title="${esc(staffName(p))} ${x.done ? `${memoWhen(x.done)} 완료` : x.ack ? `${memoWhen(x.ack)} 접수` : "아직 접수 안 함"}">${esc(staffName(p))} ${x.done ? "완료" : x.ack ? "접수" : "아직"}</span>`; }).join("");
  const memoFromTo = (m) => `${esc(staffName(m.from) || "?")} → ${esc(m.to.map(staffName).join(", "))}`;
  function memoInHtml(m, me) {
    const x = memoSt(m, me);
    return `<div class="mitem ${x.ack ? "" : "fresh"} ${m.from === MEMO_ADMIN ? "fromadm" : ""}"><span>${esc(m.text)}<small class="num">${esc(staffName(m.from) || "?")}${m.to.length > 1 ? ` → ${m.to.length}명` : ""} · ${esc(memoWhen(m.at))}${x.ack ? ` · ${esc(memoWhen(x.ack))} 접수` : ""}</small></span>${x.ack ? "" : `<button class="btn btn-sm mack" data-act="memoAck" data-id="${m.id}" title="받았어요 — 보낸 사람이 봐요">접수</button>`}<button class="btn btn-sm mfin" data-act="memoFin" data-id="${m.id}" title="할 일을 마쳤거나 알리기만 한 것 → 지난 기록으로">완료</button></div>`;
  }
  function memoNowHtml() {
    const me = sheet.who, o = memoTodo(me);
    const others = memoPeople().filter((p) => p.id !== me);
    const allOn = others.length > 0 && others.every((p) => sheet.to.includes(p.id));
    const sent = MEMO.msgs.filter((m) => m.from === me && !memoMsgDone(m)).reverse();
    const toNames = sheet.to.map(staffName).join(" · ");
    const inbox = o.inbox.slice().reverse().map((m) => memoInHtml(m, me)).join("") || `<span class="help">없어요</span>`;
    const notes = o.notes.slice().reverse().map((n) => `<div class="mitem"><button class="mchk" data-act="memoDone" data-id="${n.id}" aria-label="완료" title="마쳤으면 눌러요 → 지난 기록"></button><span>${esc(n.text)}<small class="num">${esc(memoWhen(n.at))}</small></span><button class="btn btn-sm" data-act="memoDel" data-id="${n.id}" aria-label="지우기" title="지우기">×</button></div>`).join("") || `<span class="help">할 일이 없어요</span>`;
    const send = others.length ? `<div class="mto" role="group" aria-label="받을 사람">${others.length > 1 ? `<button class="${allOn ? "on" : ""}" aria-pressed="${allOn}" data-act="memoTo" data-id="*">모두</button>` : ""}${others.map((p) => `<button class="${sheet.to.includes(p.id) ? "on" : ""} ${p.admin ? "adm" : ""}" aria-pressed="${sheet.to.includes(p.id)}" data-act="memoTo" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>
        <div class="madd"><input id="memo-msg" class="cfg" maxlength="300" value="${memoDraft("memo-msg")}" placeholder="${toNames ? `${esc(toNames)}에게 — 쓰고 Enter` : "받을 사람을 먼저 고르세요"}" aria-label="전달할 말" autocomplete="off"><button class="btn btn-sm btn-ink" data-act="memoSend">전달</button></div>`
      : `<span class="help">전달할 사람이 없어요 — 관리자가 운영 설정 → 근무자 등록에서 근무자를 넣어요</span>`;
    const sentHtml = sent.map((m) => `<div class="mitem sent"><span>${esc(m.text)}<small class="num">${esc(memoWhen(m.at))} → ${memoStatus(m)}</small></span>${Object.keys(m.st || {}).length ? "" : `<button class="btn btn-sm" data-act="memoRecall" data-id="${m.id}" title="아무도 접수 안 했을 때만 거둘 수 있어요">회수</button>`}</div>`).join("") || `<span class="help">없어요</span>`;
    return `<div class="mnow"><div class="mcol">

  const HV_PAST_FROM = "2026-04-01", HV_EVENT_FROM = "2026-10-26";

  const hvRanges = () => ({ today: TODAY, past: { from: HV_PAST_FROM, to: shiftDay(EV.from || HV_EVENT_FROM, -1) }, event: EV.from ? { from: EV.from, to: EV.to || "" } : null });

  function hvSync() {

  async function hvSend(why) {

    async drawer() {

    extOk() {

    if (t.id === "form-auto") { PRINT.forms[PRINT.cur].auto = t.checked; savePrint(); }

    if (t.id === "unpaid-on") { RULES.unpaidCancel.on = t.checked; if (APP && window.desk.config) window.desk.config.set({ unpaidCancel: { on: t.checked } }); toast(t.checked ? "입금대기 예약 자동 취소를 켰어요" : "입금대기 예약 자동 취소를 껐어요"); }

  // 차량번호 숫자패드: 칸을 누르거나(터치 · 마우스) 커서가 가면 뜨고, 다른 곳을 누르거나 검색하면 닫힘
  (function carPad() {
    const q = $("car-q"), pad = $("carpad");
    // 차량번호 칸 바로 위에 가로로 띄움 (화면 밖으로 안 나가고 · 아래 할인정보를 가리지 않게 · 10/8)
    const open = () => { pad.hidden = false; }; // 주차등록 칸 너비 전체 (가로 6칸)
    const close = () => { pad.hidden = true; };
    q.addEventListener("focus", open);

      q.focus();
    });

    st.style.top = Math.max(0, (window.innerHeight - 768 * k) / 2) + "px";
  }
  window.addEventListener("resize", fit);

  $("car-day").value = shiftDay(TODAY, -1);

    // 자정이 지나 날짜가 바뀌면 새 날로 다시 열기 (열쇠·입장 기록은 날짜별로 저장돼 있음). 팝업을 쓰는 중이면 닫은 뒤

  document.addEventListener("change", (e) => { if (/^cap-(target|max|ceil)$/.test(e.target.id)) renderSheet(); if (e.target.id === "note-m") noteFlush(); }); // 숫자를 다 넣으면 계획 다시
  window.__deskTest = { notes: () => Object.fromEntries(NOTES), evLoadCfg, today: () => TODAY, useDueText, printSecs, PRINT_: () => PRINT, sealOf, withSeal, SEAL, evSample: (i) => evSample(i), sealClear: () => sealCache.clear(), EV_: () => EV, liveSnap, LIVE, svcKeys: () => svcKeys, extScan, extFor: (id) => { const h = holders().find((x) => x.id === id || x.name === id); return h ? extFor(h) : null; }, addBooking: (...a) => { const b = booking(...a); return b.id; }, useOf, holders2: () => holders().map((h) => ({ id: h.id, name: h.name, keys: h.keys.slice(), slot: h.slot, end: extEnd(h) })), planCaps, capPlan, capRun, capLog, capDemo, capMix, capNoHist, capForecast, capVisible, dayType, capPresent, RULES, walkin, setNow: (m) => { now = m; renderAll(); }, keyVals, receiptLines, escposParts, form: () => enterText(), holders: () => holders(), LINE_COLS, receiptDocs, sendPrint, PRINT, renderSheet, sheet, evOf: (b) => evOf(b),
    evLog: (from) => { const L = evLog(from); return { from: L.from, count: L.count, people: Object.fromEntries([...L.people].map(([k, p]) => [k, JSON.parse(JSON.stringify(p))])) }; },
    // 장부에 지난 방문 한 줄 넣기: o = { day, n(네이버 순번, 기본 = 지금 완료 수), base, st("안내" | "성공"), due, from(장부 · 기본 지금 이벤트), no }
    evInject: (name, o = {}) => {

      evAdd(Object.assign({ at: `${d} 10:00`, day: d, no: o.no || "t-" + name + nn + d, k: evKey(b), name, phone: digits(b.phone), prev: nn - 1, n: nn, base: o.base ?? nn - 1 }, st ? { st, due: o.due ?? shiftDay(d, EV.days) } : {}), o.from || EV.from);
      renderAll();
    }, evSub: (name) => evSub(bookings[TODAY].filter((x) => x.name === name).pop()), EV, SV, svCounts, svPayload, svSend };

  // ── 반납안내 커튼 ─────────────────────────────────
  (function curtain() {
    const tab = $("curtain-tab"), cur = $("curtain");
    let drag = null;
    const set = (y, mode) => { cur.classList.remove("anim", "fast"); if (mode) cur.classList.add(mode); cur.style.transform = `translateY(${y})`; };
    const show = () => { cur.setAttribute("aria-hidden", "false"); tab.hidden = true; set("0", "anim"); };
    const hideNow = () => { cur.setAttribute("aria-hidden", "true"); set("-100%"); tab.hidden = false; }; // 아래 손잡이: 바로 사라짐
    const liftFast = () => { cur.setAttribute("aria-hidden", "true"); set("-100%", "fast"); setTimeout(() => (tab.hidden = false), 220); }; // 빨간 별: 위로 빨리 걷힘
    // 위 손잡이를 끌어 내림 (손가락 · 마우스). 그냥 누르기만 해도 내려옴
    tab.addEventListener("pointerdown", (e) => { drag = { y0: e.clientY }; try { tab.setPointerCapture(e.pointerId); } catch (err) { /* 없음 */ } set("-100%"); });
    tab.addEventListener("pointermove", (e) => { if (drag) set(`calc(-100% + ${Math.max(0, e.clientY - drag.y0)}px)`); });
    tab.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const dy = Math.max(0, e.clientY - drag.y0);
      drag = null;
      if (dy > window.innerHeight * 0.2 || dy < 6) show(); else set("-100%", "anim");
    });
    tab.addEventListener("pointercancel", () => { drag = null; set("-100%", "anim"); });
    tab.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") show(); });
    $("curtain-bottom").addEventListener("click", hideNow);
    $("curtain-bottom").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") hideNow(); });
    $("curtain-star").addEventListener("click", liftFast);
  })();

})();
