      <section class="card" aria-labelledby="h-people">
        <h2 id="h-people">오늘 입장 <small>${esc(d.dayKind)}${d.golden ? ` · 골든벨 ${esc(d.golden)}~` : ""}</small></h2>
        <div class="big"><span class="v num">${p.total}<small>장</small></span><span class="note">총 판매수 = 네이버 이용완료 + 현장</span></div>
        <div class="split">
          <div><span>네이버</span><b class="num">${p.naver}</b></div>
          <div><span>현장입장${d.walk.extra ? ` (+1타임 ${d.walk.extra})` : ""}</span><b class="num">${p.walk}</b></div>
          <div><span>재방문성공</span><b class="num">${d.revisit ? `${d.revisit.today}<small>(${d.revisit.total})</small>` : "—"}</b></div>
          <div><span>이벤트</span><b class="num">${d.walk.event || 0}</b></div>
        </div>
        <div class="note">${d.revisit ? `(수) = ${Number(d.revisit.from.slice(5, 7))}월 ${Number(d.revisit.from.slice(8))}일 이후 재방문 누적 · ` : ""}${d.walk.service ? `서비스 키 ${d.walk.service}개는 판매가 아니라 총 판매수에 안 들어가요` : ""}${n.test ? ` · 시험 기록 ${n.test}장 뺌` : ""}</div>
      </section>
      <section class="card" aria-labelledby="h-keys">
        <h2 id="h-keys">열쇠 운용 <small>번호를 누르면 손님 · 전화</small></h2>
        <div class="ksum"><span>사용 <b class="num">${k.used}</b>/${k.total}</span><span>빈 열쇠 <b class="num">${k.free}</b></span><span>현장 판매 가능 <b class="num">${k.walkable}</b>${k.flex ? ` +유동 ${k.flex}` : ""}</span></div>
        <div class="keys">${Array.from({ length: k.total }, (_, i) => {
          const no = i + 1, m = k.map[no];
          if (!m) return `<button class="key num" type="button" disabled aria-label="${no}번 빈 열쇠">${no}</button>`;
          const h = k.holders[m.h];
          return `<button class="key num ${esc(m.c)}${h.kind === "s" ? " svc" : ""}" type="button" data-k="${no}" aria-label="${no}번 ${esc(KIND[h.kind])} ${esc(COLOR[m.c] || "")}">${no}</button>`;
        }).join("")}</div>
        <div class="legend"><span><i></i>빈 열쇠</span><span><i class="in"></i>이용 중</span><span><i class="pink"></i>반납 시간(10분 안)</span><span><i class="red"></i>반납 시간 넘음</span><span><i class="svc"></i>서비스 키</span></div>
      </section>
      <section class="card" aria-labelledby="h-sales">
        <h2 id="h-sales">입장료 매출 <small>${esc(at)} 기준 · ${kind} 단가</small></h2>
        <div class="rows">
          <div class="row"><span>입장권 ${tickets}장 × ${won(price)}</span><b class="num">${won(fee)}</b></div>
          <div class="row"><span>초과요금 결제 ${d.over.count}건</span><b class="num">${won(d.over.paid)}</b></div>
          <div class="row sum"><span>합계</span><b class="num">${won(total)}</b></div>
        </div>
        ${d.over.due ? `<div class="note">아직 받지 않은 초과요금 <span class="owed num">${won(d.over.due)}</span> (반납 전 손님 · 반납할 때 POS 결제)</div>` : ""}
        <div class="note">장수 × 단가로 셈 · 할인 · 무료입장은 하루 마감 보고(POS · 네이버 정산)에서 맞춰져요</div>
      </section>
      <section class="card" aria-labelledby="h-naver">
        <h2 id="h-naver">네이버 예약 <small>오늘 합</small></h2>
        <div class="ntot">
          <div class="dn"><span>완료</span><b class="num">${n.done}</b></div>
          <div class="cf"><span>미입장</span><b class="num">${n.conf}</b></div>
          <div><span>잔여</span><b class="num">${n.left}</b></div>
        </div>
        <div style="overflow-x:auto"><table class="slots num">
          <thead><tr><th>시간</th><th>완료</th><th>미입장</th><th>잔여</th></tr></thead>
          <tbody>${slots.map((x) => `<tr class="${x.t === curSlot ? "now" : ""}"><td>${esc(x.t)}</td><td class="${x.done ? "" : "z"}">${x.done}</td><td class="${x.conf ? "cf" : "z"}">${x.conf}</td><td class="${x.left ? "" : "z"}">${x.left}</td></tr>`).join("")}</tbody>
        </table></div>
        ${n.slots.length > busy.length ? `<button class="more" type="button" id="more">${showAll ? "예약 있는 시간만 보기" : `모든 시간 보기 (${n.slots.length}칸)`}</button>` : ""}
        ${n.products.length > 1 ? `<div class="note">상품별 완료: ${n.products.map((x) => `${esc(x.name)} ${x.done}`).join(" · ")}</div>` : ""}
      </section>
      <div class="demo">미리보기 · 통합데스크 체험판 예시 자료 (손님 이름 · 전화번호는 예시)</div>`;
    const more = $("more"); if (more) more.onclick = () => { showAll = !showAll; render(); };
    for (const b of document.querySelectorAll(".key[data-k]")) b.onclick = () => openKey(Number(b.dataset.k));
  }
  function openKey(no) {
    const m = D.keys.map[no]; if (!m) return;
    const h = D.keys.holders[m.h];
    const chips = h.keys.map((x) => { const mm = D.keys.map[x]; return `<span class="chip num ${mm ? esc(mm.c) : ""}">${x}</span>`; }).join("");
    const ends = [...new Set(h.keys.map((x) => (D.keys.map[x] || {}).end))];
    const endText = ends.map((e) => (e == null ? "무제한" : e)).join(" · ");
    const name = h.kind === "s" ? (h.staff ? `직원 ${h.name}` : h.name) : h.name;
    $("shade").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-nm">
      <div class="hd"><span><span class="nm" id="sh-nm">${esc(name)}</span><span class="kind ${h.kind === "s" ? "s" : ""}">${esc(KIND[h.kind])}</span></span><button class="x" type="button" id="sh-x" aria-label="닫기">×</button></div>
      <div class="phone"><span class="p num">${esc(fmtPhone(h.phone))}</span>${h.phone ? `<a class="call" href="tel:${esc(h.phone)}">전화 걸기</a><button class="copy" type="button" id="sh-copy">번호 복사</button>` : ""}</div>
      <dl class="kv">
        <dt>열쇠</dt><dd><span class="chips">${chips}</span></dd>
        <dt>상태</dt><dd>${esc(COLOR[m.c] || "")}${h.over ? ` · <span class="owed num">초과요금 ${won(h.over)}</span>` : h.paid ? ` · 초과요금 ${won(h.paid)} 결제함` : ""}</dd>
        <dt>입장</dt><dd class="num">${esc(h.in)}${h.kind === "n" ? ` (예약 ${esc(h.slot)})` : h.slot && h.slot !== h.in ? ` (입장 타임 ${esc(h.slot)})` : ""}</dd>
        <dt>반납</dt><dd class="num">${esc(endText)}</dd>
        ${h.kind === "s" ? `<dt>수령인</dt><dd>${esc(h.of || "서비스 키")} <span class="note">판매 아님 · 초과요금 없음</span></dd>` : `<dt>수량</dt><dd>${esc(h.product)} ${h.qty}장</dd>`}
        ${h.visitor ? `<dt>방문자</dt><dd>${esc(h.visitor)} (대리예약)</dd>` : ""}
        ${h.no ? `<dt>예약번호</dt><dd class="num">${esc(h.no)}</dd>` : h.pos ? `<dt>POS 번호</dt><dd class="num">${esc(h.pos)}</dd>` : ""}
      </dl></div>`;
    $("shade").hidden = false;
    $("sh-x").onclick = closeKey; $("sh-x").focus();
    const cp = $("sh-copy");
    if (cp) cp.onclick = () => { const t = fmtPhone(h.phone); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => (cp.textContent = "복사함"), () => { const r = document.createRange(); r.selectNodeContents(document.querySelector(".sheet .p")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }); };
  }
  function closeKey() { $("shade").hidden = true; $("shade").innerHTML = ""; }
  $("shade").addEventListener("click", (e) => { if (e.target === $("shade")) closeKey(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("shade").hidden) closeKey(); });

  // 새로고침: 열 때 · 아래로 당겼다 놓을 때 · [새로고침] — 그때마다 deskLive/now 를 다시 읽음
  let busyLoad = false;
  async function refresh() {
    if (busyLoad) return;
    busyLoad = true;
    $("pull").classList.add("on"); $("pull").innerHTML = `<span><span class="spin"></span>통합데스크 현황을 가져오는 중</span>`;
    try { D = await load(); render(); $("pull").innerHTML = "가져왔어요"; }
    catch (e) { $("pull").innerHTML = "가져오지 못했어요 — 인터넷을 확인하고 다시 당겨 주세요"; }
    setTimeout(() => { $("pull").classList.remove("on"); busyLoad = false; }, 700);
  }
  let y0 = null;
  addEventListener("touchstart", (e) => { y0 = scrollY <= 0 && $("shade").hidden ? e.touches[0].clientY : null; }, { passive: true });
  addEventListener("touchmove", (e) => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 10 && !busyLoad) { $("pull").classList.add("on"); $("pull").textContent = dy > 70 ? "놓으면 새로고침" : "아래로 당기면 새로고침"; } }, { passive: true });
  addEventListener("touchend", (e) => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 70) refresh(); else if (!busyLoad) $("pull").classList.remove("on"); });
  $("reload").onclick = refresh;
  refresh();
})();
</script>
